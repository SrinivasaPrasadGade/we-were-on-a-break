<title>The Gang's All Here</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A co-op sitcom puzzle-platformer. Six friends, one café couch, thirteen episodes of everyday disasters.">
<style>
  /* One-screen game: a dark stage that letterboxes a 480x270 pixel-art canvas. Single deliberate look. */
  :root { --bg: #140d1a; --ink: #f6ead8; --accent: #ffcf5a; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overscroll-behavior: none;
    font: 14px system-ui, sans-serif;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  #screen {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; outline: none; cursor: default;
  }
  #screen:focus-visible:not([data-ptr]) { outline: 2px solid var(--accent); outline-offset: -2px; }
  noscript { display: block; padding: 2rem; text-align: center; }
  #rotate {
    display: none; position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom, 0px));
    text-align: center; color: #9a8aaa; font: 13px ui-monospace, Menlo, Consolas, monospace; pointer-events: none;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
<div id="stage"><canvas id="screen" tabindex="0" aria-label="The Gang's All Here, a sitcom puzzle-platformer. Click or press a key to start."></canvas><div id="rotate" aria-hidden="true">&#8635; Turn your phone sideways for a bigger stage</div></div>
<noscript>The Gang's All Here needs JavaScript to run.</noscript>
