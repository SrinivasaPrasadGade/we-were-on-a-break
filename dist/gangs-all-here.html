<title>The Gang's All Here</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A co-op sitcom puzzle-platformer. Six friends, one café couch, thirteen episodes of everyday disasters.">
<style>
  /* One-screen game: a dark stage that letterboxes a 480x270 pixel-art canvas. Single deliberate look. */
  :root { --bg: #140d1a; --ink: #f6ead8; --accent: #ffcf5a; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overscroll-behavior: none;
    font: 14px system-ui, sans-serif;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  #screen {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; outline: none; cursor: default;
  }
  #screen:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  noscript { display: block; padding: 2rem; text-align: center; }
</style>
<div id="stage"><canvas id="screen" tabindex="0" aria-label="The Gang's All Here, a sitcom puzzle-platformer. Click or press a key to start."></canvas></div>

// Buttons are laid out in buffer coordinates (480x270).
function layoutTouchButtons() {
  const B = [];
  B.push({ id: 'left', x: 6, y: 206, w: 46, h: 46, label: '←' });
  B.push({ id: 'right', x: 56, y: 206, w: 46, h: 46, label: '→' });
  B.push({ id: 'up', x: 108, y: 186, w: 34, h: 32, label: '↑' });
  B.push({ id: 'down', x: 108, y: 222, w: 34, h: 32, label: '↓' });
  B.push({ id: 'jump', x: 426, y: 204, w: 48, h: 48, label: 'JUMP', round: true });
  B.push({ id: 'act', x: 372, y: 214, w: 46, h: 46, label: 'E', round: true });

layoutTouchButtons();

    if (x >= b.x - pad && x < b.x + b.w + pad && y >= b.y - pad && y < b.y + b.h + pad) {

        const decay = name === 'glock' ? 0.5 : name === 'bell' ? 1.2 : name === 'steel' ? 0.35 : name === 'celesta' ? 0.45 : 0.9;
        const os = parts.map(([m, a], i) => {
          const o = this.osc('sine', f * m, t, null);
          const og = c.createGain(); og.gain.setValueAtTime(a, t); og.gain.setTargetAtTime(0.0001, t, decay / (1 + i * 0.8));
          o.connect(og); og.connect(g); return o;
        });
        if (name === 'vib') {
          const lfo = c.createOscillator(); lfo.frequency.value = 5.5;
          const lg = c.createGain(); lg.gain.value = 0.25; lfo.connect(lg); lg.connect(g.gain);
          lfo.start(t); lfo.stop(t + dur + 1.5);
        }
        const peak = vel * (name === 'vib' ? 0.26 : 0.3);
        g.gain.setValueAtTime(peak, t);
        const end = t + Math.max(dur, decay * 2);
        g.gain.setTargetAtTime(0.0001, t + dur + 0.2, 0.2);
        os.forEach(o => { o.start(t); o.stop(end + 0.4); });
        break;
      }
      // ---- drums ----
      case 'kick': {
        const g = this.gain(0, dest);
        const o = this.osc('sine', 150, t, g);
        o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
        g.gain.setValueAtTime(vel * 0.95, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        o.start(t); o.stop(t + 0.35);
        const cg = this.gain(0, dest); const hp = this.filt('highpass', 2500, 0.7, cg);
        cg.gain.setValueAtTime(vel * 0.2, t); cg.gain.exponentialRampToValueAtTime(0.001, t + 0.012);
        this.noise(t, 0.02, hp);
        break;
      }
      case 'snare': {
        const g = this.gain(0, dest); const hp = this.filt('highpass', 1200, 0.7, g);
        g.gain.setValueAtTime(vel * 0.42, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
        this.noise(t, 0.2, hp);
        const tg = this.gain(0, dest); const o = this.osc('triangle', 190, t, tg);
        o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
        tg.gain.setValueAtTime(vel * 0.4, t); tg.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        o.start(t); o.stop(t + 0.1);
        break;
      }
      case 'hat': case 'ohat': {
        const g = this.gain(0, dest); const hp = this.filt('highpass', 7500, 0.7, g);
        const d = name === 'ohat' ? 0.28 : 0.045;
        g.gain.setValueAtTime(vel * 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
        this.noise(t, d + 0.02, hp);
        break;
      }
      case 'clap': {
        const g = this.gain(0, dest); const bp = this.filt('bandpass', 1150, 1.1, g);
        g.gain.setValueAtTime(0.0001, t);
        [0, 0.011, 0.022].forEach(o => { g.gain.setValueAtTime(vel * 0.5, t + o); g.gain.exponentialRampToValueAtTime(vel * 0.1, t + o + 0.009); });
        g.gain.setValueAtTime(vel * 0.45, t + 0.033); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        this.noise(t, 0.18, bp);
        break;
      }
      case 'rim': case 'block': {
        const g = this.gain(0, dest);
        const o = this.osc(name === 'rim' ? 'triangle' : 'sine', name === 'rim' ? 1700 : 950, t, g);
        g.gain.setValueAtTime(vel * 0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + (name === 'rim' ? 0.035 : 0.06));
        o.start(t); o.stop(t + 0.08);
        break;
      }
      case 'shaker': case 'tamb': {
        const g = this.gain(0, dest); const bp = this.filt(name === 'tamb' ? 'highpass' : 'bandpass', name === 'tamb' ? 7000 : 6000, 1.5, g);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel * (name === 'tamb' ? 0.22 : 0.12), t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, t + (name === 'tamb' ? 0.14 : 0.07));
        this.noise(t, 0.16, bp);
        break;
      }
      case 'crash': {
        const g = this.gain(0, dest); const hp = this.filt('highpass', 4500, 0.6, g);
        g.gain.setValueAtTime(vel * 0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
        this.noise(t, 1.7, hp, 0.9);
        break;
      }
      case 'tom': {
        const g = this.gain(0, dest); const o = this.osc('sine', f || 140, t, g);
        o.frequency.exponentialRampToValueAtTime((f || 140) * 0.6, t + 0.25);
        g.gain.setValueAtTime(vel * 0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.32);
        break;
      }
      case 'brush': {
        const g = this.gain(0, dest); const bp = this.filt('bandpass', 3200, 0.8, g);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel * 0.16, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        this.noise(t, 0.22, bp);
        break;
      }
      case 'sleigh': {
        const g = this.gain(0, dest); const hp = this.filt('highpass', 6000, 1, g);
        g.gain.setValueAtTime(0.0001, t);
        for (let i = 0; i < 4; i++) { const o = t + i * 0.022; g.gain.linearRampToValueAtTime(vel * 0.16, o + 0.005); g.gain.exponentialRampToValueAtTime(vel * 0.02, o + 0.02); }
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        this.noise(t, 0.22, hp, 1.3);
        break;
      }
      case 'cowbell': {
        const g = this.gain(0, dest); const bp = this.filt('bandpass', 800, 3, g);
        const o1 = this.osc('square', 545, t, bp), o2 = this.osc('square', 815, t, bp);
        g.gain.setValueAtTime(vel * 0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o1.start(t); o1.stop(t + 0.32); o2.start(t); o2.stop(t + 0.32);
        break;
      }
      case 'snap': {
        const g = this.gain(0, dest); const bp = this.filt('bandpass', 2600, 2, g);
        g.gain.setValueAtTime(vel * 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        this.noise(t, 0.05, bp);
        break;
      }
      default: break;
    }
  },

  // ---- sound effects ---------------------------------------------------------------
  tone(o) {
    // {type, f0, f1, dur, vol, attack, t, dest, curve:'exp'|'lin', q, filter}
    if (!this.ok) return;
    const c = this.ctx, t = o.t || c.currentTime;
    const g = this.gain(0, o.dest || this.sfxBus);
    let tail = g;
    if (o.filter) { tail = this.filt(o.filter, o.ff || 2000, o.q || 1, g); }
    const osc = this.osc(o.type || 'square', o.f0, t, tail);
    if (o.f1 !== undefined) {
      if (o.curve === 'lin') osc.frequency.linearRampToValueAtTime(o.f1, t + o.dur);
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    }
    if (o.vib) {
      const l = c.createOscillator(); l.frequency.value = o.vib; const lg = c.createGain(); lg.gain.value = o.vibAmt || o.f0 * 0.05;
      l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + o.dur + 0.05);
    }
    const v = (o.vol || 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    osc.start(t); osc.stop(t + o.dur + 0.02);
  },
  nz(o) {
    // {dur, vol, f0, f1, type, q, t, attack}
    if (!this.ok) return;
    const c = this.ctx, t = o.t || c.currentTime;
    const g = this.gain(0, o.dest || this.sfxBus);
    const f = this.filt(o.type || 'bandpass', o.f0 || 1000, o.q || 1, g);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol || 0.3, t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    this.noise(t, o.dur + 0.02, f, o.rate);
  },

  sfx(name, opt) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime;
    opt = opt || {};
    const S = this;
    switch (name) {
      case 'jump': S.tone({ type: 'square', f0: 260, f1: 520, dur: 0.1, vol: 0.06, filter: 'lowpass', ff: 1800 }); break;
      case 'djump':
        S.nz({ dur: 0.22, vol: 0.12, f0: 600, f1: 3000, q: 2 });
        S.tone({ type: 'triangle', f0: 500, f1: 1200, dur: 0.16, vol: 0.08 }); break;
      case 'land': S.nz({ dur: 0.06, vol: 0.12, f0: 300, type: 'lowpass' }); break;
      case 'thud':
        S.tone({ type: 'sine', f0: 120, f1: 45, dur: 0.25, vol: 0.4 });
        S.nz({ dur: 0.15, vol: 0.25, f0: 400, type: 'lowpass' }); break;
      case 'push': S.nz({ dur: 0.18, vol: 0.06, f0: 250, f1: 180, type: 'lowpass', q: 0.7 }); break;
      case 'grunt': S.tone({ type: 'sawtooth', f0: 120, f1: 90, dur: 0.18, vol: 0.12, filter: 'bandpass', ff: 600, q: 3 }); break;
      case 'climb': S.nz({ dur: 0.04, vol: 0.06, f0: 1800, q: 3 }); break;
      case 'clink':
        S.tone({ type: 'sine', f0: 2600 + rnd(400), dur: 0.12, vol: 0.12 });
        S.tone({ type: 'sine', f0: 3900 + rnd(400), dur: 0.08, vol: 0.06 }); break;
      case 'spark':
        for (let i = 0; i < 4; i++) S.nz({ t: t + i * 0.03 + rnd(0.02), dur: 0.03, vol: 0.12, f0: 3000 + rnd(3000), q: 4 });
        break;
      case 'zap':
        S.tone({ type: 'sawtooth', f0: 70, dur: 0.4, vol: 0.18, filter: 'lowpass', ff: 1200, vib: 30, vibAmt: 25 });
        S.nz({ dur: 0.4, vol: 0.12, f0: 4000, q: 1 }); break;
      case 'fixed':
        [72, 76, 79, 84].forEach((m, i) => S.inst('glock', m, t + i * 0.06, 0.2, 0.7, S.sfxBus));
        break;
      case 'lever':
        S.nz({ dur: 0.07, vol: 0.2, f0: 900, q: 2 });
        S.tone({ type: 'square', f0: 140, f1: 90, dur: 0.12, vol: 0.12, filter: 'lowpass', ff: 600 }); break;
      case 'door':
        S.nz({ dur: 0.45, vol: 0.12, f0: 500, f1: 1400, q: 1.5 }); break;
      case 'creak':
        S.tone({ type: 'sawtooth', f0: 220, f1: 330, dur: 0.5, vol: 0.06, filter: 'bandpass', ff: 900, q: 6, vib: 18, vibAmt: 20, curve: 'lin' }); break;
      case 'gate':
        for (let i = 0; i < 5; i++) S.nz({ t: t + i * 0.07, dur: 0.06, vol: 0.12, f0: 2200, q: 6 });
        break;
      case 'magic':
        S.nz({ dur: 0.35, vol: 0.25, f0: 1200, f1: 200, type: 'lowpass' });
        [88, 91, 95, 100].forEach((m, i) => S.inst('celesta', m, t + 0.05 + i * 0.05, 0.15, 0.5, S.sfxBus));
        break;
      case 'poof': S.nz({ dur: 0.3, vol: 0.22, f0: 1500, f1: 250, type: 'lowpass' }); break;
      case 'cup':
        S.tone({ type: 'square', f0: 1319, dur: 0.07, vol: 0.06, filter: 'lowpass', ff: 5000 });
        S.tone({ type: 'square', f0: 1976, dur: 0.16, vol: 0.06, t: t + 0.06, filter: 'lowpass', ff: 5000 });
        break;
      case 'mug':
        [72, 76, 79, 84, 88, 91].forEach((m, i) => S.inst('glock', m, t + i * 0.07, 0.3, 0.8, S.sfxBus));
        S.inst('bell', 96, t + 0.45, 0.8, 0.6, S.sfxBus);
        break;
      case 'checkpoint':
        S.nz({ dur: 0.12, vol: 0.14, f0: 3000, f1: 1500, q: 1 });
        S.tone({ type: 'triangle', f0: 880, dur: 0.12, vol: 0.1, t: t + 0.08 }); break;
      case 'slide':
        S.tone({ type: 'sine', f0: 1400, f1: 260, dur: 0.75, vol: 0.2, vib: 9, vibAmt: 30 }); break;
      case 'slideup':
        S.tone({ type: 'sine', f0: 300, f1: 1500, dur: 0.5, vol: 0.18, vib: 9, vibAmt: 25 }); break;
      case 'boing':
        S.tone({ type: 'sine', f0: 180, f1: 520, dur: 0.3, vol: 0.25, vib: 22, vibAmt: 60 }); break;
      case 'spring':
        S.tone({ type: 'triangle', f0: 200, f1: 900, dur: 0.25, vol: 0.2, vib: 25, vibAmt: 50 }); break;
      case 'snap':
        S.nz({ dur: 0.05, vol: 0.4, f0: 3000, q: 1 });
        S.tone({ type: 'square', f0: 900, f1: 300, dur: 0.06, vol: 0.12 }); break;
      case 'ow': S.tone({ type: 'sawtooth', f0: 420, f1: 260, dur: 0.3, vol: 0.12, filter: 'bandpass', ff: 900, q: 4 }); break;
      case 'splash':
        S.nz({ dur: 0.4, vol: 0.3, f0: 2500, f1: 500, q: 0.8 });
        for (let i = 0; i < 5; i++) S.tone({ type: 'sine', f0: 900 + rnd(900), f1: 1800 + rnd(600), dur: 0.06, vol: 0.05, t: t + 0.1 + rnd(0.3) });
        break;
      case 'whistle':
        S.tone({ type: 'sine', f0: 2700, dur: 0.18, vol: 0.18, vib: 40, vibAmt: 120 });
        S.tone({ type: 'sine', f0: 2700, dur: 0.4, vol: 0.18, vib: 40, vibAmt: 120, t: t + 0.22 }); break;
      case 'crash':
        S.nz({ dur: 0.6, vol: 0.35, f0: 3000, f1: 800, q: 0.5 });
        S.tone({ type: 'sine', f0: 100, f1: 40, dur: 0.3, vol: 0.35 }); break;
      case 'pop': S.tone({ type: 'sine', f0: 400, f1: 900, dur: 0.08, vol: 0.18 }); break;
      case 'clack':
        S.nz({ dur: 0.05, vol: 0.4, f0: 1800, q: 1.5 });
        S.tone({ type: 'square', f0: 300, f1: 200, dur: 0.05, vol: 0.12 }); break;
      case 'select': S.tone({ type: 'square', f0: 660, dur: 0.05, vol: 0.06, filter: 'lowpass', ff: 3000 }); break;
      case 'move': S.tone({ type: 'square', f0: 440, dur: 0.03, vol: 0.04, filter: 'lowpass', ff: 2500 }); break;
      case 'confirm':
        S.tone({ type: 'square', f0: 660, dur: 0.06, vol: 0.06, filter: 'lowpass', ff: 3000 });
        S.tone({ type: 'square', f0: 990, dur: 0.1, vol: 0.06, t: t + 0.06, filter: 'lowpass', ff: 3000 }); break;
      case 'back': S.tone({ type: 'square', f0: 440, f1: 300, dur: 0.08, vol: 0.06, filter: 'lowpass', ff: 2000 }); break;
      case 'deny':
        S.tone({ type: 'square', f0: 180, dur: 0.08, vol: 0.08, filter: 'lowpass', ff: 1200 });
        S.tone({ type: 'square', f0: 150, dur: 0.12, vol: 0.08, t: t + 0.09, filter: 'lowpass', ff: 1200 }); break;
      case 'swap': S.nz({ dur: 0.12, vol: 0.08, f0: 800, f1: 2500, q: 2 }); break;
      case 'elevator':
        S.tone({ type: 'sine', f0: 1046, dur: 0.6, vol: 0.12 });
        S.tone({ type: 'sine', f0: 1318, dur: 0.6, vol: 0.08, t: t + 0.02 }); break;
      case 'hum': S.tone({ type: 'sawtooth', f0: 60, dur: 0.6, vol: 0.06, filter: 'lowpass', ff: 300 }); break;
      case 'robot':
        for (let i = 0; i < 3; i++) S.tone({ type: 'square', f0: 600 + rndi(0, 4) * 200, dur: 0.05, vol: 0.05, t: t + i * 0.07 }); break;
      case 'squeak': S.tone({ type: 'sine', f0: 1800, f1: 2400, dur: 0.08, vol: 0.08 }); break;
      case 'coo':
        S.tone({ type: 'sine', f0: 420, f1: 380, dur: 0.25, vol: 0.08, vib: 12, vibAmt: 25 });
        S.tone({ type: 'sine', f0: 400, f1: 360, dur: 0.3, vol: 0.08, vib: 12, vibAmt: 25, t: t + 0.3 }); break;
      case 'flutter':
        for (let i = 0; i < 8; i++) S.nz({ t: t + i * 0.035, dur: 0.03, vol: 0.08, f0: 1200, q: 1 }); break;
      case 'steam': S.nz({ dur: 0.8, vol: 0.12, f0: 5000, type: 'highpass', attack: 0.1 }); break;
      case 'ding': S.inst('bell', 88, t, 0.4, 0.5, S.sfxBus); break;
      case 'rip': S.nz({ dur: 0.15, vol: 0.15, f0: 2500, f1: 4000, q: 0.7 }); break;
      case 'type': S.tone({ type: 'square', f0: 1500 + rnd(300), dur: 0.015, vol: 0.03 }); break;
      case 'shutter':
        for (let i = 0; i < 6; i++) S.nz({ t: t + i * 0.05, dur: 0.05, vol: 0.1, f0: 900, q: 3 }); break;
      case 'tvon':
        S.tone({ type: 'sine', f0: 15000, dur: 0.4, vol: 0.02 });
        S.nz({ dur: 0.5, vol: 0.12, f0: 3000, q: 0.5 }); break;
      case 'caught':
        S.sfx('whistle'); break;
      case 'yay':
        [76, 79, 84].forEach((m, i) => S.inst('glock', m, t + i * 0.05, 0.2, 0.6, S.sfxBus)); break;
      case 'claps': // two quick hand claps
        S.inst('clap', 60, t, 0.1, 1, S.sfxBus); S.inst('clap', 60, t + 0.22, 0.1, 1, S.sfxBus); break;
      case 'powerdown':
        S.tone({ type: 'sawtooth', f0: 220, f1: 40, dur: 0.7, vol: 0.12, filter: 'lowpass', ff: 900 });
        S.nz({ dur: 0.25, vol: 0.12, f0: 2000, f1: 200, type: 'bandpass', q: 1 }); break;
      case 'powerup':
        S.tone({ type: 'sawtooth', f0: 50, f1: 240, dur: 0.6, vol: 0.1, filter: 'lowpass', ff: 1200 });
        [60, 67, 72].forEach((m, i) => S.inst('glock', m + 12, t + 0.35 + i * 0.07, 0.2, 0.5, S.sfxBus)); break;
      default: break;
    }
  },

  // tiny talking blips, per character voice
  blip(voice) {
    if (!this.ok) return;
    const V = VOICES[voice] || VOICES.npc;
    const t = this.ctx.currentTime;
    let f = V.f * (1 + (Math.random() - 0.5) * V.var);
    if (V.scale) f = mtof(V.scale[rndi(0, V.scale.length - 1)]);
    this.tone({ type: V.type, f0: f, f1: f * (V.slide || 0.92), dur: V.dur, vol: V.vol, filter: 'bandpass', ff: V.ff || f * 2.5, q: 1.2, t });
  },

  // ---- studio audience ---------------------------------------------------------------
  buildCrowd() {
    const jobs = [
      ['chuckle', 1], ['chuckle', 2], ['laugh', 3], ['laugh', 4], ['big', 5], ['big', 6],
      ['ooh', 7], ['aww', 8], ['applause', 9], ['cheer', 10], ['applause', 11],
    ];
    const run = () => {
      const j = jobs.shift();
      if (!j) { this.crowdReady = true; return; }
      try {
        const data = synthCrowd(j[0], j[1]);
        const b = this.ctx.createBuffer(2, data.L.length, data.sr);
        b.getChannelData(0).set(data.L); b.getChannelData(1).set(data.R);
        (this.crowd[j[0]] = this.crowd[j[0]] || []).push(b);
      } catch (e) { /* audience is a nicety */ }
      setTimeout(run, 16);
    };
    run();
  },

  // kind: chuckle | laugh | big | ooh | aww | applause | cheer
  audience(kind, vol) {
    if (!this.ok || !this.laughOn) return;
    const list = this.crowd[kind];
    if (!list || !list.length) return;
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = pick(list);
    src.playbackRate.value = rnd(0.94, 1.06);
    const g = this.gain(vol === undefined ? 0.85 : vol, this.crowdBus);
    src.connect(g); src.start(t);
    // duck music under the audience
    const dur = src.buffer.duration;
    const dg = this.musicDuck.gain;
    dg.cancelScheduledValues(t); dg.setTargetAtTime(0.45, t, 0.08); dg.setTargetAtTime(1, t + dur * 0.7, 0.4);
  },
};

const VOICES = {
  dex: { f: 115, var: 0.15, type: 'sawtooth', dur: 0.06, vol: 0.07, ff: 500 },
  mila: { f: 330, var: 0.25, type: 'square', dur: 0.04, vol: 0.05, ff: 1200 },
  theo: { f: 210, var: 0.2, type: 'square', dur: 0.05, vol: 0.05, ff: 900 },
  priya: { f: 300, var: 0.3, type: 'triangle', dur: 0.035, vol: 0.09 },
  benny: { f: 420, var: 0.3, type: 'square', dur: 0.04, vol: 0.045, ff: 1500 },
  juno: { f: 300, var: 0, type: 'triangle', dur: 0.06, vol: 0.09, scale: [67, 69, 71, 74, 76, 79], slide: 1 },
  gus: { f: 90, var: 0.1, type: 'sawtooth', dur: 0.07, vol: 0.07, ff: 400 },
  holloway: { f: 190, var: 0.1, type: 'square', dur: 0.05, vol: 0.05, ff: 1600 },
  roz: { f: 280, var: 0.35, type: 'triangle', dur: 0.07, vol: 0.09, slide: 1.05 },
  npc: { f: 200, var: 0.25, type: 'triangle', dur: 0.05, vol: 0.08 },
  sarge: { f: 900, var: 0.2, type: 'sine', dur: 0.04, vol: 0.06, slide: 1.3 },
  robot: { f: 600, var: 0.4, type: 'square', dur: 0.04, vol: 0.04, slide: 1 },
};

// ---------------------------------------------------------------------------
// Crowd synthesis (pure JS -> Float32Arrays). Formant-filtered voices.
// ---------------------------------------------------------------------------
const VOWELS = {
  a: [[800, 80], [1200, 90], [2500, 120]],
  e: [[520, 70], [1750, 100], [2550, 130]],

          [12, 13, 14, 15].forEach((st, k) => ev.push({ t: stepTime(bar, st), d: 0.1, inst: k < 2 ? 'tom' : 'snare', m: k < 2 ? 50 - k * 4 : 60, v: vol * (0.6 + k * 0.12) }));
        }
        if (p.crash && (bar % p.crash === 0)) ev.push({ t: bar * 4, d: 1, inst: 'crash', m: 60, v: vol * 0.8 });
      }
      continue;
    }
    if (p.hits) {
      // explicit list of [beat, inst, midi, dur, vel]
      for (const h of p.hits) ev.push({ t: h[0], inst: h[1], m: h[2] || 60, d: h[3] || 0.25, v: (h[4] || 1) * vol });
    }
  }
  ev.sort((a, b) => a.t - b.t);
  return { events: ev, bars, beats: bars * 4, bpm: def.bpm, loop: def.loop !== false, loopBeat: (def.loopBar || 0) * 4 };
}

const Music = {
  cur: null, name: null, cache: {},
  play(name, opts) {
    opts = opts || {};
    if (!SONGS[name]) return;
    this.wanted = name;
    if (!AudioSys.ok) return;
    if (this.name === name && this.cur && !opts.restart) return;
    this.stop(opts.crossfade !== undefined ? opts.crossfade : 0.4);
    const song = this.cache[name] || (this.cache[name] = compileSong(SONGS[name]));
    const bus = AudioSys.gain(0, AudioSys.musicDuck);
    const t = AudioSys.now() + 0.06;
    const vol = SONGS[name].vol || 1;
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.linearRampToValueAtTime(vol, t + (opts.fadeIn || 0.03));
    this.cur = { song, bus, start: t, offset: 0, cursor: 0, onEnd: opts.onEnd, endAt: null };
    this.name = name;
    this.update();
  },
  stop(fade) {
    if (!this.cur) { this.name = null; return; }
    const c = this.cur; this.cur = null; this.name = null;
    if (!AudioSys.ok) return;
    const t = AudioSys.now();
    try {
      c.bus.gain.cancelScheduledValues(t);
      c.bus.gain.setValueAtTime(c.bus.gain.value, t);
      c.bus.gain.linearRampToValueAtTime(0.0001, t + (fade || 0.05));
    } catch (e) { /* ignore */ }
    setTimeout(() => { try { c.bus.disconnect(); } catch (e) { /* ignore */ } }, (fade || 0.05) * 1000 + 2500);
  },
  update() {
    const c = this.cur;
    if (!c || !AudioSys.ok) return;
    const spb = 60 / c.song.bpm;
    const now = AudioSys.now(), ahead = now + 0.15;
    const evs = c.song.events;
    for (let guard = 0; guard < 400; guard++) {
      if (c.cursor >= evs.length) {
        if (c.song.loop) {
          c.offset += (c.song.beats - c.song.loopBeat) * spb;
          c.cursor = evs.findIndex(e => e.t >= c.song.loopBeat);
          if (c.cursor < 0) c.cursor = 0;
          continue;
        }
        if (!c.endAt) {
          c.endAt = c.start + c.offset + c.song.beats * spb;
        }
        if (now >= c.endAt) {
          const cb = c.onEnd; this.cur = null; this.name = null;
          setTimeout(() => { try { c.bus.disconnect(); } catch (e) { /* ignore */ } }, 3000);
          if (cb) cb();
        }
        return;
      }
      const e = evs[c.cursor];
      const t = c.start + c.offset + e.t * spb;
      if (t > ahead) break;
      if (t >= now - 0.03) AudioSys.inst(e.inst, e.m, t, e.d * spb, e.v, c.bus);
      c.cursor++;
    }
  },
  // play a one-off sequence on the SFX bus (no interruption of the current song)
  oneShot(name, vol) {
    if (!AudioSys.ok || !SONGS[name]) return 0;
    const song = this.cache[name] || (this.cache[name] = compileSong(SONGS[name]));
    const spb = 60 / song.bpm;
    const t0 = AudioSys.now() + 0.03;
    const g = AudioSys.gain(vol || 1, AudioSys.sfxBus);
    for (const e of song.events) AudioSys.inst(e.inst, e.m, t0 + e.t * spb, e.d * spb, e.v, g);
    setTimeout(() => { try { g.disconnect(); } catch (er) { /* ignore */ } }, song.beats * spb * 1000 + 3000);
    return song.beats * spb;
  },
  // play explicit notes [[beatOffset, midi, durBeats], ...] with an instrument
  notes(list, inst, bpm, vol, dest) {
    if (!AudioSys.ok) return;
    const spb = 60 / (bpm || 120), t0 = AudioSys.now() + 0.02;
    for (const n of list) AudioSys.inst(inst, n[1], t0 + n[0] * spb, (n[2] || 0.5) * spb, (vol || 0.8) * (n[3] || 1), dest || AudioSys.sfxBus);
  },
};

// Juno's improvised jingles: a melody generated from the lyric's syllable count
function playJingle(text, seed) {
  if (!AudioSys.ok) return 3;
  const R = mulberry32(seed || text.length * 31 + 7);
  const words = text.replace(/[^a-zA-Z ']/g, ' ').split(/\s+/).filter(Boolean);
  let syl = 0;
  for (const w of words) syl += Math.max(1, (w.toLowerCase().match(/[aeiouy]+/g) || []).length);
  syl = clamp(syl, 6, 22);
  const scale = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79];
  let idx = 4 + Math.floor(R() * 3);
  const notes = [];
  let beat = 0;
  for (let i = 0; i < syl; i++) {
    const last = i === syl - 1;
    if (last) idx = 7;
    else if (i === syl - 2) idx = R() < 0.5 ? 8 : 6;
    else { idx += Math.floor(R() * 5) - 2; idx = clamp(idx, 2, 10); }
    const dur = last ? 1.5 : (i % 4 === 3 ? 1 : 0.5);
    notes.push([beat, scale[idx], dur * 0.9]);
    beat += dur;
  }
  const bpm = 150, spb = 60 / bpm;
  Music.notes(notes, 'keytar', bpm, 0.8);
  // simple I-IV-V-I chord bed
  const chords = [[48, 52, 55], [53, 57, 60], [55, 59, 62], [48, 52, 55, 60]];
  const span = beat;
  const cl = [];
  for (let k = 0; k < 4; k++) chords[k].forEach(m => cl.push([k * span / 4, m, span / 4 * 0.95]));
  Music.notes(cl, 'ep', bpm, 0.55);
  Music.notes([[0, 36, span / 2], [span / 2, 43, span / 2]], 'bass', bpm, 0.6);
  return span * spb + 0.4;
}

function sectionsSong(order, extra) {
  const chords = [], mel = [], marks = {};
  for (const name of order) {
    const s = THEME[name];
    marks[name] = marks[name] || [];
    marks[name].push(chords.length);
    chords.push(...s.chords); mel.push(...s.mel);
  }
  return Object.assign({ chords, mel, marks }, extra || {});
}

function themeSong(order, opts) {
  const S = sectionsSong(order);
  const n = S.chords.length;
  const mask = (want) => S.chords.map((_, i) => {
    let sec = null;
    for (const k in S.marks) for (const st of S.marks[k]) if (i >= st && i < st + THEME[k].chords.length) sec = k;
    return want.includes(sec) ? 'x' : '.';
  }).join('');
  const parts = [
    { inst: 'keytar', vol: 0.55, mel: S.mel, mask: mask(['verse', 'chorus', 'outro', 'intro']) },
    { inst: 'gtr', vol: 0.5, mel: S.mel, oct: 0, mask: mask(['chorus', 'outro']) },
    { comp: 'jangle', inst: 'jangle', vol: 0.55, center: 64, mask: mask(['intro', 'verse']) },
    { comp: 'strum', inst: 'jangle', vol: 0.5, center: 62, mask: mask(['chorus', 'outro']) },

    { comp: 'stab', inst: 'brass', vol: 0.55, center: 65, mask: mask(['outro']) },

  // final chord
  const last = n - 1;
  parts.push({ hits: [[last * 4, 'crash', 60, 2, 1], [last * 4, 'kick', 60, 0.2, 1]], vol: 0.8 });
  return Object.assign({ bpm: 136, chords: S.chords, parts }, opts || {});

  function drawHead() {

  function drawHair(x, y, w, h, eyeY) {
    const hc = S.hair, hd = shade(S.hair, -0.25);
    switch (S.hairStyle) {
      case 'buzz':
        R(x + 1, y, w - 2, 2, hc); R(x, y + 1, 3, eyeY - y - 1, hc); R(x + w - 2, y + 1, 1, 1, hc); break;
      case 'pony':
        R(x + 1, y, w - 2, 2, hc); R(x, y + 1, 3, eyeY - y + 1, hc); R(x + w - 3, y + 2, 2, 1, hc); break;
      case 'messy':
        R(x, y, w, 2, hc); R(x, y + 2, 3, eyeY - y, hc);
        R(x + 1, y - 1, 2, 1, hc); R(x + 4, y - 2, 2, 2, hc); R(x + 7, y - 1, 2, 1, hc); R(x + w - 1, y + 2, 1, 2, hc);
        R(x + 3, y + 1, 1, 1, hd); break;
      case 'bob':

      case 'curly':

      case 'puffs':
        R(x + 1, y - 1, w - 2, 3, hc); R(x, y, 2, eyeY - y + 1, hc);
        circ(x + 1, y - 2, 3, hc); circ(x + w - 2, y - 2, 3, hc);
        R(x + w - 3, y - 4, 2, 1, S.hair2 || hc); R(x, y - 4, 2, 1, S.hair2 || hc); R(x + w - 1, y - 2, 1, 1, S.hair2 || hc); break;
      case 'bald':
        R(x, eyeY - 2, 3, 4, hc); R(x + 3, y, 3, 1, shade(S.skin, 0.25)); break;
      case 'combover':
        R(x, eyeY - 2, 3, 4, hc); for (let i = 1; i < w - 2; i += 2) R(x + i, y, 1, 1, hc); R(x + 1, y + 1, w - 4, 1, hc); break;
      case 'bouffant':
        R(x - 1, y - 2, w + 2, 4, hc); R(x - 2, y, 4, h - 2, hc); R(x + w - 1, y + 1, 2, 3, hc); break;
      case 'short':
        R(x, y, w, 2, hc); R(x, y + 2, 3, eyeY - y, hc); break;
      case 'slick':
        R(x, y - 1, w, 3, hc); R(x, y + 2, 2, eyeY - y - 1, hc); R(x + 1, y - 1, w - 2, 1, shade(hc, 0.3)); break;
      case 'long':
        R(x, y - 1, w, 3, hc); R(x - 1, y, 4, h + 2, hc); R(x + w - 1, y + 1, 1, 4, hc); break;
      case 'bun':
        R(x, y, w, 2, hc); R(x, y + 2, 3, eyeY - y, hc); circ(x + 1, y - 1, 2, hc); break;
      case 'spiky':
        R(x, y, w, 2, hc); R(x, y + 2, 3, eyeY - y, hc);

    }

  }
  function circ(cx2, cy2, r, c) {
    for (let yy = -r; yy <= r; yy++) {
      const ww = Math.round(Math.sqrt(r * r - yy * yy + 0.5));
      R(cx2 - ww, cy2 + yy, ww * 2 + 1, 1, c);

  }

  function drawFace(x, y, w, h, eyeY) {
    const ex1 = x + w - 5, ex2 = x + w - 2;
    const dark = '#20141c';
    const blink = P.blink;
    let e = expr;
    if (A.mimeface) { R(x + 1, y + 1, w - 1, h - 2, '#fafafa'); }
    const eyes = (style) => {
      if (style === 'closed') { R(ex1, eyeY + 1, 2, 1, dark); R(ex2, eyeY + 1, 1, 1, dark); return; }
      if (style === 'happy') { R(ex1, eyeY + 1, 1, 1, dark); R(ex1 + 1, eyeY, 1, 1, dark); R(ex2, eyeY, 1, 1, dark); R(ex2 + 1, eyeY + 1, 1, 1, dark); return; }
      if (style === 'wide') { R(ex1, eyeY - 1, 2, 3, '#fff'); R(ex1 + 1, eyeY, 1, 1, dark); R(ex2, eyeY - 1, 1, 3, '#fff'); R(ex2, eyeY, 1, 1, dark); return; }
      if (style === 'tight') { R(ex1, eyeY, 2, 1, dark); R(ex1 + 1, eyeY + 1, 1, 1, dark); R(ex2, eyeY, 1, 1, dark); R(ex2, eyeY + 1, 1, 1, dark); return; }
      if (style === 'spiral') { R(ex1, eyeY - 1, 2, 1, dark); R(ex1 + 1, eyeY, 1, 1, dark); R(ex1, eyeY + 1, 2, 1, dark); R(ex2, eyeY - 1, 1, 3, dark); return; }
      if (style === 'zap') { R(ex1, eyeY, 2, 2, '#fff'); R(ex2, eyeY, 1, 2, '#fff'); return; }
      if (style === 'half') { R(ex1, eyeY + 1, 1, 1, dark); R(ex2, eyeY + 1, 1, 1, dark); R(ex1, eyeY, 2, 1, shade(S.skin, -0.3)); return; }
      R(ex1 + 1, eyeY, 1, 2, dark); R(ex2, eyeY, 1, 2, dark);
    };
    const brows = (kind) => {
      const bc = A.brows === 'bushy' ? (S.hairStyle === 'bald' ? S.hair : shade(S.hair, 0.1)) : shade(S.hair === '#e8e3f0' ? '#9a8aa8' : S.hair, -0.1);
      const thick = A.brows === 'thick' || A.brows === 'bushy';
      const by = eyeY - 2;
      if (kind === 'up') { R(ex1, by - 1, 2, 1, bc); R(ex2, by - 1, 2, 1, bc); }
      else if (kind === 'angry') { R(ex1, by, 1, 1, bc); R(ex1 + 1, by + 1, 1, 1, bc); R(ex2, by + 1, 1, 1, bc); R(ex2 + 1, by, 1, 1, bc); }
      else if (kind === 'sad') { R(ex1, by + 1, 1, 1, bc); R(ex1 + 1, by, 1, 1, bc); R(ex2, by, 1, 1, bc); R(ex2 + 1, by + 1, 1, 1, bc); }
      else if (kind === 'one') { R(ex1, by, 2, 1, bc); R(ex2, by - 1, 2, 1, bc); }
      else { R(ex1, by, 2, 1, bc); R(ex2, by, 2, 1, bc); }
      if (thick) { R(ex1, by - (kind === 'up' ? 2 : 1), 2, 1, bc); }
    };
    const mx = x + w - 4, my = eyeY + 3;
    const lip = A.lipstick || '#7a2a2a';
    const mouth = (kind) => {
      switch (kind) {
        case 'smile': R(mx, my, 3, 1, dark); R(mx - 1, my - 1, 1, 1, dark); R(mx + 3, my - 1, 1, 1, dark); break;
        case 'grin': R(mx - 1, my - 1, 5, 2, dark); R(mx, my - 1, 3, 1, '#fff'); break;
        case 'open': R(mx, my - 1, 3, 2, dark); R(mx + 1, my, 1, 1, '#c0405a'); break;
        case 'o': R(mx + 1, my - 1, 2, 2, dark); break;
        case 'frown': R(mx, my - 1, 3, 1, dark); R(mx - 1, my, 1, 1, dark); R(mx + 3, my, 1, 1, dark); break;
        case 'flat': R(mx, my, 3, 1, dark); break;
        case 'smirk': R(mx, my, 2, 1, dark); R(mx + 2, my - 1, 1, 1, dark); break;
        case 'teeth': R(mx - 1, my - 1, 5, 2, '#fff'); R(mx - 1, my, 5, 1, '#bbb'); R(mx - 1, my - 1, 1, 2, dark); R(mx + 3, my - 1, 1, 2, dark); break;
        case 'wobble': R(mx - 1, my, 1, 1, dark); R(mx, my - 1, 1, 1, dark); R(mx + 1, my, 1, 1, dark); R(mx + 2, my - 1, 1, 1, dark); R(mx + 3, my, 1, 1, dark); break;
        default: R(mx, my, 2, 1, dark);
      }
      if (A.lipstick && (kind === 'smile' || kind === 'flat' || kind === 'smirk' || !kind)) R(mx, my, 3, 1, lip);
    };
    const talkOpen = P.talk && (Math.floor(t / 5) % 2 === 0);
    switch (e) {
      case 'happy': eyes(blink ? 'closed' : 'normal'); brows('up'); mouth(talkOpen ? 'open' : 'smile'); break;
      case 'grin': eyes('happy'); brows('up'); mouth(talkOpen ? 'open' : 'grin'); break;
      case 'talk': eyes(blink ? 'closed' : 'normal'); brows(''); mouth(talkOpen ? 'open' : 'smile'); break;
      case 'surprised': eyes('wide'); brows('up'); mouth('o'); break;
      case 'sad': eyes(blink ? 'closed' : 'normal'); brows('sad'); mouth(talkOpen ? 'open' : 'frown'); break;
      case 'angry': eyes('normal'); brows('angry'); mouth(talkOpen ? 'open' : 'frown'); break;
      case 'smug': eyes('half'); brows('one'); mouth(talkOpen ? 'open' : 'smirk'); break;
      case 'scared': eyes('wide'); brows('sad'); mouth('wobble'); R(x + w - 1, y + 1, 1, 2, '#9ad8ff'); break;
      case 'cry': eyes('closed'); brows('sad'); mouth('open');
        R(ex1, eyeY + 2 + (t >> 2) % 4, 1, 2, '#6ec6ff'); R(ex2 + 1, eyeY + 2 + ((t >> 2) + 2) % 4, 1, 2, '#6ec6ff'); break;
      case 'sleep': eyes('closed'); mouth('flat'); break;
      case 'dizzy': eyes('spiral'); mouth('wobble'); break;
      case 'strain': eyes('tight'); brows('angry'); mouth('teeth'); break;
      case 'pain': eyes('tight'); brows('sad'); mouth('open'); break;
      case 'focus': eyes(blink ? 'closed' : 'normal'); brows('angry'); mouth('flat'); break;
      case 'zapped': eyes('zap'); mouth('o'); break;
      case 'wink': R(ex1, eyeY + 1, 2, 1, dark); R(ex2, eyeY, 1, 2, dark); brows('one'); mouth('smile'); break;
      case 'love': R(ex1, eyeY, 2, 2, '#ff4f7a'); R(ex2, eyeY, 1, 2, '#ff4f7a'); brows('up'); mouth('smile'); break;

    if (A.stubble) { R(x + 3, y + h - 3, w - 4, 1, shade(S.skin, -0.12)); }
    if (A.mustache) {
      if (A.thinStache) R(mx - 1, my - 1, 4, 1, A.mustache);
      else { R(mx - 2, my - 1, 6, 2, A.mustache); R(mx - 3, my, 1, 2, A.mustache); }

  }

  function drawArm(pose, swing, back) {
    const col = back ? shade(sleeve, -0.2) : sleeve;
    const sk = back ? skinD : S.skin;
    const hand = A.gloves ? (back ? shade(A.gloves, -0.2) : A.gloves) : sk;
    const W2 = aw;

    const bx = tx0 + 1;             // back shoulder

    const sy = torsoTop + 1;
    const headL = hx0 - W2, headR = hx0 + hw + 1;
    const eyeY = headTop + Math.floor(hh / 2);
    // poses that reach away from the body mirror for the back arm
    switch (pose) {
      case 'up': case 'upshort': {
        const ax = back ? Math.min(bx - 1, headL) : Math.max(fx + 1, headR);
        const len = pose === 'up' ? armLen + 2 : 8;

        if (back) { R(bx - 2, sy, W2 + 2, W2, col); R(bx - 2 - W2, sy - 3, 2, 3, hand); }

      }
      case 'down': R(sx + swing, sy, W2, armLen - 2, col); R(sx + swing, sy + armLen - 2, W2, 2, hand); break;
      case 'forward': R(sx + 1, sy + 2, W2 + 5, W2, col); R(sx + W2 + 6, sy + 2, 2, W2, hand); break;
      case 'hip': R(sx + 1, sy + 1, W2, 3, col); R(sx + 2, sy + 4, W2, 2, hand); break;
      case 'back': R(bx - 2, sy + 2, W2, 4, col); R(bx - 3, sy + 5, 2, 2, hand); break;
      case 'phone': {
        R(fx, sy, W2, 4, col); R(fx + 1, sy - 2, W2 + 1, 3, col);
        R(headR - 1, eyeY + 1, 2, 3, hand);
        R(headR, eyeY - 2, 2, 4, '#222'); R(headR, eyeY - 1, 1, 2, '#6ad4ff');
        break;
      }
      case 'gesture': R(sx + 1, sy + 1, W2 + 3, W2, col); R(sx + W2 + 4, sy - 1, 2, 3, hand); break;
      case 'gesture2': R(sx + 1, sy + 2, W2 + 2, W2, col); R(sx + W2 + 3, sy + 1, 2, 3, hand); break;
      case 'keys': R(sx + 1, sy + 3, W2 + 2, W2, col); R(sx + W2 + 2, sy + 4 + ((t >> 3) % 2), 2, 2, hand); break;
      case 'wand': {
        const ax = Math.max(fx + 1, headR);
        R(fx, sy, ax - fx + W2, W2, col); R(ax, sy - 3, W2, 4, col); R(ax, sy - 5, W2, 2, hand);

// Sprite cache + blit

const SpriteCache = {
  map: new Map(),
  get(key, specFn, pose) {
    let c = this.map.get(key);
    if (c) return c;
    if (this.map.size > 900) this.map.clear();
    const [raw, rg] = makeCanvas(SPR_W, SPR_H);
    drawPerson(rg, specFn(), pose);
    c = outlineCanvas(raw);
    this.map.set(key, c);
    return c;
  },
};
function outlineCanvas(raw, col) {
  const [sil, sg] = makeCanvas(raw.width, raw.height);
  sg.drawImage(raw, 0, 0);
  sg.globalCompositeOperation = 'source-in';
  sg.fillStyle = col || OUTLINE;
  sg.fillRect(0, 0, raw.width, raw.height);
  const [out, og] = makeCanvas(raw.width + 2, raw.height + 2);
  og.drawImage(sil, 0, 1); og.drawImage(sil, 2, 1); og.drawImage(sil, 1, 0); og.drawImage(sil, 1, 2);
  og.drawImage(raw, 1, 1);
  return out;
}
const _specCache = new Map();
function cachedSpec(key, fn) {
  let s = _specCache.get(key);
  if (!s) { s = fn(); _specCache.set(key, s); }
  return s;
}
function personKey(id, pose) {
  return id + '|' + (pose.anim || 'idle') + '|' + (pose.frameKey !== undefined ? pose.frameKey : 0) + '|' + (pose.expr || '') + '|' + (pose.blink ? 1 : 0) + '|' + (pose.talk ? 1 : 0) + '|' + (pose.quirk || '');
}
// Normalise the pose's time into a frame key so caching works for animations
function frameKeyFor(pose) {
  const t = pose.t || 0;
  switch (pose.anim) {
    case 'walk': return Math.floor(t / (pose.fast ? 4 : 6)) % 4 + (pose.vx ? ':' + clamp(Math.round(Math.abs(pose.vx)), 0, 2) : '');
    case 'push': case 'pull': return Math.floor(t / 9) % 4;
    case 'fall': return Math.floor(t / 5) % 2;
    case 'climb': case 'crawl': return Math.floor(t / 8) % 2;
    case 'hold': return (t % 40 < 20) ? 0 : 1;
    case 'fix': return Math.floor(t / 6) % 2;
    case 'play': return Math.floor(t / 8) % 2;
    case 'talk': case 'charm': return Math.floor(t / 14) % 2 + (pose.talk ? ':' + (Math.floor(t / 5) % 2) : '');
    case 'cheer': return Math.floor(t / 8) % 2;
    case 'dance': return (Math.floor(t / 12) % 4) + ':' + (Math.floor(t / 6) % 2);
    case 'cry': return (Math.floor(t / 10) % 2) + ':' + ((t >> 2) % 4);
    case 'ow': return Math.floor(t / 7) % 2;
    case 'dizzy': return Math.round(Math.sin(t / 8) * 1.5);
    case 'idle': {
      let k = '';
      if (pose.quirk) {
        const q = pose.quirk;
        if (q === 'dex') k = (t % 120 < 50) ? 'q' : '';
        else if (q === 'mila') k = Math.floor(t / 7) % 2;
        else if (q === 'theo') k = (t >> 3) % 2;
        else if (q === 'benny') k = (t >> 2) % 3;
        else if (q === 'juno') k = Math.floor(t / 10) % 2 + ':' + ((t >> 4) % 2);
        else if (q === 'priya') k = Math.floor(t / 5) % 2;
      }
      return k + (pose.talk ? 't' + (Math.floor(t / 5) % 2) : '');
    }
    default: return pose.talk ? 't' + (Math.floor(t / 5) % 2) : 0;
  }
}

// Draw a person at bottom-centre (bx, by) in buffer space.
// opts: {flip, sx, sy (scale), alpha, tint}
function blitPerson(g, specId, specFn, pose, bx, by, opts) {
  opts = opts || {};
  pose.frameKey = frameKeyFor(pose);
  // the cache key must capture time-dependent details
  const key = specId + '|' + personKey('', pose) + (pose.anim === 'cry' || pose.expr === 'cry' ? '|' + ((pose.t >> 2) % 4) : '') + (pose.vxk !== undefined ? '|' + pose.vxk : '');
  const spr = SpriteCache.get(key, specFn, pose);
  const sx = opts.sx || 1, sy = opts.sy || 1;
  const w = spr.width * sx, h = spr.height * sy;
  const px = Math.round(bx - (SPR_W / 2 + 1) * sx), py = Math.round(by - (FOOT_Y + 1) * sy);
  const prev = g.globalAlpha;
  if (opts.alpha !== undefined) g.globalAlpha = prev * opts.alpha;
  if (opts.flip) {
    g.save();
    g.translate(Math.round(bx), 0);
    g.scale(-1, 1);
    g.drawImage(spr, Math.round(-(SPR_W / 2 + 1) * sx), py, Math.round(w), Math.round(h));
    g.restore();
  } else {
    g.drawImage(spr, px, py, Math.round(w), Math.round(h));
  }
  g.globalAlpha = prev;
}

function drawWallPattern(g, th, x0, y0, w, h, seed) {
  const A = th.wallA, B = th.wallB;
  g.fillStyle = A; g.fillRect(x0, y0, w, h);
  const R = (x, y, ww, hh, c) => { g.fillStyle = c; g.fillRect(x, y, ww, hh); };
  switch (th.wall) {
    case 'stripes':
      for (let x = x0; x < x0 + w; x += 12) { R(x, y0, 3, h, B); R(x + 7, y0, 1, h, shade(A, 0.06)); }
      for (let y = y0 + 6; y < y0 + h; y += 16) for (let x = x0 + 5; x < x0 + w; x += 12) R(x, y, 1, 1, shade(A, 0.12));
      break;
    case 'damask':
      for (let y = y0; y < y0 + h; y += 12) for (let x = x0 + ((y / 12) % 2 ? 6 : 0); x < x0 + w; x += 12) {
        R(x + 2, y + 4, 1, 3, B); R(x + 1, y + 5, 3, 1, B); R(x + 2, y + 2, 1, 1, B); R(x + 2, y + 8, 1, 1, B);
      }
      break;
    case 'brick':
      for (let y = y0, r = 0; y < y0 + h; y += 6, r++) {
        R(x0, y + 5, w, 1, B);
        for (let x = x0 + (r % 2 ? 6 : 0); x < x0 + w; x += 12) { R(x, y, 1, 5, B); if (hash2(x, y, seed) < 0.15) R(x + 2, y + 1, 7, 3, shade(A, -0.07)); }
      }
      break;
    case 'tiles':
      for (let y = y0; y < y0 + h; y += 8) R(x0, y, w, 1, B);
      for (let x = x0; x < x0 + w; x += 8) R(x, y0, 1, h, B);
      for (let y = y0 + 1; y < y0 + h; y += 8) for (let x = x0 + 1; x < x0 + w; x += 8) R(x, y, 2, 1, shade(A, 0.18));
      break;
    case 'panel':
      for (let x = x0; x < x0 + w; x += 16) { R(x, y0, 1, h, B); R(x + 1, y0, 1, h, shade(A, 0.1)); }
      for (let y = y0; y < y0 + h; y += 48) R(x0, y, w, 2, B);
      break;
    case 'cinder':
      for (let y = y0, r = 0; y < y0 + h; y += 8, r++) {
        R(x0, y + 7, w, 1, B);
        for (let x = x0 + (r % 2 ? 8 : 0); x < x0 + w; x += 16) R(x, y, 1, 7, B);
      }
      break;
    case 'corrugated':
      for (let x = x0; x < x0 + w; x += 4) { R(x, y0, 1, h, B); R(x + 2, y0, 1, h, shade(A, 0.1)); }
      for (let y = y0; y < y0 + h; y += 64) R(x0, y, w, 2, shade(B, -0.2));
      break;
    case 'curtain':
      for (let x = x0; x < x0 + w; x += 10) { R(x, y0, 3, h, B); R(x + 5, y0, 2, h, shade(A, 0.12)); }
      break;
    case 'cafe':
      // warm wallpaper over dark wood wainscot (wainscot drawn per-row by floor tops)
      for (let x = x0; x < x0 + w; x += 10) R(x, y0, 1, h, shade(A, -0.08));
      for (let y = y0 + 5; y < y0 + h; y += 10) for (let x = x0 + 5; x < x0 + w; x += 10) { R(x, y, 1, 1, shade(A, 0.2)); }
      break;
    case 'subway':
      for (let y = y0; y < y0 + h; y += 6) R(x0, y, w, 1, shade(A, -0.12));
      for (let x = x0; x < x0 + w; x += 10) R(x, y0, 1, h, shade(A, -0.12));
      break;
    case 'train':
      for (let x = x0; x < x0 + w; x += 32) R(x, y0, 2, h, B);
      break;
    case 'expo':
      for (let x = x0; x < x0 + w; x += 24) R(x, y0, 1, h, B);
      for (let y = y0; y < y0 + h; y += 24) R(x0, y, w, 1, B);
      break;
    case 'airport':
      for (let x = x0; x < x0 + w; x += 32) R(x, y0, 2, h, B);
      for (let y = y0 + 20; y < y0 + h; y += 40) R(x0, y, w, 1, B);
      break;
    default: break;
  }
}

function drawSolidTile(g, th, x, y, top, left, right, bottom, tx, ty, code) {

    R(1, 6, 14, 8, '#54545c'); R(3, 9, 3, 3, '#8a8a92'); R(10, 9, 3, 3, '#8a8a92');
    return;
  }
  // fill
  const fA = th.fillA, fB = th.fillB;
  R(0, 0, 16, 16, fA);

      break;
    case 'concrete':

      R((n * 13 | 0) % 15, (n * 97 | 0) % 15, 1, 1, fB);
      break;
    case 'dirt':
      R((n * 30 | 0) % 14, (n * 70 | 0) % 14, 2, 2, fB); R((n * 51 | 0) % 14, (n * 17 | 0) % 14, 1, 1, fB);
      break;
    case 'metal':

      if (n < 0.3) R((n * 40 | 0) % 15, (n * 90 | 0) % 15, 1, 1, shade(fA, 0.1));
      break;
  }
  if (left) { R(0, 0, 2, 16, shade(fA, 0.16)); R(0, 0, 1, 16, shade(fA, 0.28)); }
  if (right) { R(14, 0, 2, 16, shade(fA, -0.3)); R(15, 0, 1, 16, '#1b1020'); }
  if (bottom) { R(0, 13, 16, 3, shade(fA, -0.35)); R(0, 15, 16, 1, '#1b1020'); }
  if (top) {
    const A = th.floorA, B = th.floorB;
    switch (th.floor) {
      case 'wood':
        R(0, 0, 16, 5, A); R(0, 4, 16, 1, B); R((tx % 2) ? 5 : 11, 0, 1, 4, B); R(0, 0, 16, 1, shade(A, 0.2)); R(0, 5, 16, 1, shade(fA, -0.3));

      case 'carpet':

        break;
      case 'checker':
        for (let i = 0; i < 16; i += 4) R(i, 0, 4, 5, ((i / 4 + tx * 4) % 2) ? B : A);
        R(0, 0, 16, 1, 'rgba(255,255,255,0.25)'); R(0, 5, 16, 1, shade(fA, -0.3));
        break;
      case 'tile':
        R(0, 0, 16, 5, A); R(0, 4, 16, 1, B); R(7, 0, 1, 4, B); R(15, 0, 1, 4, B); R(0, 0, 16, 1, shade(A, 0.15));
        break;
      case 'marble':
        R(0, 0, 16, 5, A); R(0, 4, 16, 1, B); R(((tx * 5) % 12), 1, 4, 1, B); R(0, 0, 16, 1, '#fff');
        break;
      case 'concrete':
        R(0, 0, 16, 4, A); R(0, 0, 16, 1, shade(A, 0.18)); R(0, 4, 16, 1, B); if (n < 0.4) R(n * 30 % 14, 2, 2, 1, B);
        break;

function drawOnewayTile(g, th, x, y, tx, ty, room) {
  const R = (a, b, w, h, c) => { g.fillStyle = c; g.fillRect(x + a, y + b, w, h); };
  const leftCont = room.code(tx - 1, ty) === TL.ONEWAY, rightCont = room.code(tx + 1, ty) === TL.ONEWAY;
  switch (th.oneway) {
    case 'grate': case 'catwalk': case 'rack':
      R(0, 0, 16, 2, '#4a4e56'); R(0, 2, 16, 2, '#2e3238');
      for (let i = 1; i < 16; i += 3) R(i, 1, 1, 2, '#6a707a');
      if (!leftCont) R(0, 0, 2, 8, '#3a3e46');
      if (!rightCont) R(14, 0, 2, 8, '#3a3e46');
      if (th.oneway === 'grate' && tx % 3 === 0) R(7, 4, 2, 10, 'rgba(40,44,52,0.6)');
      break;
    case 'branch':
      R(0, 0, 16, 4, '#6a4a30'); R(0, 0, 16, 1, '#f4f8fc'); R(3, 4, 4, 2, '#5a3a24');

    case 'booth':
      R(0, 0, 16, 4, '#d8dce4'); R(0, 0, 16, 1, '#ffffff'); R(0, 4, 16, 1, '#6a7488'); if (tx % 2) R(4, 1, 8, 2, '#4cc9f0');
      break;
    case 'shelf': default:
      R(0, 0, 16, 3, '#8a5a34'); R(0, 0, 16, 1, '#b07a4a'); R(0, 3, 16, 1, '#4a2e1a');
      if (!leftCont) { R(1, 3, 2, 4, '#5a3a22'); }
      if (!rightCont) { R(13, 3, 2, 4, '#5a3a22'); }

}

function drawLadderTile(g, x, y, top) {
  const R = (a, b, w, h, c) => { g.fillStyle = c; g.fillRect(x + a, y + b, w, h); };

}
const MILA_COL = '#2ec4b6';
function drawClimbTile(g, th, x, y, tx, ty, room) {
  const R = (a, b, w, h, c) => { g.fillStyle = c; g.fillRect(x + a, y + b, w, h); };
  const topEnd = room.code(tx, ty - 1) !== TL.CLIMB;
  switch (th.climb) {

      if (ty % 3 === 0) R(6, 6, 4, 2, MILA_COL);

    case 'pole': case 'truss':

      if (ty % 2 === 0) R(5, 7, 6, 2, MILA_COL);

      R(4 + (ty % 2) * 5, 5, 3, 1, shade(MILA_COL, -0.4)); R(9 - (ty % 2) * 5, 12, 3, 1, shade(MILA_COL, -0.4));

const HAZARD_STYLES = {};
function drawHazardTile(g, th, x, y, t, tx) {
  const R = (a, b, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x + a), Math.round(y + b), w, h); };
  switch (th.hazard) {
    case 'mousetrap':
      R(2, 12, 12, 4, '#c89a5a'); R(2, 12, 12, 1, '#e0b878'); R(3, 9, 1, 4, '#c0c0c8'); R(3, 9, 9, 1, '#c0c0c8'); R(11, 13, 2, 2, '#ffd23f');
      break;
    case 'puddle': {
      R(0, 13, 16, 3, '#3a6a9a'); R(2, 13, 10, 1, '#7ab0e0');
      const sp = (t + tx * 13) % 40 < 8;
      if (sp) { R(6, 8, 1, 5, '#ffe866'); R(7, 10, 2, 1, '#fff'); R(8, 6, 1, 4, '#ffe866'); }
      R(12, 9, 4, 1, '#222'); R(14, 10, 1, 3, '#222');
      break;
    }
    case 'coals':
      R(0, 11, 16, 5, '#3a2a2a');
      for (let i = 0; i < 16; i += 4) R(i + 1, 12, 3, 2, ((t >> 3) + i + tx) % 3 ? '#ff6a2a' : '#ffd23f');
      break;
    case 'slush':
      R(0, 12, 16, 4, '#8a9aa8'); R(1, 12, 14, 1, '#c8d4de'); R((t >> 4) % 12, 14, 3, 1, '#6a7a88');
      break;
    case 'suds':
      for (let i = 0; i < 16; i += 5) { const b = Math.sin((t + i * 7 + tx * 3) / 9) * 1.5; R(i, 10 + b, 5, 6 - b, '#f4f8ff'); R(i + 1, 10 + b, 2, 1, '#ffffff'); }
      R(0, 14, 16, 2, '#9ad0e8');
      break;
    case 'tesla':
      R(5, 6, 6, 10, '#5a6070'); R(4, 4, 8, 3, '#c0c8d0');
      if ((t + tx * 5) % 30 < 10) { R(2, 0, 1, 5, '#a8e8ff'); R(13, 1, 1, 4, '#a8e8ff'); R(7, 0, 2, 4, '#ffffff'); }
      break;
    default:
      R(0, 12, 16, 4, '#aa3333');
  }
}

// ---------------------------------------------------------------------------
// Parallax backgrounds
// ---------------------------------------------------------------------------
const BGCache = new Map();
function skylineStrip(th, kind, col, h, seed, night, lit) {
  const key = kind + col + h + seed + night + lit;
  let c = BGCache.get(key);
  if (c) return c;
  const w = 960;
  const [cv, g] = makeCanvas(w, h);
  const R2 = mulberry32(seed);
  const R = (a, b, ww, hh, cc) => { g.fillStyle = cc; g.fillRect(a, b, ww, hh); };
  if (kind === 'skyline' || kind === 'buildings') {
    let x = 0;
    while (x < w) {
      const bw = 24 + Math.floor(R2() * (kind === 'skyline' ? 40 : 56));
      const bh = Math.floor(h * (0.35 + R2() * 0.6));
      R(x, h - bh, bw, bh, col);
      if (R2() < 0.3) R(x + bw / 2 - 2, h - bh - 8, 4, 8, col);
      if (R2() < 0.2 && kind === 'buildings') { R(x + 4, h - bh - 10, 10, 10, col); R(x + 6, h - bh - 14, 6, 4, col); }
      // windows
      const wc = night || lit ? '#ffd88a' : shade(col, 0.15);
      for (let wy = h - bh + 6; wy < h - 4; wy += kind === 'skyline' ? 7 : 9) {
        for (let wx = x + 3; wx < x + bw - 4; wx += kind === 'skyline' ? 5 : 7) {
          if (night || lit) { if (R2() < 0.35) R(wx, wy, 2, 3, wc); }
          else if (R2() < 0.6) R(wx, wy, 2, 3, wc);
        }
      }
      x += bw + Math.floor(R2() * 6);
    }
  } else if (kind === 'trees') {
    for (let x = 0; x < w; x += 20 + Math.floor(R2() * 20)) {
      const th2 = 40 + R2() * 50;
      R(x + 8, h - th2 * 0.4, 4, th2 * 0.4, shade(col, -0.2));
      for (let k = 0; k < 4; k++) R(x + k * 2, h - th2 + k * 9, 20 - k * 4, 10, col);
      R(x + 2, h - th2 - 1, 16, 3, '#f4f8fc');
    }
  } else if (kind === 'tanks') {
    let x = 0;
    while (x < w) {
      const bw = 40 + Math.floor(R2() * 60), bh = Math.floor(h * (0.2 + R2() * 0.4));
      R(x, h - bh, bw, bh, col);
      if (R2() < 0.5) { // water tower
        const tx2 = x + 10;
        R(tx2, h - bh - 30, 22, 20, shade(col, -0.1)); R(tx2 - 2, h - bh - 34, 26, 5, shade(col, -0.2));
        R(tx2 + 2, h - bh - 10, 2, 10, col); R(tx2 + 18, h - bh - 10, 2, 10, col);
      }
      x += bw + 10 + Math.floor(R2() * 30);
    }
  }
  BGCache.set(key, cv);
  return cv;
}

function drawSky(g, th, camX, camY, t, roomH) {
  const night = th.night;
  const top = th.sky ? th.sky[0] : (night ? '#141030' : '#7cc6ef');
  const bot = th.sky ? th.sky[1] : (night ? '#3a2a5a' : '#d6f0fb');
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, top); grad.addColorStop(1, bot);
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  if (night) {
    for (let i = 0; i < 60; i++) {
      const sx = (hash2(i, 1, 4) * 600 - camX * 0.05) % 600, sy = hash2(i, 2, 4) * 160;
      const tw2 = (Math.sin(t / 30 + i) + 1) / 2;
      g.fillStyle = tw2 > 0.7 ? '#ffffff' : '#a8a8d8';
      g.fillRect(Math.round((sx + 600) % 600 - 60), Math.round(sy), 1, 1);
    }
    circleFill(400 - camX * 0.02, 40, 12, '#f4f0d8', g); circleFill(405 - camX * 0.02, 37, 10, top, g);
  } else if (th.sun) {
    circleFill(380 - camX * 0.02, 70, 22, '#fff2b0', g); circleFill(380 - camX * 0.02, 70, 18, '#ffe080', g);
  } else if (!th.weather) {
    // clouds
    for (let i = 0; i < 6; i++) {
      const cx2 = ((hash2(i, 7, 1) * 900 + t * 0.05 - camX * 0.1) % 900 + 900) % 900 - 100;
      const cy2 = 20 + hash2(i, 8, 1) * 60;
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.fillRect(Math.round(cx2), Math.round(cy2), 40, 8); g.fillRect(Math.round(cx2 + 8), Math.round(cy2 - 5), 22, 6); g.fillRect(Math.round(cx2 + 26), Math.round(cy2 - 3), 10, 4);
    }
  }
}

function drawFar(g, th, camX, camY, t, roomH) {
  if (th.far === 'tunnel') {
    g.fillStyle = '#121418'; g.fillRect(0, 0, W, H);
    // speeding tunnel lights
    for (let i = 0; i < 6; i++) {
      const lx = ((i * 140 - t * 9) % 840 + 840) % 840 - 180;
      g.fillStyle = '#ffd88a'; g.fillRect(lx, 60, 26, 3); g.fillRect(lx, 180, 26, 3);
      g.fillStyle = 'rgba(255,216,138,0.15)'; g.fillRect(lx - 10, 50, 46, 140);
    }
    for (let i = 0; i < 20; i++) { const lx = ((i * 50 - t * 14) % 1000 + 1000) % 1000 - 100; g.fillStyle = '#2a2e36'; g.fillRect(lx, 0, 6, H); }
    return;
  }
  if (th.far === 'airfield') {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#6ab8f0'); grad.addColorStop(0.6, '#c8e8fb'); grad.addColorStop(0.61, '#7a8a7a'); grad.addColorStop(1, '#5a6a5a');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.fillStyle = '#4a4a52'; g.fillRect(0, H * 0.66, W, 10);
    for (let i = 0; i < W; i += 30) { g.fillStyle = '#f0f0f0'; g.fillRect(((i - camX * 0.3) % W + W) % W, H * 0.66 + 4, 14, 2); }
    // a plane taking off now and then
    const p = (t % 900) / 900;
    const px = -80 + p * 700 - camX * 0.1, py = H * 0.62 - Math.max(0, p - 0.3) * 260;
    g.fillStyle = '#f4f4f8'; g.fillRect(px, py, 54, 8); g.fillRect(px + 40, py - 10, 8, 10); g.fillRect(px + 18, py + 3, 20, 4);
    g.fillStyle = '#3a6ac8'; g.fillRect(px, py + 3, 54, 2); g.fillRect(px + 40, py - 10, 8, 3);
    return;
  }
  // exterior-style sky + skylines (also seen through interior windows)
  const night = th.night || th.farNight;
  const ths = th.ext ? th : (night ? THEMES.street_night : THEMES.street);
  drawSky(g, ths, camX, camY, t, roomH);
  const far = skylineStrip(ths, 'skyline', ths.farCol || '#a7c3d6', 140, 11, night, ths.lit);
  const fx = -((camX * 0.2) % 960);
  const fy = H - 140 - 40 - Math.min(40, camY * 0.05);
  g.drawImage(far, Math.round(fx), Math.round(fy)); g.drawImage(far, Math.round(fx + 960), Math.round(fy));
  if (th.ext && th.mid) {
    const mid = skylineStrip(th, th.mid, th.midCol || '#8aa6bd', 170, 23, night, th.lit);
    const mx = -((camX * 0.45) % 960);
    const my = H - 170 - 10 - Math.min(60, camY * 0.15);
    g.drawImage(mid, Math.round(mx), Math.round(my)); g.drawImage(mid, Math.round(mx + 960), Math.round(my));
  }
}

// ---------------------------------------------------------------------------
// Room: parse map + tile physics
// ---------------------------------------------------------------------------
class Room {
  constructor(def, level) {
    this.def = def;
    this.level = level;
    this.theme = THEMES[def.theme] || THEMES.hall;
    const map = def.map;
    this.rows = map.length;
    this.cols = Math.max(...map.map(r => r.length));
    this.w = this.cols * T; this.h = this.rows * T;
    this.tiles = new Uint8Array(this.cols * this.rows);
    this.ents = [];
    this.decor = [];
    this.spawn = { x: 2 * T, y: (this.rows - 3) * T };
    this.flags = {};
    this.t = 0;
    const legend = Object.assign({}, def.ents || {});
    const decorLabels = (def.labels || []).slice();
    for (let y = 0; y < this.rows; y++) {
      const row = map[y];
      for (let x = 0; x < this.cols; x++) {
        const ch = row[x] || '.';
        let code = TL.EMPTY;
        switch (ch) {
          case '#': code = TL.SOLID; break;
          case '=': code = TL.ONEWAY; break;
          case 'H': code = TL.LADDER; break;
          case 'M': code = TL.CLIMB; break;
          case 'D': code = TL.DUCT; break;
          case '^': code = TL.HAZARD; break;
          case 'I': code = TL.ICE; break;
          case '{': code = TL.CONVL; break;
          case '}': code = TL.CONVR; break;
          case '@': this.spawn = { x: x * T, y: y * T + T }; break;
          case 'c': this.pendingEnts.push(['cup', {}, x, y]); break;
          case '*': this.pendingEnts.push(['mug', {}, x, y]); break;
          case 'k': this.pendingEnts.push(['checkpoint', {}, x, y]); break;
          case 'X': this.pendingEnts.push(['exit', legend.X || {}, x, y]); break;
          case '.': case ' ': break;
          default:
            if (ch >= 'a' && ch <= 'z') {
              const info = {};
              if ((ch === 'd' || ch === 's') && decorLabels.length) info.label = decorLabels.shift();
              const sz = decorSize(ch);
              this.decor.push({ ch, x: x * T, y: (y + 1) * T - sz[1] * T, info });
            } else if (legend[ch]) {
              const p = legend[ch];
              this.pendingEnts.push([p.t, p, x, y]);
            }
        }
        this.tiles[y * this.cols + x] = code;
      }
    }
  }
  get pendingEnts() {
    if (!this._pending) {
      this._pending = [];
      for (const e of this.def.extra || []) this._pending.push([e.t, e, e.x, e.y]);
    }
    return this._pending;
  }

  code(tx, ty) {
    if (tx < 0 || tx >= this.cols) return TL.SOLID;
    if (ty < 0) return this.def.openTop ? TL.EMPTY : (this.code(tx, 0) === TL.SOLID ? TL.SOLID : TL.EMPTY);
    if (ty >= this.rows) return TL.EMPTY;
    return this.tiles[ty * this.cols + tx];
  }
  setCode(tx, ty, c) { if (tx >= 0 && ty >= 0 && tx < this.cols && ty < this.rows) this.tiles[ty * this.cols + tx] = c; }
  solidAt(tx, ty) { return isSolidCode(this.code(tx, ty)); }
  ladderTop(tx, ty) { return this.code(tx, ty) === TL.LADDER && this.code(tx, ty - 1) !== TL.LADDER && !this.solidAt(tx, ty - 1); }
  climbTop(tx, ty) { return this.code(tx, ty) === TL.CLIMB && this.code(tx, ty - 1) !== TL.CLIMB && !this.solidAt(tx, ty - 1); }

  // does rect overlap any solid (tiles or solid entities)?
  rectBlocked(x, y, w, h, ignore, withBodies) {
    const tx0 = Math.floor(x / T), tx1 = Math.floor((x + w - 0.001) / T);
    const ty0 = Math.floor(y / T), ty1 = Math.floor((y + h - 0.001) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (this.solidAt(tx, ty)) return true;
    const r = { x, y, w, h };
    for (const s of this.ents) if (s.solid && s !== ignore && !s.oneway && overlap(r, s.colBox || s)) return true;
    if (withBodies) for (const f of this.level.friends) if (f !== ignore && f.present && !f.gone && overlap(r, f)) return true;
    return false;
  }

  // Horizontal move with collision. Returns the blocker (or null).
  moveX(b, dx, opts) {
    if (!dx) return null;
    opts = opts || {};
    let hit = null;
    const y0 = b.y, y1 = b.y + b.h - 0.001;
    const ty0 = Math.floor(y0 / T), ty1 = Math.floor(y1 / T);
    let nx = b.x + dx;
    if (dx > 0) {
      const tx = Math.floor((nx + b.w - 0.001) / T);
      for (let ty = ty0; ty <= ty1; ty++) if (this.solidAt(tx, ty)) { nx = tx * T - b.w; hit = { tile: true }; break; }
    } else {
      const tx = Math.floor(nx / T);
      for (let ty = ty0; ty <= ty1; ty++) if (this.solidAt(tx, ty)) { nx = (tx + 1) * T; hit = { tile: true }; break; }
    }
    const r = { x: nx, y: b.y, w: b.w, h: b.h };
    for (const s of this.ents) {
      if (!s.solid || s === b || s.oneway || (opts.ignore && opts.ignore(s))) continue;
      const c = s.colBox || s;
      if (overlap(r, c)) {
        if (dx > 0 && c.x >= b.x + b.w - 1) { nx = Math.min(nx, c.x - b.w); hit = s; }
        else if (dx < 0 && c.x + c.w <= b.x + 1) { nx = Math.max(nx, c.x + c.w); hit = s; }
        r.x = nx;
      }
    }
    if (opts.bodies) {
      for (const f of this.level.friends) {
        if (f === b || !f.present || f.gone || (opts.ignoreBody && opts.ignoreBody(f))) continue;
        if (overlap(r, f)) {
          if (dx > 0 && f.x >= b.x + b.w - 1) { nx = Math.min(nx, f.x - b.w); hit = f; }
          else if (dx < 0 && f.x + f.w <= b.x + 1) { nx = Math.max(nx, f.x + f.w); hit = f; }
          r.x = nx;
        }
      }
    }
    // never move backwards because of a block
    if (dx > 0) nx = Math.max(nx, b.x); else nx = Math.min(nx, b.x);
    b.x = nx;
    return hit;
  }

  // Vertical move. Handles one-way platforms & ladder tops. Returns {landed, ceiling, on}.
  moveY(b, dy, opts) {
    const res = { landed: false, ceiling: false, on: null, tile: 0 };
    if (!dy) return res;
    opts = opts || {};
    const tx0 = Math.floor(b.x / T), tx1 = Math.floor((b.x + b.w - 0.001) / T);
    if (dy > 0) {
      const prevBottom = b.y + b.h;
      const newBottom = prevBottom + dy;
      let land = Infinity, landTile = 0, on = null;
      const rowA = Math.floor(prevBottom / T), rowB = Math.floor((newBottom - 0.001) / T);
      for (let ty = rowA; ty <= rowB; ty++) {
        const top = ty * T;
        for (let tx = tx0; tx <= tx1; tx++) {
          const c = this.code(tx, ty);
          if (isSolidCode(c)) { if (top >= prevBottom - 0.01 && top < land) { land = top; landTile = c; } }
          else if (!opts.drop && (c === TL.ONEWAY || (!b.climbing && ((c === TL.LADDER && this.ladderTop(tx, ty)) || (c === TL.CLIMB && b.who === 'mila' && this.climbTop(tx, ty)))))) {
            if (prevBottom <= top + 0.01 && top < land) { land = top; landTile = c; }
          }
        }
      }
      for (const s0 of this.ents) {
        if (!s0.solid || s0 === b || (opts.ignore && opts.ignore(s0))) continue;
        if (s0.oneway && (opts.drop || b.climbing)) continue;
        const s = s0.colBox || s0;
        if (b.x + b.w <= s.x || b.x >= s.x + s.w) continue;
        const top = s.y;
        if (prevBottom <= top + 0.01 + (s0.dyFrame > 0 ? s0.dyFrame : 0) && newBottom >= top && top <= land) { land = top; on = s0; landTile = 0; }
      }
      if (land < Infinity && newBottom >= land) {
        b.y = land - b.h; res.landed = true; res.on = on; res.tile = landTile;
      } else b.y += dy;
    } else {
      let ny = b.y + dy;
      const ty = Math.floor(ny / T);
      for (let tx = tx0; tx <= tx1; tx++) if (this.solidAt(tx, ty)) { ny = (ty + 1) * T; res.ceiling = true; break; }
      const r = { x: b.x, y: ny, w: b.w, h: b.h };
      for (const s0 of this.ents) {
        if (!s0.solid || s0 === b || s0.oneway || (opts.ignore && opts.ignore(s0))) continue;
        const s = s0.colBox || s0;
        if (overlap(r, s) && s.y + s.h <= b.y + 0.5) { ny = Math.max(ny, s.y + s.h); res.ceiling = true; r.y = ny; }
      }
      b.y = Math.min(ny, b.y);
    }
    return res;
  }

  // what tile is under the body's feet (for ice/conveyors)
  groundCode(b) {
    const ty = Math.floor((b.y + b.h + 1) / T);
    const tx = Math.floor((b.x + b.w / 2) / T);
    return this.code(tx, ty);
  }
  overlapsCode(b, code, inset) {
    inset = inset || 0;
    const tx0 = Math.floor((b.x + inset) / T), tx1 = Math.floor((b.x + b.w - inset - 0.001) / T);
    const ty0 = Math.floor((b.y + inset) / T), ty1 = Math.floor((b.y + b.h - inset - 0.001) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (this.code(tx, ty) === code) return { tx, ty };
    return null;
  }
}

// Pre-render the static layers of a room
function renderRoomLayers(room) {
  const th = room.theme;
  const [back, bg] = makeCanvas(room.w, room.h);
  const [front, fg] = makeCanvas(room.w, room.h);
  // back wall / facade
  if (th.back === 'wall') {
    drawWallPattern(bg, th, 0, 0, room.w, room.h, 1);
    // baseboards and wainscot under floors
    for (let ty = 1; ty < room.rows; ty++) for (let tx = 0; tx < room.cols; tx++) {
      if (room.solidAt(tx, ty) && !room.solidAt(tx, ty - 1) && room.code(tx, ty - 1) !== TL.DUCT) {
        if (th.wall === 'cafe') { bg.fillStyle = th.wallB; bg.fillRect(tx * T, ty * T - 22, T, 22); bg.fillStyle = shade(th.wallB, 0.15); bg.fillRect(tx * T, ty * T - 22, T, 2); for (let i = 0; i < 16; i += 8) { bg.fillStyle = shade(th.wallB, -0.15); bg.fillRect(tx * T + i, ty * T - 18, 1, 16); } }
        bg.fillStyle = th.trim || '#2a1a1a'; bg.fillRect(tx * T, ty * T - 3, T, 3);
      }
    }
  } else if (th.back === 'facade') {
    const top = (th.roofline || 4) * T;
    bg.fillStyle = th.wallA; bg.fillRect(0, top, room.w, room.h - top);
    const fake = Object.assign({}, th, { wall: 'brick', wallA: mixCol(th.wallA, '#6a7a9a', 0.35), wallB: mixCol(th.wallB, '#4a5a7a', 0.35) });
    bg.fillStyle = fake.wallA; bg.fillRect(0, top, room.w, room.h - top);
    drawWallPattern(bg, fake, 0, top, room.w, room.h - top, 2);
    bg.fillStyle = shade(th.wallA, -0.3); bg.fillRect(0, top, room.w, 3);
    bg.fillStyle = shade(th.wallA, 0.15); bg.fillRect(0, top - 2, room.w, 2);
  }
  // vent interiors (empty cells boxed in by ducts)
  for (let ty = 0; ty < room.rows; ty++) for (let tx = 0; tx < room.cols; tx++) {
    if (room.code(tx, ty) !== TL.EMPTY) continue;
    const ud = room.code(tx, ty - 1) === TL.DUCT && room.code(tx, ty + 1) === TL.DUCT;
    const lr = room.code(tx - 1, ty) === TL.DUCT && room.code(tx + 1, ty) === TL.DUCT;
    const near = [[0, -1], [0, 1], [-1, 0], [1, 0]].filter(([a, b]) => room.code(tx + a, ty + b) === TL.DUCT).length >= 2;
    if (ud || lr || near) {
      bg.fillStyle = '#2e343a'; bg.fillRect(tx * T, ty * T, T, T);
      bg.fillStyle = '#3a4248'; bg.fillRect(tx * T, ty * T + 7, T, 1);
    }
  }
  // decor
  for (const d of room.decor) drawDecor(bg, d.ch, d.x, d.y, th, room, d.info);
  // push the back layer into the distance so solid ground reads clearly
  bg.save();
  bg.globalCompositeOperation = 'source-atop';
  bg.fillStyle = th.ext ? 'rgba(40,24,60,0.34)' : 'rgba(24,14,34,0.22)';
  bg.fillRect(0, 0, room.w, room.h);
  bg.restore();
  // cut window holes (show parallax)
  bg.save();
  bg.globalCompositeOperation = 'destination-out';
  for (const d of room.decor) {
    if (d.ch === 'w' && !th.ext) { bg.fillRect(d.x + 2, d.y + 2, 13, 13); bg.fillRect(d.x + 17, d.y + 2, 13, 13); bg.fillRect(d.x + 2, d.y + 17, 13, 13); bg.fillRect(d.x + 17, d.y + 17, 13, 13); }
  }
  if (th.back === 'wall' && room.def.openings) for (const o of room.def.openings) bg.fillRect(o[0] * T, o[1] * T, o[2] * T, o[3] * T);
  bg.restore();
  // tiles
  for (let ty = 0; ty < room.rows; ty++) for (let tx = 0; tx < room.cols; tx++) {
    const c = room.code(tx, ty);
    const x = tx * T, y = ty * T;
    if (isSolidCode(c)) {
      const top = !room.solidAt(tx, ty - 1) && ty > 0 || (ty === 0 && room.def.openTop);
      drawSolidTile(fg, th, x, y, top && c !== TL.DUCT ? true : (c === TL.DUCT ? !room.solidAt(tx, ty - 1) : false),
        !room.solidAt(tx - 1, ty), !room.solidAt(tx + 1, ty), !room.solidAt(tx, ty + 1) && ty < room.rows - 1, tx, ty, c);
    } else if (c === TL.ONEWAY) drawOnewayTile(fg, th, x, y, tx, ty, room);
    else if (c === TL.LADDER) drawLadderTile(fg, x, y, room.ladderTop(tx, ty));
    else if (c === TL.CLIMB) drawClimbTile(fg, th, x, y, tx, ty, room);
  }
  room.backCanvas = back; room.frontCanvas = front;
}

const NEED_ICON = { dex: 'dex', mila: 'mila', theo: 'theo', priya: 'priya', benny: 'benny', juno: 'juno' };

class Ent {
  constructor(room, tx, ty, p, wT, hT) {
    this.room = room; this.p = p || {};
    this.w = (this.p.w || wT || 1) * T; this.h = (this.p.h || hT || 1) * T;
    this.x = tx * T + (this.p.dx || 0);
    this.y = (ty + 1) * T - this.h + (this.p.dy || 0);
    this.id = this.p.id; this.link = this.p.link;
    this.solid = false; this.t = rndi(0, 200);
    this.tx = tx; this.ty = ty;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get level() { return this.room.level; }
  update() { this.t++; }
  draw() {}
  interactInfo() { return null; }
  use() {}
  useBox() { return { x: this.x - 6, y: this.y - 4, w: this.w + 12, h: this.h + 8 }; }
  setFlag(v) { if (this.id) this.level.setFlag(this.id, v); }
}

// ---- Crate (heavy pushable) -----------------------------------------------------
const CRATE_KINDS = {
  box: [1, 1], couch: [3, 1], vending: [1, 2], piano: [2, 2], fridge: [1, 2], amp: [1, 1], dresser: [2, 2], washer: [1, 1],
  snowball: [1, 1], cart: [2, 1], trunk: [2, 1], sandbag: [1, 1], bike: [2, 1], gym: [2, 1], grill: [2, 1], cooler: [1, 1],
  case: [2, 1], tophat: [2, 2], magnet: [1, 1], dumpster: [2, 2], suitcase: [1, 1], pianobig: [3, 2], speaker: [1, 2], boxes2: [1, 2],
  cakecart: [2, 2], terrarium: [2, 1], magicbox: [2, 2], botcrate: [2, 2], display: [1, 2], kmachine: [2, 2], bagstack: [2, 2],
};
class Crate extends Ent {
  constructor(room, tx, ty, p) {
    const k = CRATE_KINDS[p.kind || 'box'] || [1, 1];
    super(room, tx, ty, p, k[0], k[1]);
    this.kind = p.kind || 'box';
    this.solid = true; this.crate = true; this.vy = 0;
    this.home = { x: this.x, y: this.y };
    this.groundEnt = null; this.pushT = 0; this.wobble = 0;
  }
  update() {
    super.update();
    const room = this.room;
    if (this.wobble > 0) this.wobble--;
    this.vy = Math.min(this.vy + 0.3, 6);
    const res = room.moveY(this, this.vy);
    if (res.landed) {
      if (this.vy > 2.5) {
        AudioSys.sfx('thud'); this.level.shake(3); Particles.dust(this.cx, this.y + this.h, 8);
        this.level.crateLanded(this);
      }
      this.vy = 0; this.groundEnt = res.on; this.onGround = true;
    } else { this.onGround = false; this.groundEnt = null; }
    // conveyors
    const gc = room.groundCode(this);
    if (this.onGround && (gc === TL.CONVL || gc === TL.CONVR)) this.tryMove(gc === TL.CONVL ? -0.6 : 0.6);
    // bonk anyone underneath while falling
    if (this.vy > 2) {
      for (const f of this.level.friends) {
        if (!f.present || f.gone || f.mishapT > 0) continue;
        if (overlap(this, f)) f.mishap('bonk');
      }
    }
    if (this.y > room.h + 40) {
      this.x = this.home.x; this.y = this.home.y; this.vy = 0;
      Particles.puff(this.cx, this.cy, 14); AudioSys.sfx('poof');
    }
  }
  interactInfo(f) {
    if (this.p.fixed) return null;
    return f.who === 'dex' ? { ok: true, label: 'Grab (hold E)', prio: 1, hold: true } : { ok: false, need: 'dex', label: 'Too heavy', prio: 0 };
  }
  use(f) { if (f.who === 'dex') f.startGrab(this); }
  // move horizontally, carrying riders; blocked by walls, solids and people
  tryMove(dx) {
    const room = this.room;
    if (this.p.lockedUntil && !this.level.check(this.p.lockedUntil)) {
      if (this.lockT === undefined || this.t - this.lockT > 150) {
        this.lockT = this.t; this.wobble = 10;
        if (this.p.lockMsg) this.level.hint(this.p.lockNeed || null, this.p.lockMsg, 220);
        if (this.p.lockSay) this.level.queueLines(this.p.lockSay, 0);
      }
      return 0;
    }
    const before = this.x;
    const skip = f => f.groundEnt === this || f.pushingCrate === this || f.grabbing === this || f.mishapT > 0 || !f.present;
    // shove anybody standing in the way (they stop only against walls)
    const probe = { x: this.x + dx, y: this.y + 2, w: this.w, h: this.h - 2 };
    for (const f of this.level.friends) {
      if (skip(f) || !overlap(probe, f)) continue;
      const need = dx > 0 ? (probe.x + probe.w) - f.x : probe.x - (f.x + f.w);
      if (Math.sign(need) !== Math.sign(dx)) continue;
      const bx = f.x;
      room.moveX(f, need);
      // pinned against a wall? hop them up onto the crate instead of blocking the push
      if (Math.abs((f.x - bx) - need) > 0.5 && !room.rectBlocked(f.x, this.y - f.h, f.w, f.h, f)) {
        f.y = this.y - f.h; f.vy = 0; f.onGround = true; f.groundEnt = this;
        f.sx = 0.8; f.sy = 1.2;
      }
    }
    room.moveX(this, dx, { bodies: true, ignoreBody: skip });
    const moved = this.x - before;
    if (moved) {
      for (const f of this.level.friends) if (f.groundEnt === this && f.present) room.moveX(f, moved);
      for (const e of room.ents) if (e.crate && e !== this && e.groundEnt === this) e.tryMove(moved);
      this.pushT++;
      if (this.pushT % 14 === 1) AudioSys.sfx('push');
      if (this.pushT % 6 === 0) Particles.dust(moved > 0 ? this.x : this.x + this.w, this.y + this.h, 1);
    }
    return moved;
  }
  draw(g, ox, oy) {
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy) + (this.wobble > 0 ? ((this.wobble >> 1) % 2) : 0);
    drawCrateArt(g, this.kind, x, y, this.w, this.h, this.t);
    // Dex affordance: small red weight badge
    if (this.level.showHints) { g.fillStyle = '#e8504a'; g.fillRect(x + this.w - 6, y + 2, 4, 3); g.fillStyle = '#fff'; g.fillRect(x + this.w - 5, y + 3, 2, 1); }
  }
}
