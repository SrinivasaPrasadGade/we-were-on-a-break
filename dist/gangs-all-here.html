// ---- Doors & barriers -------------------------------------------------------------
class Door extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, p.kind === 'curtain' ? 1 : 1, p.h || 2);
    this.kind = p.kind || 'door';
    this.open = 0; this.solid = true; this.fullH = this.h;
    this.forced = false; this.was = false;
  }
  wantOpen() { return this.forced || this.level.check(this.link); }
  update() {
    super.update();
    const want = this.wantOpen();
    if (want && this.open < 1) {
      if (this.open === 0) { AudioSys.sfx(this.kind === 'gate' || this.kind === 'bars' ? 'gate' : this.kind === 'door' ? 'creak' : 'door'); Particles.dust(this.cx, this.y + this.fullH, 5); }
      this.open = Math.min(1, this.open + 0.05);
    } else if (!want && this.open > 0) {
      // don't close on people
      const blocked = this.level.friends.some(f => f.present && overlap(f, { x: this.x, y: this.y, w: this.w, h: this.fullH }));
      if (!blocked) this.open = Math.max(0, this.open - 0.05);
    }
    this.solid = this.open < 0.85;
    if (want && !this.was && this.id) this.setFlag(true);
    this.was = want;
  }
  draw(g, ox, oy) {
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy), w = this.w, h = this.fullH, o = this.open;
    drawDoorArt(g, this.kind, x, y, w, h, o, this.t, this);
  }
}
function drawDoorArt(g, kind, x, y, w, h, o, t, ent) {
  const R = (a, b, ww, hh, c) => { if (ww > 0 && hh > 0) { g.fillStyle = c; g.fillRect(x + a, y + b, ww, hh); } };
  switch (kind) {
    case 'gate': case 'bars': {
      const lift = Math.round(o * (h - 4));
      R(-2, -2, w + 4, 3, '#3a3e46');
      for (let i = 1; i < w; i += 4) R(i, -lift, 2, h - 1, '#5a606a');
      R(0, h - 4 - lift, w, 2, '#5a606a'); R(0, 4 - lift, w, 2, '#5a606a');
      break;
    }
    case 'shutter': {
      const lift = Math.round(o * (h - 2));
      R(-1, -3, w + 2, 4, '#4a4e56');
      for (let yy = 0; yy < h - lift; yy += 3) R(0, yy, w, 2, '#8a9098');
      R(0, h - lift - 2, w, 2, '#5a6068');
      break;
    }
    case 'curtain': {
      const cw = Math.round(w * (1 - o));
      for (let i = 0; i < cw; i += 3) R(i, 0, 2, h, i % 6 ? '#8a1a2a' : '#6a1220');
      R(0, 0, Math.max(1, cw), 3, '#c8a040');
      break;
    }
    case 'sound': {
      const lift = Math.round(o * (h - 2));
      R(0, -lift, w, h, '#2a3a5a'); R(2, 2 - lift, w - 4, h - 4, '#3a5a8a');
      R(3, 6 - lift, w - 6, 6, '#1a1a2a'); drawText('♪', x + w / 2, y + 4 - lift, '#4cc9f0', { align: 'center' });
      for (let i = 0; i < 3; i++) R(4, h - 14 + i * 3 - lift, w - 8, 1, '#2a3a5a');
      R(-1, -3, w + 2, 3, '#1a1a2a');
      break;
    }
    case 'boxes': {
      if (o >= 1) break;
      const fall = Math.round(o * 20);
      R(0 - fall, 0 + fall, w, h / 2, '#b08a5a'); R(0 + fall / 2, h / 2, w, h / 2, '#a07a4a');
      break;
    }
    case 'snow': {
      const sh = Math.round((1 - o) * h);
      if (sh <= 0) break;
      R(0, h - sh, w, sh, '#e8f0f8'); R(1, h - sh, w - 2, 2, '#ffffff'); R(2, h - sh + 6, w - 4, 1, '#c8d8ea');
      break;
    }
    case 'rope': {
      if (o >= 1) break;
      R(1, h - 18, 3, 18, '#c8a040'); R(w - 4, h - 18, 3, 18, '#c8a040'); R(2, h - 14, w - 4, 2, '#a01a2a');
      R(0, h - 2, 5, 2, '#8a7020'); R(w - 5, h - 2, 5, 2, '#8a7020');
      break;
    }
    case 'turnstile': {
      R(0, h - 20, w, 20, '#7a828a'); R(1, h - 19, w - 2, 2, '#b8c0c8');
      const a = o * Math.PI / 2;
      R(Math.round(w / 2 - Math.cos(a) * 7), h - 14, Math.max(1, Math.round(Math.cos(a) * 14)), 2, '#d8dce0');
      break;
    }
    case 'glass': {
      const sl = Math.round(o * w);
      g.fillStyle = 'rgba(180,220,255,0.45)'; g.fillRect(x, y - sl, w, h);
      R(0, -sl, w, 1, '#e8f4ff'); R(0, h - 1 - sl, w, 1, '#8ab0d0');
      break;
    }
    case 'door': default: {
      // a door panel that swings (narrows) open
      const ww = Math.max(2, Math.round(w * (1 - o * 0.85)));
      R(-1, -2, w + 2, 2, '#3a2418');
      R(0, 0, ww, h, '#7a4a30'); R(1, 2, Math.max(1, ww - 2), h / 2 - 3, '#8a5a3a'); R(1, h / 2 + 1, Math.max(1, ww - 2), h / 2 - 3, '#8a5a3a');
      if (o < 0.5) R(ww - 4, h / 2, 2, 3, '#e0c060');
      if (ent && ent.locked !== false && o === 0) { R(Math.floor(w / 2) - 2, h / 2 - 4, 4, 3, '#c8c8c8'); }
    }
  }
}

class SoundDoor extends Door {
  constructor(room, tx, ty, p) { super(room, tx, ty, Object.assign({ kind: 'sound' }, p)); this.heard = false; this.sound = true; }
  wantOpen() { return this.heard || this.level.check(this.link) && !!this.link; }
  onSound() { if (!this.heard) { this.heard = true; this.setFlag(true); AudioSys.sfx('fixed'); Particles.notes(this.cx, this.y, 6); this.level.toastAt(this.cx, this.y - 8, 'OPEN!', '#4cc9f0'); } }
  interactInfo(f) { if (this.heard) return null; return f.who === 'juno' ? { ok: true, label: 'Play', prio: 3, play: true } : { ok: false, need: 'juno', label: 'Needs music', prio: 1 }; }
}

// ---- Dex shutter ---------------------------------------------------------------------
class Shutter extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, 1, p.h || 3);
    this.fullH = this.h; this.lift = 0; this.liftPx = (p.lift || 2) * T; this.solid = true; this.holder = null; this.kind = p.kind || 'shutter';
  }
  update() {
    super.update();
    const held = this.holder && this.holder.holding === this;
    if (!held) this.holder = null;
    const want = held || this.level.check(this.link) && !!this.link;
    if (want) this.lift = Math.min(1, this.lift + 0.06);
    else if (this.lift > 0) {
      const gap = { x: this.x, y: this.y, w: this.w, h: this.fullH };
      const under = this.level.friends.some(f => f.present && overlap(f, gap));
      if (!under) { this.lift = Math.max(0, this.lift - 0.12); if (this.lift === 0) { AudioSys.sfx('crash'); this.level.shake(2); } }
    }
    this.h = Math.max(1, this.fullH - Math.round(this.lift * this.liftPx));
    this.solid = true;
  }
  interactInfo(f) {
    if (f.who === 'dex') return { ok: true, label: f.holding === this ? 'Let go' : 'Lift', prio: 4 };
    return { ok: false, need: 'dex', label: 'Too heavy', prio: 1 };
  }
  use(f) { if (f.holding === this) f.release(); else { f.startHold(this); this.holder = f; AudioSys.sfx('shutter'); AudioSys.sfx('grunt'); } }
  draw(g, ox, oy) {
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy), w = this.w;
    const R = (a, b, ww, hh, c) => { if (hh > 0) { g.fillStyle = c; g.fillRect(x + a, y + b, ww, hh); } };
    R(-2, -3, w + 4, 4, '#3a3e46');
    const hh = this.h;
    if (this.kind === 'beam') {
      R(0, 0, w, hh, '#7a5a3a'); for (let i = 4; i < hh; i += 8) R(0, i, w, 1, '#5a3a22');
    } else {
      for (let yy = 0; yy < hh; yy += 3) R(0, yy, w, 2, '#9aa0a8');
      R(0, hh - 3, w, 3, '#6a7078'); R(Math.floor(w / 2) - 3, hh - 5, 6, 2, '#e8504a');
    }
    if (this.level.showHints && this.lift < 0.5) { g.fillStyle = '#e8504a'; g.fillRect(x + w / 2 - 2, y + 4, 4, 3); }
  }
}

// ---- Lever (anyone) ------------------------------------------------------------------
class Lever extends Ent {
  constructor(room, tx, ty, p) { super(room, tx, ty, p, p.w || 1, 1); this.on = !!p.on; this.kind = p.kind || 'lever'; if (this.on) this.setFlagLater = true; }
  update() { super.update(); if (this.setFlagLater) { this.setFlag(true); this.setFlagLater = false; } }
  ready() { return !this.p.cond || this.level.check(this.p.cond); }
  interactInfo() {
    if (this.on && !this.p.toggle) return null;
    if (!this.ready()) return this.p.notReady ? { ok: false, need: this.p.notReadyNeed || null, label: this.p.notReady, prio: 1 } : null;
    return { ok: true, label: this.p.label || (this.kind === 'button' ? 'Press' : 'Pull'), prio: 3 };
  }
  use(f) {
    if (this.on && !this.p.toggle) return;

    this.on = this.p.toggle ? !this.on : true;
    this.setFlag(this.on);
    AudioSys.sfx('lever');
    Particles.dust(this.cx, this.cy, 3);
    if (this.p.say && this.on) this.level.say(f.who, this.p.say);
  }
  draw(g, ox, oy) {
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy);
    const R = (a, b, w, h, c) => { g.fillStyle = c; g.fillRect(x + a, y + b, w, h); };
    if (this.kind === 'book') { // the rulebook on Holloway's desk (appears once the safe is open)
      R(0, 9, this.w, 7, '#6a4428'); R(1, 10, this.w - 2, 1, '#8a6040');
      if (!this.ready()) return;
      R(this.w / 2 - 6, 4, 12, 5, this.on ? '#f4efe6' : '#7a1f2b'); R(this.w / 2 - 6, 4, 12, 1, '#c8a040');
      if (this.on) { R(this.w / 2, 4, 1, 5, '#9a8a7a'); R(this.w / 2 + 2, 6, 3, 1, '#3a3a6a'); }
      if (!this.on && this.ready() && this.level.showHints) drawText('!', x + this.w / 2, y - 6, '#ffd23f', { g, align: 'center', outline: '#1b1020' });
      return;
    }
    if (this.kind === 'button') {
      R(3, 4, 10, 10, '#4a4e56'); R(4, 5, 8, 8, '#2a2e36'); circleFill(x + 8, y + 9, 3, this.on ? '#7cf29a' : '#e8504a', g);
    } else if (this.kind === 'valve') {
      R(7, 6, 2, 10, '#6a7078'); circleFill(x + 8, y + 6, 5, '#c83a3a', g); circleFill(x + 8, y + 6, 3, '#4a4e56', g);
      const a = this.on ? 1 : 0; R(4 + a * 3, 5, 8 - a * 3, 2, '#e8504a');
    } else {
      R(3, 10, 10, 6, '#4a4e56'); R(4, 11, 8, 2, '#6a707a');
      if (this.on) { R(9, 4, 2, 7, '#8a8e96'); R(9, 2, 4, 3, '#7cf29a'); }
      else { R(5, 4, 2, 7, '#8a8e96'); R(3, 2, 4, 3, '#e8504a'); }
    }
  }
}

// ---- Broken things (Theo) ----------------------------------------------------------
class Broken extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, p.w || 1, p.h || 1);
    this.kind = p.kind || 'panel'; this.fixed = false; this.progress = 0; this.fixer = null;
  }
  ready() { return !this.p.cond || this.level.check(this.p.cond); }
  update() {
    super.update();
    if (!this.ready()) return;
    if (!this.fixed) {
      if (this.fixer && this.fixer.fixing === this) {
        this.progress += 1 / 55;
        if (this.t % 9 === 0) AudioSys.sfx('clink');
        if (this.t % 5 === 0) Particles.sparks(this.cx, this.cy, 2);
        if (this.progress >= 1) this.complete();
      } else { this.fixer = null; this.progress = Math.max(0, this.progress - 0.01); }
      if (this.t % 50 === 0 && hash2(this.t, this.tx, 2) < 0.6) { Particles.sparks(this.cx, this.cy, 3); if (this.level.near(this, 160)) AudioSys.sfx('spark'); }
    }
  }
  complete() {
    this.fixed = true; this.progress = 1;
    this.setFlag(true);
    AudioSys.sfx('fixed');
    Particles.sparkle(this.cx, this.cy, 12);
    const f = this.fixer;
    if (f) { f.fixing = null; f.state = 'normal'; f.celebrate(40); }
    this.level.onFixed(this, f);
  }
  interactInfo(f) {
    if (this.fixed || !this.ready()) return null;
    return f.who === 'theo' ? { ok: true, label: this.p.label || 'Fix (hold)', prio: 4, hold: true } : { ok: false, need: 'theo', label: 'Broken', prio: 1 };
  }
  use(f) { if (!this.fixed && f.who === 'theo' && this.ready()) { this.fixer = f; f.startFix(this); } }
  draw(g, ox, oy) {
    if (!this.ready()) return;
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy);
    drawBrokenArt(g, this.kind, x, y, this.w, this.h, this.fixed, this.t);
    if (!this.fixed && this.progress > 0) {
      g.fillStyle = '#1b1020'; g.fillRect(x + this.w / 2 - 11, y - 8, 22, 5);
      g.fillStyle = '#8fb33a'; g.fillRect(x + this.w / 2 - 10, y - 7, Math.round(20 * this.progress), 3);
    }
    if (!this.fixed && this.level.showHints) drawNeedBadge(g, 'theo', x + this.w - 4, y - 2, this.t);
  }
}
function drawBrokenArt(g, kind, x, y, w, h, fixed, t) {

    case 'elevator': case 'panel':

      if (!fixed) { R(12, 12, 3, 1, '#ffd23f'); R(13, 13, 1, 3, '#ffd23f'); }
      break;
    case 'switch':
      R(4, 3, 8, 11, '#e8e0d0'); R(6, 5, 4, 7, '#c8c0b0'); R(7, fixed ? 5 : 8, 2, 3, fixed ? '#7cf29a' : '#555');
      break;
    case 'espresso':
      R(0, 2, w, h - 2, '#b8bcc4'); R(2, 4, w - 4, 8, '#3a3a40'); R(4, 6, 3, 3, fixed ? '#7cf29a' : (blink ? '#ff4a3a' : '#5a1a1a'));
      R(w - 10, 12, 6, 6, '#3a3a40'); R(w - 9, h - 6, 4, 4, '#f4f0e6'); R(2, 0, w - 4, 3, '#d8dce4');

      if (fixed) for (let i = 2; i < w - 2; i += 3) R(i, 1 - (t >> 3) % 2, 2, 2, (i + (t >> 3)) % 2 ? '#ff6a2a' : '#ffd23f');
      break;
    case 'sign':
      R(0, 0, w, h, '#2a1a2a'); R(1, 1, w - 2, h - 2, '#3a2a3a');

      R(2, 0, w - 4, h, '#7a3a2a'); R(0, 4, w, h - 8, '#8a4a3a'); circleFill(x + w / 2, y + h / 2, 4, '#d8d0c0', g);

// ---- Pressure plate ------------------------------------------------------------------
class Plate extends Ent {
  constructor(room, tx, ty, p) { super(room, tx, ty, p, p.w || 1, 1); this.pressed = false; this.latched = false; this.heavy = !!p.heavy; }
  update() {
    super.update();
    const zone = { x: this.x + 2, y: this.y + this.h - 6, w: this.w - 4, h: 8 };
    let on = false;
    for (const e of this.room.ents) if (e.crate && overlap(zone, e)) on = true;
    if (!on) for (const f of this.level.friends) {
      if (!f.present || f.gone || f.mishapT > 0) continue;
      if (this.heavy && f.who !== 'dex') continue;
      if (f.onGround && overlap(zone, f)) on = true;
    }
    if (this.p.latch && this.latched) on = true;
    if (on && !this.pressed) { AudioSys.sfx('lever'); if (this.p.latch) this.latched = true; }
    if (on !== this.pressed) { this.pressed = on; this.setFlag(on); }
  }
  draw(g, ox, oy) {
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy) + this.h;
    const d = this.pressed ? 1 : 0;
    g.fillStyle = '#3a3e46'; g.fillRect(x + 1, y - 3, this.w - 2, 3);
    g.fillStyle = this.pressed ? '#7cf29a' : (this.heavy ? '#e8504a' : '#ffd23f');
    g.fillRect(x + 2, y - 4 + d, this.w - 4, 2);
    if (this.p.mark) { // an "X marks the spot" for furniture
      g.fillStyle = this.pressed ? '#7cf29a' : '#ffffff';
      for (let i = 0; i < 5; i++) { g.fillRect(x + this.w / 2 - 2 + i, y - 10 + i, 1, 1); g.fillRect(x + this.w / 2 + 2 - i, y - 10 + i, 1, 1); }
    }
    if (this.heavy && !this.pressed && this.level.showHints) drawNeedBadge(g, 'dex', x + this.w / 2 - 2, y - 6, this.t);
  }
}

// ---- NPC blocker (Priya talks / Juno distracts) -------------------------------------
class NPC extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, 1, 2);
    this.look = p.look || 'guard';
    this.w = 14; this.x = tx * T + 1;
    this.h = 28; this.y = (ty + 1) * T - 28;
    this.face = p.face || -1;
    this.state = p.state || 'block';
    this.solve = p.solve || 'talk';
    this.solid = this.state === 'block';
    // wall height: up to the ceiling so nobody hops over
    let top = ty;
    while (top > 0 && !room.solidAt(tx, top - 1) && ty - top < 8) top--;
    this.wallTop = top * T;
    this.home = this.x;
    this.target = p.moveTo !== undefined ? (tx + p.moveTo) * T + 1 : null;
    this.anim = 'idle'; this.expr = p.expr || 'angry';
    this.danceT = 0; this.cool = 0; this.talkT = 0;
    this.seed = p.seed;
  }
  get solidBox() { return { x: this.x, y: this.wallTop, w: this.w, h: this.y + this.h - this.wallTop }; }
  get colBox() { return this.state === 'block' ? this.solidBox : null; }
  update() {
    super.update();
    if (this.cool > 0) this.cool--;
    if (this.talkT > 0) this.talkT--;
    if (this.state === 'block') {
      // collision box spans to ceiling
      const sb = this.solidBox;
      this.solidRect = sb;
      // greet approaching friends
      const f = this.level.active();
      if (f && Math.abs(f.cx - this.cx) < 40 && Math.abs(f.y - this.y) < 40 && this.cool === 0) {
        this.cool = 240;
        const line = this.p.block || 'Nobody gets past me.';
        this.level.say(this.npcVoice(), line, this);
        this.face = f.cx < this.cx ? -1 : 1;
        if (this.solve === 'talk' && f.who !== 'priya') this.level.hint('priya', 'Needs PRIYA to talk past');
        if (this.solve === 'music' && f.who !== 'juno') this.level.hint('juno', 'Needs JUNO to distract');
      }
    } else if (this.state === 'dance') {
      this.danceT--;
      this.anim = 'dance'; this.expr = 'happy';
      if (this.t % 20 === 0) Particles.notes(this.cx, this.y - 4, 1);
      if (this.danceT <= 0) { this.state = this.target !== null ? 'leave' : 'done'; }
    } else if (this.state === 'leave') {
      this.anim = 'walk';
      const dir = sign(this.target - this.x);
      this.face = dir || this.face;
      this.x += dir * 1.2;
      if (Math.abs(this.target - this.x) < 1.5) { this.x = this.target; this.state = 'done'; this.anim = this.solve === 'music' ? 'dance' : 'idle'; this.face = -this.face; if (this.p.vanish) { this.fading = 1; AudioSys.sfx('creak'); } }
    }
    if (this.fading) { this.fading -= 0.05; if (this.fading <= 0) { this.fading = 0; this.gone = true; } }
    this.solid = this.state === 'block';
  }
  npcVoice() { return this.p.voice || 'npc'; }
  useBox() { return { x: this.x - 24, y: this.y - 4, w: this.w + 48, h: this.h + 8 }; }
  // used by collision: replace box with full-height wall while blocking
  get collider() { return this.state === 'block' ? this.solidBox : null; }
  interactInfo(f) {
    if (this.gone) return null;
    if (this.state !== 'block') return this.p.after ? { ok: true, label: 'Chat', prio: 1 } : null;
    if (this.solve === 'talk') return f.who === 'priya' ? { ok: true, label: 'Talk', prio: 5 } : { ok: false, need: 'priya', label: 'Grumpy', prio: 2 };
    return f.who === 'juno' ? { ok: true, label: 'Play', prio: 5, play: true } : { ok: false, need: 'juno', label: 'In the way', prio: 2 };
  }
  use(f) {
    if (this.state !== 'block') { if (this.p.after) this.level.say(this.npcVoice(), pick([].concat(this.p.after)), this); return; }
    if (this.solve === 'talk' && f.who === 'priya') this.level.openChoice(this, f);
    else if (this.solve !== 'talk' && f.who !== 'juno') this.level.say(this.npcVoice(), this.p.block || 'Move along.', this);
  }
  onSound() {
    if (this.solve === 'music' && this.state === 'block') {
      this.state = 'dance'; this.danceT = 70; this.setFlag(true);
      this.level.say(this.npcVoice(), this.p.won || 'Ooh, I love this song!', this);
      AudioSys.audience('chuckle', 0.6);
    }
  }
  solved() {
    this.state = this.target !== null ? 'leave' : 'done';
    this.expr = 'happy';
    this.setFlag(true);
  }
  draw(g, ox, oy) {
    if (this.gone) return;
    if (this.look === 'pigeons') {
      const fly = this.state !== 'block';
      g.globalAlpha = this.fading ? this.fading : 1;
      for (let i = 0; i < 5; i++) {
        const px = this.cx - ox - 10 + i * 6 + (fly ? Math.sin(this.t / 5 + i) * 3 : 0);
        const py = this.y + this.h - oy - (i % 2) * 9 - (fly ? (this.t % 60) * 0.3 + i * 2 : 0) - (i > 2 ? 14 : 0);
        drawPigeon(g, px, py, (i + (this.t >> 5)) % 2 === 0, this.t + i * 7, fly);
      }
      g.globalAlpha = 1;
      if (this.state === 'block' && this.level.showHints) drawNeedBadge(g, 'juno', Math.round(this.cx - ox) - 2, Math.round(this.y - oy) - 16, this.t);
      if (this.state === 'block' && this.t % 120 === 0 && this.level.near(this, 200)) AudioSys.sfx('coo');
      return;
    }
    const pose = { anim: this.anim, t: this.t, expr: this.expr, blink: (this.t % 180) < 6, talk: this.level.isTalking(this) };
    blitPerson(g, 'npc:' + this.look + (this.seed !== undefined ? '~' + this.seed : ''), npcSpecFn(this.look, this.seed), pose, Math.round(this.cx - ox), Math.round(this.y + this.h - oy), { flip: this.face < 0, alpha: this.fading ? this.fading : 1 });
    if (this.state === 'block' && this.level.showHints) drawNeedBadge(g, this.solve === 'talk' ? 'priya' : 'juno', Math.round(this.cx - ox) - 2, Math.round(this.y - oy) - 10, this.t);
    if (this.state === 'block' && this.p.arms) { /* arms crossed handled by pose */ }
  }
}

// ---- Watcher (patrols, catches rule-breakers; Juno distracts, Benny is unseen) -------
class Watcher extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, 1, 2);
    this.look = p.look || 'holloway';
    this.w = 12; this.h = 28; this.x = tx * T + 2; this.y = (ty + 1) * T - 28;
    this.x1 = (tx + (p.from !== undefined ? p.from : -3)) * T; this.x2 = (tx + (p.to !== undefined ? p.to : 3)) * T;
    this.face = p.face || 1; this.speed = p.speed || 0.55; this.range = (p.range || 6) * T;
    this.pause = 0; this.danceT = 0; this.alertT = 0; this.seenRange = 0;
    this.lines = p.lines || ['HEY! Rule-breaker!', 'Caught you!', 'Back to your mark!', 'Not on my watch!'];
  }
  update() {
    super.update();
    if (this.alertT > 0) { this.alertT--; return; }
    if (this.danceT > 0) {
      this.danceT--;
      if (this.t % 18 === 0) Particles.notes(this.cx, this.y - 4, 1);
      return;
    }
    if (this.pause > 0) { this.pause--; if (this.pause === 30) this.face = -this.face; }
    else {
      this.x += this.face * this.speed;
      if (this.x <= this.x1) { this.x = this.x1; this.pause = 60; }
      if (this.x >= this.x2) { this.x = this.x2; this.pause = 60; }
    }
    // vision
    const eyeY = this.y + 6;
    const eyeX = this.face > 0 ? this.x + this.w : this.x;
    let reach = 0;
    for (reach = 0; reach < this.range; reach += 4) {
      const px = eyeX + this.face * reach;
      if (this.room.solidAt(Math.floor(px / T), Math.floor(eyeY / T)) || this.room.solidAt(Math.floor(px / T), Math.floor((this.y + this.h - 4) / T))) break;
      let blocked = false;
      for (const e of this.room.ents) if (e.solid && e !== this && px >= e.x && px <= e.x + e.w && eyeY + 10 >= e.y && eyeY + 10 <= e.y + e.h) { blocked = true; break; }
      if (blocked) break;
    }
    this.seenRange = reach;
    const vis = this.face > 0 ? { x: eyeX, y: this.y - 6, w: reach, h: this.h + 6 } : { x: eyeX - reach, y: this.y - 6, w: reach, h: this.h + 6 };
    this.vis = vis;
    for (const f of this.level.friends) {
      if (!f.present || f.gone || f.mishapT > 0 || f.who === 'benny' || (f.state === 'hide' && f.hiding)) continue;
      if (overlap(vis, f)) {
        this.alertT = 50;
        this.level.say(this.p.voice || 'holloway', pick(this.lines), this);
        AudioSys.sfx(this.p.hit === 'splash' ? 'poof' : 'whistle');
        if (this.p.hit === 'splash') Particles.puff(f.cx, f.y + 6, 12);
        f.mishap(this.p.hit || 'caught');
        break;
      }
    }
  }
  onSound() {
    if (this.danceT <= 0) { this.level.say(this.p.voice || 'holloway', pick(this.p.danceLines || ['...is that a bossa nova?', 'Oh, I LOVE this one.', 'My feet! They have a mind of their own!']), this); }
    this.danceT = this.p.dance || 360; this.alertT = 0;
  }
  draw(g, ox, oy) {
    // vision cone
    if (this.vis && this.danceT <= 0 && this.alertT <= 0) {
      const v = this.vis;
      g.fillStyle = 'rgba(255,240,140,0.13)';
      g.fillRect(Math.round(v.x - ox), Math.round(this.y - oy + 2), Math.round(v.w), this.h - 2);
      g.fillStyle = 'rgba(255,240,140,0.22)';
      g.fillRect(Math.round(v.x - ox), Math.round(this.y - oy + 6), Math.round(v.w), 1);
    }
    const anim = this.danceT > 0 ? 'dance' : this.alertT > 0 ? 'point' : (this.pause > 0 ? 'idle' : 'walk');
    const expr = this.danceT > 0 ? 'happy' : this.alertT > 0 ? 'angry' : 'focus';
    blitPerson(g, 'npc:' + this.look, npcSpecFn(this.look), { anim, t: this.t, expr, blink: (this.t % 150) < 5 }, Math.round(this.cx - ox), Math.round(this.y + this.h - oy), { flip: this.face < 0 });
    if (this.alertT > 0) drawText('!', Math.round(this.cx - ox), Math.round(this.y - oy) - 14, '#ff4a3a', { scale: 2, align: 'center', outline: '#1b1020' });
    if (this.danceT > 0) drawText('♪', Math.round(this.cx - ox) + 8, Math.round(this.y - oy) - 10 - (this.t >> 3) % 3, '#4cc9f0', { outline: '#1b1020' });
    if (this.level.showHints && this.danceT <= 0) drawNeedBadge(g, 'juno', Math.round(this.cx - ox) - 2, Math.round(this.y - oy) - 10, this.t);
  }
}

// ---- Hideout (anyone: duck into a doorway / behind a fern; watchers can't see you) ----

  constructor(room, tx, ty, p) {

    return { ok: true, label: 'Hide', prio: 2 };

    } else if (this.kind === 'snowman') {

      R(w / 2 - 6, h - 3, 12, 3, '#dde8f4'); R(w / 2 - 5, h - 30, 10, 3, '#2a2a2e'); R(w / 2 - 3, h - 34, 6, 4, '#2a2a2e');

// ---- Moving platform / elevator -------------------------------------------------------
class Platform extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, p.w || 2, 1);
    this.h = 6; this.y = (ty + 1) * T - 6 + (p.dy || 0);
    this.oneway = p.oneway !== false; this.solid = true;
    this.start = { x: this.x, y: this.y };
    this.path = (p.path || [[0, 0], [0, -4]]).map(([a, b]) => ({ x: this.start.x + a * T, y: this.start.y + b * T }));
    this.seg = 0; this.dir = 1; this.wait = p.wait || 70; this.speed = p.speed || 0.8; this.mode = p.mode || 'cycle';
    this.kind = p.kind || 'elevator'; this.dyFrame = 0; this.dxFrame = 0; this.moving = false; this.atEnd = false;
    this.cableTop = p.cableTop !== undefined ? p.cableTop * T : null;
  }
  active() { return !this.link || this.level.check(this.link); }
  update() {
    super.update();
    let target = null;
    const act = this.active();
    if (this.mode === 'cycle') {
      if (!act) { this.dyFrame = 0; this.dxFrame = 0; this.moving = false; return; }
      if (this.wait > 0) { this.wait--; this.dyFrame = 0; this.dxFrame = 0; this.moving = false; return; }
      target = this.path[this.seg + this.dir] || null;
      if (!target) { this.dir = -this.dir; target = this.path[this.seg + this.dir]; }
    } else {
      // toggle / once: go to last point when active, back to first when not (once: stays)
      const goal = act || (this.mode === 'once' && this.atEnd) ? this.path.length - 1 : 0;
      if (this.seg === goal && this.x === this.path[goal].x && this.y === this.path[goal].y) { this.dyFrame = 0; this.dxFrame = 0; this.moving = false; if (goal === this.path.length - 1) this.atEnd = true; return; }
      const step = goal > this.seg ? 1 : goal < this.seg ? -1 : 0;
      target = step ? this.path[this.seg + step] : this.path[this.seg];
      this.dir = step || 1;
    }
    const dx = clamp(target.x - this.x, -this.speed, this.speed), dy = clamp(target.y - this.y, -this.speed, this.speed);
    this.moving = !!(dx || dy);
    if (this.moving && this.t % 40 === 0 && this.level.near(this, 200)) AudioSys.sfx('hum');
    // carry riders
    const riders = this.level.friends.filter(f => f.present && f.groundEnt === this);
    const crates = this.room.ents.filter(e => e.crate && e.groundEnt === this);
    if (dy < 0) {
      for (const r of riders.concat(crates)) {
        const before = r.y; this.room.moveY(r, dy, { ignore: s => s === this });
        if (r.y > before + dy + 0.01) { /* blocked by ceiling: stop */ }
      }
    }
    this.x += dx; this.y += dy;
    this.dyFrame = dy; this.dxFrame = dx;
    if (dy > 0) for (const r of riders.concat(crates)) { r.y += dy; }
    if (dx) for (const r of riders.concat(crates)) this.room.moveX(r, dx);
    if (Math.abs(this.x - target.x) < 0.01 && Math.abs(this.y - target.y) < 0.01) {
      this.x = target.x; this.y = target.y;
      this.seg = this.path.indexOf(target);
      if (this.mode === 'cycle') { this.wait = this.p.wait || 70; if (this.seg === this.path.length - 1 || this.seg === 0) this.dir = this.seg === 0 ? 1 : -1; AudioSys.sfx('ding'); }
    }
  }
  draw(g, ox, oy) {
    const x = Math.round(this.x - ox), y = Math.round(this.y - oy), w = this.w;
    const R = (a, b, ww, hh, c) => { g.fillStyle = c; g.fillRect(x + a, y + b, ww, hh); };
    if (this.kind === 'elevator' || this.kind === 'lift') {
      const top = this.cableTop !== null ? Math.round(this.cableTop - oy) : y - 300;
      g.fillStyle = '#2a2a2e'; g.fillRect(x + 3, top, 1, y - top); g.fillRect(x + w - 4, top, 1, y - top);
      R(0, 0, w, 6, '#7a828a'); R(0, 0, w, 2, '#b8c0c8'); R(1, 6, w - 2, 2, '#4a4e56');
      R(2, 2, 3, 2, this.active() ? '#7cf29a' : '#ff4a3a');
    } else if (this.kind === 'plank') {
      R(0, 0, w, 5, '#8a5a34'); R(0, 0, w, 1, '#b07a4a');
    } else if (this.kind === 'cart') { // subway maintenance cart riding the rails
      R(0, 0, w, 3, '#e8c020'); R(0, 3, w, 6, '#5a5a62'); R(2, 4, w - 4, 1, '#7a7a82');
      R(3, -10, 2, 10, '#5a5a62'); R(w - 5, -10, 2, 10, '#5a5a62'); R(3, -10, w - 6, 2, '#e8c020');
      circleFill(x + 6, y + 10, 3, '#2a2a2e', g); circleFill(x + w - 6, y + 10, 3, '#2a2a2e', g);
      R(w / 2 - 2, -8, 4, 3, (this.t >> 4) % 2 ? '#ff4a3a' : '#7a1a1a');
    } else if (this.kind === 'cloud') {
      R(0, 0, w, 6, '#f4f8fc'); R(2, -2, w - 4, 2, '#ffffff');
    } else {
      R(0, 0, w, 6, '#6a7078'); R(0, 0, w, 1, '#a8b0b8');
    }
  }
}

// ---- Blocks that appear / vanish (bridges, ladders, walls) -----------------------------
class Blocks extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, p.w || 1, p.h || 1);

    this.code = this.kind === 'ladder' ? TL.LADDER : (this.kind === 'plank' || this.kind === 'scaffold' ? TL.ONEWAY : TL.SOLID);
    this.tx0 = tx; this.ty0 = ty - (this.h / T) + 1; this.tw = this.w / T; this.th = this.h / T;

  }
  isOn() { const c = this.level.check(this.link); return this.mode === 'appear' ? c : !c; }
  apply(on, init) {
    if (on === this.on) return;
    this.on = on;
    for (let y = 0; y < this.th; y++) for (let x = 0; x < this.tw; x++) this.room.setCode(this.tx0 + x, this.ty0 + y, on ? this.code : TL.EMPTY);

      }

  }

  draw(g, ox, oy) {

    const th = this.room.theme;

      if (this.kind === 'ladder') drawLadderTile(g, px, py, y === 0);
      else if (this.kind === 'plank' || this.kind === 'scaffold') { g.fillStyle = '#8a5a34'; g.fillRect(px, py, T, 4); g.fillStyle = '#b07a4a'; g.fillRect(px, py, T, 1); if (this.kind === 'scaffold') { g.fillStyle = '#6a7078'; g.fillRect(px + 2, py + 4, 1, 12); g.fillRect(px + 13, py + 4, 1, 12); } }
      else if (this.kind === 'boxes') drawCrateArt(g, 'box', px, py, T, T, 0);
      else if (this.kind === 'bridge') { g.fillStyle = '#8a5a34'; g.fillRect(px, py, T, 6); g.fillStyle = '#b07a4a'; g.fillRect(px, py, T, 1); g.fillStyle = '#5a3a22'; g.fillRect(px + 7, py, 1, 6); g.fillRect(px, py + 6, T, 1); }
      else if (this.kind === 'snow') { g.fillStyle = '#e8f0f8'; g.fillRect(px, py, T, T); g.fillStyle = '#ffffff'; g.fillRect(px, py, T, 2); }
      else drawSolidTile(g, th, px, py, y === 0, x === 0, x === this.tw - 1, y === this.th - 1, this.tx0 + x, this.ty0 + y, TL.SOLID);
    }
  }
}

// ---- Runner (Sarge the iguana, Theo's robot...) -------------------------------------
class Runner extends Ent {
  constructor(room, tx, ty, p) {
    super(room, tx, ty, p, 1, 1);
    this.kind = p.kind || 'sarge';
    this.path = (p.path || [[tx, ty]]).map(([a, b]) => ({ x: a * T + 8, y: (b + 1) * T }));
    this.i = 0; this.px = this.path[0].x; this.py = this.path[0].y; this.moving = false; this.face = p.face || -1;
    this.trigger = (p.near === undefined ? 4 : p.near) * T; this.caught = false; this.hop = 0;
  }
  update() {
    super.update();
    if (this.caught) return;
    const last = this.path.length - 1;
    if (!this.moving && this.i < last) {
      const near = this.lured || (this.p.dash && this.i > 0) || (this.trigger > 0 && this.level.friends.some(f => f.present && !f.gone && Math.abs(f.cx - this.px) < this.trigger && Math.abs(f.y + f.h - this.py) < 4 * T));
      if (near && (!this.p.gate || this.level.check(this.p.gate))) {
        this.lured = false;
        this.moving = true;
        AudioSys.sfx(this.kind === 'robot' ? 'robot' : 'squeak');
        if (this.p.taunts && Math.random() < 0.7) this.level.say(this.kind === 'robot' ? 'robot' : 'sarge', pick(this.p.taunts), this);
      }
    }
    if (this.moving) {
      const tgt = this.path[this.i + 1];
      const dx = tgt.x - this.px, dy = tgt.y - this.py;
      const d = Math.hypot(dx, dy);
      const sp = this.p.speed || 2.2;
      this.face = dx < 0 ? -1 : dx > 0 ? 1 : this.face;
      if (d <= sp) { this.px = tgt.x; this.py = tgt.y; this.i++; this.moving = false; if (this.i === last && this.p.vanish) this.gone = true; }
      else { this.px += dx / d * sp; this.py += dy / d * sp; }
      this.hop = Math.abs(Math.sin(this.t / 3)) * 3;
      if (this.t % 6 === 0) Particles.dust(this.px, this.py, 1);
    } else this.hop = 0;
    this.x = this.px - 8; this.y = this.py - 12; this.w = 16; this.h = 12;
    // catch at the end (optionally gated)
    if (this.p.catchable && this.i === last && !this.moving && !this.gone && (!this.p.catchLink || this.level.check(this.p.catchLink))) {
      for (const f of this.level.friends) if (f.present && !f.gone && f.mishapT <= 0 && overlap(f, { x: this.x - 4, y: this.y - 6, w: this.w + 8, h: this.h + 6 })) {
        this.caught = true; this.setFlag(true); this.level.onCaught(this, f); break;
      }
    }
  }
  onSound() {
    if (this.p.lovesMusic && !this.caught) {
      this.lured = true; this.setFlag && this.p.lureFlag && this.level.setFlag(this.p.lureFlag, true);
      Particles.hearts(this.px, this.py - 14, 4);
      if (this.p.lureSay) this.level.queueLines(this.p.lureSay, 0);
    }
  }
  draw(g, ox, oy) {
    if (this.gone || this.caught && this.p.hideWhenCaught) return;
    const x = this.px - ox, y = this.py - oy - this.hop;
    if (this.kind === 'robot') drawRobot(g, x, y, this.face < 0, this.t, { arm: true });
    else if (this.kind === 'rabbit') drawRabbit(g, x, y, this.face < 0, this.t);
    else if (this.kind === 'dove') drawDove(g, x, y - 6, this.t);
    else drawIguana(g, x, y, this.face < 0, this.t, { moving: this.moving, pilot: this.p.pilot });
  }
}

// ---- Hazards ----------------------------------------------------------------------------

  puff(x, y, n) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(0.3, 1.6); this.add({ k: 'smoke', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.3, life: rndi(20, 40), max: 40, r: rnd(2, 5), c: pick(['#e8e4f0', '#c8c4d8', '#f4f0fa']) }); } },
  sparks(x, y, n) { for (let i = 0; i < n; i++) this.add({ k: 'spark', x, y, vx: rnd(-2, 2), vy: rnd(-2.5, 0), life: rndi(10, 22), max: 22, c: pick(['#ffe866', '#ffffff', '#ffb02e']) }); },
  sparkle(x, y, n) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(0.5, 2); this.add({ k: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rndi(16, 30), max: 30, c: pick(['#ffffff', '#ffe866', '#7cf2ff']) }); } },
  twinkle(x, y) { this.add({ k: 'star', x, y, vx: 0, vy: -0.2, life: 20, max: 20, c: '#fff6c0' }); },
  notes(x, y, n) { for (let i = 0; i < n; i++) this.add({ k: 'note', x: x + rnd(-6, 6), y, vx: rnd(-0.4, 0.4), vy: rnd(-0.9, -0.5), life: rndi(40, 60), max: 60, c: pick(['#4cc9f0', '#ff4f9a', '#ffd23f', '#7cf29a']) }); },
  confetti(x, y, n) { for (let i = 0; i < n; i++) this.add({ k: 'conf', x: x + rnd(-W / 2, W / 2), y: y + rnd(-40, 0), vx: rnd(-0.5, 0.5), vy: rnd(0.4, 1.4), life: rndi(120, 220), max: 220, c: pick(['#ff4f9a', '#4cc9f0', '#ffd23f', '#7cf29a', '#ff8a3a', '#a66bf0']), r: rnd(0, TAU) }); },
  drops(x, y, n) { for (let i = 0; i < n; i++) this.add({ k: 'drop', x, y, vx: rnd(-1.5, 1.5), vy: rnd(-3, -1), life: rndi(20, 30), max: 30, c: '#7ab8e8' }); },
  hearts(x, y, n) { for (let i = 0; i < n; i++) this.add({ k: 'heart', x: x + rnd(-8, 8), y, vx: rnd(-0.3, 0.3), vy: rnd(-0.8, -0.4), life: rndi(40, 60), max: 60, c: '#ff4f7a' }); },
  update() {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.x += p.vx; p.y += p.vy;
      if (p.k === 'spark' || p.k === 'drop') p.vy += 0.15;
      if (p.k === 'dust' || p.k === 'smoke') { p.vx *= 0.94; p.vy *= 0.94; }
      if (p.k === 'conf') { p.r += 0.1; p.vx += Math.sin(p.life / 10) * 0.02; }
      if (--p.life <= 0) this.list.splice(i, 1);
    }
  },
  draw(g, ox, oy) {
    for (const p of this.list) {
      const x = Math.round(p.x - ox), y = Math.round(p.y - oy), a = p.life / p.max;
      g.globalAlpha = Math.min(1, a * 1.6);
      g.fillStyle = p.c;
      switch (p.k) {
        case 'smoke': { const r = Math.round(p.r * (1.6 - a)); g.fillRect(x - r, y - r, r * 2, r * 2); break; }
        case 'star': g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); break;
        case 'note': drawText('♪', x, y, p.c, { g }); break;
        case 'heart': drawText('♥', x, y, p.c, { g }); break;
        case 'conf': g.fillRect(x, y, Math.abs(Math.cos(p.r)) * 3 + 1, 2); break;
        default: g.fillRect(x, y, p.k === 'dust' ? 2 : 1, p.k === 'dust' ? 2 : (p.k === 'spark' ? 2 : 1));
      }
    }
    g.globalAlpha = 1;
  },
};


// ===== 09_friends.js =====
// ---------------------------------------------------------------------------
// The six friends: movement, abilities, mishaps, follow AI
// ---------------------------------------------------------------------------
const PHYS = { grav: 0.3, maxFall: 6.5, jumpV: 5.0, cut: 2.2, djumpV: 4.6, coyote: 6, buffer: 7, climb: 1.3, accel: 0.3, decel: 0.38, airAccel: 0.22 };
const FRIEND_STATS = {
  dex: { w: 14, h: 28, speed: 1.4 },
  mila: { w: 10, h: 26, speed: 1.85 },
  theo: { w: 10, h: 27, speed: 1.6 },
  priya: { w: 10, h: 26, speed: 1.6 },
  benny: { w: 10, h: 18, speed: 1.55 },
  juno: { w: 10, h: 26, speed: 1.6 },
};
const QUIPS = {
  dex: ['My back is FINE. Ignore the noises.', 'I lift. Emotionally, too.', 'Who packs a bowling ball in a shoebox?!', 'I volunteered for this. Why do I keep volunteering?', 'That commercial with the puppy... no. Not now.', 'Feel that? Pure gym-teacher energy.'],
  mila: ['Scoreboard update: Mila 1, Gravity 0.', 'That was a personal best. I keep a spreadsheet.', 'Scoreboard: Mila 412, everyone else: a rounding error.', 'I could do this blindfolded. I have.', 'Point for Mila. Obviously.', 'Race you. I already won.'],
  theo: ['Behold! The Pocket Fan 3000! ...It is a hair dryer.', 'Behold! Self-tying shoelaces! ...Mostly self-tying.', 'Behold! The Snack Tracker! It tracks... that I ate the snacks.', 'I can rewire a subway car. My toaster? Charcoal.', 'Behold! The Auto-Umbrella! ...Why is it raining INSIDE?', 'Behold! The Sock Finder! It found... one sock.'],
  priya: ['I know a guy.', 'I know a guy who knows a guy. Small world.', 'Location, location, location!', 'Hold on, my guy is calling. ...Wrong guy.', 'Trust me, I sold a closet as a "loft".', 'I could sell this hallway. Twice.'],
  benny: ['For my next trick... nope. Lost the rabbit.', 'Ta-da! ...Okay, imagine there was a dove.', 'Pick a card! Any card! ...Not that one.', 'Behold! The vanishing coin! ...It really vanished. That was rent money.', 'Ta-da!', 'Abracadabra! ...Abraca-dang it.'],
  juno: [],
};
const MAGIC_TRICKS = ['dove', 'sock', 'cards', 'flowers', 'nothing'];

class Friend {
  constructor(level, who, x, y) {
    this.level = level; this.who = who;
    const st = FRIEND_STATS[who];
    this.w = st.w; this.h = st.h; this.standH = st.h; this.speed = st.speed;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.face = 1;
    this.onGround = false; this.groundEnt = null; this.coyote = 0; this.jumpBuf = 0; this.djumpUsed = false;
    this.climbing = false; this.crawling = false; this.state = 'normal';
    this.holding = null; this.fixing = null; this.grabbing = null; this.pushingCrate = null;
    this.playT = 0; this.mishapT = 0; this.mishapKind = null; this.celebT = 0; this.quipCool = 0; this.trickT = 0; this.trick = null;
    this.checkpoint = { x, y, ent: null };
    this.present = true; this.gone = false; this.alpha = 1;
    this.t = rndi(0, 100); this.animT = 0; this.anim = 'idle'; this.expr = 'neutral';
    this.blinkT = rndi(60, 260); this.idleT = 0;
    this.sx = 1; this.sy = 1;
    this.ai = { stuck: 0, lastX: x, confused: 0, jumpCool: 0 };
    this.dropT = 0; this.pushHint = 0; this.flipT = 0; this.ctrl = -1;
  }
  get cx() { return this.x + this.w / 2; }
  get outfit() { return (Save.data.outfits && Save.data.outfits[this.who]) || 0; }
  busy() { return this.state === 'hold' || this.state === 'fix' || this.state === 'play' || this.mishapT > 0 || this.onPlate(); }
  onPlate() {
    for (const e of this.level.room.ents) if (e instanceof Plate && e.pressed && this.onGround && overlap({ x: e.x + 2, y: e.y + e.h - 6, w: e.w - 4, h: 8 }, this)) return true;
    return false;
  }
  canClimbCode(c) { return c === TL.LADDER || (c === TL.CLIMB && this.who === 'mila'); }
  climbTileAt() {
    const room = this.level.room;
    const tx = Math.floor(this.cx / T);
    const ty0 = Math.floor((this.y + 2) / T), ty1 = Math.floor((this.y + this.h - 1) / T);
    for (let ty = ty0; ty <= ty1; ty++) if (this.canClimbCode(room.code(tx, ty))) return { tx, ty };
    return null;
  }
  // standing on a ladder / climb top?
  onClimbTop() {
    const room = this.level.room;
    const tx = Math.floor(this.cx / T), ty = Math.floor((this.y + this.h + 1) / T);
    const c = room.code(tx, ty);
    return this.onGround && this.canClimbCode(c) && !this.canClimbCode(room.code(tx, ty - 1)) ? { tx, ty } : null;
  }

  // ---------------------------------------------------------------------------
  update(pad) {
    this.t++; this.animT++;
    if (this.quipCool > 0) this.quipCool--;
    if (this.celebT > 0) this.celebT--;
    if (this.flipT > 0) this.flipT--;
    if (this.trickT > 0) this.trickT--;
    if (this.ai.jumpCool > 0) this.ai.jumpCool--;
    if (--this.blinkT < -6) this.blinkT = rndi(120, 320);
    this.sx = lerp(this.sx, 1, 0.2); this.sy = lerp(this.sy, 1, 0.2);
    if (!this.present) return;
    if (this.mishapT > 0) { this.tickMishap(); return; }
    const L = this.level, room = L.room;
    const Hd = pad.held, Pr = pad.pressed;
    let dir = (Hd.right ? 1 : 0) - (Hd.left ? 1 : 0);
    if (this.sitting && (dir || Pr.jump)) this.sitting = false;

    // ---- locked states ----
    if (this.state === 'hold') {
      if (!this.holding) this.state = 'normal';
      else if (dir !== 0 || Pr.jump || Pr.act) { this.release(); Pr.act = false; Pr.jump = false; }
      else { this.physicsIdle(); this.anim = 'hold'; return; }
    }
    if (this.state === 'fix') {
      if (!this.fixing || !Hd.act || dir !== 0 || this.fixing.fixed) {
        if (this.fixing) this.fixing.fixer = null;
        this.fixing = null; this.state = 'normal';
      } else { this.physicsIdle(); this.anim = 'fix'; this.face = this.fixing.cx >= this.cx ? 1 : -1; return; }
    }
    if (this.state === 'play') {
      this.playT--;
      if (this.playT === 52) L.soundPulse(this);
      if (this.playT <= 0) this.state = 'normal';
      this.physicsIdle(); this.anim = 'play'; return;
    }
    if (this.state === 'pose') {
      this.playT--; if (this.playT <= 0) this.state = 'normal';
      this.physicsIdle(); return;
    }
    if (this.state === 'talkpose') { this.physicsIdle(); this.anim = 'talk'; return; }
    if (this.state === 'hide') {
      // Juno can serenade from her hiding spot
      if (this.who === 'juno' && this.hiding && Pr.act && !this.hidePlayT) {
        Pr.act = false; this.hidePlayT = 72;
        Music.notes([[0, 72, 0.5], [0.5, 76, 0.5], [1, 79, 0.5], [1.5, 84, 1]], 'keytar', 150, 0.8);
      }
      if (this.hidePlayT > 0) { this.hidePlayT--; if (this.hidePlayT === 52) L.soundPulse(this); if (this.t % 12 === 0) Particles.notes(this.cx, this.y, 1); }
      if (!this.hiding || dir !== 0 || Pr.jump || Pr.act || Pr.up) { this.unhide(); this.hidePlayT = 0; Pr.act = false; Pr.jump = false; Pr.up = false; }
      else { this.physicsIdle(); this.anim = 'idle'; return; }
    }
    if (L.lockInput) { dir = 0; }

    // ---- E: ability / interact ----
    if (Pr.act && !L.lockInput) this.act();
    if (this.state !== 'normal') return;
    // grab release
    if (this.grabbing && (!Hd.act || !this.adjacent(this.grabbing))) this.grabbing = null;

    // ---- exits: up at a door ----
    if (Pr.up && !L.lockInput && this.onGround) {
      const ex = L.exitHere(this);
      if (ex) { ex.use(this); Pr.jump = false; this.jumpBuf = 0; return; }
    }

    // ---- climbing ----
    if (!this.climbing && !L.lockInput) {
      const ct = this.climbTileAt();
      if (ct && Hd.up && (!this.onGround || Pr.up || this.vy >= 0) && !(Pr.jump && !Hd.up)) { this.startClimb(ct); if (Pr.jump) { Pr.jump = false; this.jumpBuf = 0; } }
      else if (Hd.down && this.onGround) {
        const top = this.onClimbTop();
        if (top && Pr.down) { this.startClimb(top); this.y += 3; }
      }
    }
    if (this.climbing) { this.updateClimb(Hd, Pr, dir); return; }

    // ---- Benny crawling ----
    if (this.who === 'benny') this.updateCrawl(Hd, dir);

    // ---- horizontal ----
    const gc = this.onGround ? room.groundCode(this) : 0;
    const ice = gc === TL.ICE;
    const maxS = this.speed * (this.pushingCrate || this.grabbing ? 0.62 : 1) * (this.crawling ? 0.7 : 1);
    const acc = this.onGround ? (ice ? 0.05 : PHYS.accel) : PHYS.airAccel;
    const dec = this.onGround ? (ice ? 0.015 : PHYS.decel) : 0.08;
    if (dir) { this.vx = approach(this.vx, dir * maxS, acc); if (!this.grabbing) this.face = dir; }
    else this.vx = approach(this.vx, 0, dec);
    if (this.onGround && (gc === TL.CONVL || gc === TL.CONVR)) room.moveX(this, gc === TL.CONVL ? -0.7 : 0.7);

    // ---- jumping ----
    if (this.onGround) { this.coyote = PHYS.coyote; this.djumpUsed = false; } else if (this.coyote > 0) this.coyote--;
    if (Pr.jump && !L.lockInput) this.jumpBuf = PHYS.buffer; else if (this.jumpBuf > 0) this.jumpBuf--;
    if (this.jumpBuf > 0 && Hd.down && this.onGround && this.onOneway()) {
      this.dropT = 10; this.jumpBuf = 0; this.onGround = false;
    } else if (this.jumpBuf > 0 && (this.onGround || this.coyote > 0) && !this.crawling) {
      this.jump();
    } else if (Pr.jump && !this.onGround && this.coyote <= 0 && this.who === 'mila' && !this.djumpUsed && !L.lockInput) {
      this.doubleJump();
    }
    if (!Hd.jump && this.vy < -PHYS.cut && !this.bounced) this.vy = -PHYS.cut;
    if (this.vy >= 0) this.bounced = false;

    // ---- gravity ----
    this.vy = Math.min(this.vy + PHYS.grav, PHYS.maxFall);

    // ---- move X (with Dex pushing / pulling) ----
    this.pushingCrate = null;
    if (this.vx) {
      const dx = this.vx;
      if (this.who === 'dex' && this.onGround) {
        const probe = { x: this.x + dx, y: this.y + 3, w: this.w, h: this.h - 6 };
        for (const e of room.ents) {
          if (!e.crate || e === this.groundEnt) continue;
          if (overlap(probe, e) && e.y + e.h > this.y + 6 && e.y < this.y + this.h - 3) {
            const need = dx > 0 ? (this.x + dx + this.w) - e.x : (this.x + dx) - (e.x + e.w);
            if (Math.sign(need) === Math.sign(dx)) { e.tryMove(clamp(need, -1.2, 1.2)); this.pushingCrate = e; e.wobble = 4; }
          }
        }
      }
      const before = this.x;
      const hit = room.moveX(this, dx);
      const moved = this.x - before;
      if (this.grabbing && moved && Math.sign(moved) !== Math.sign(this.grabbing.cx - this.cx)) this.grabbing.tryMove(moved);
      if (hit && hit.crate && this.who !== 'dex' && this.onGround) {
        if (++this.pushHint === 30) { L.hint('dex', 'Too heavy! Needs DEX'); this.say(pick(['Nope. That is a Dex job.', 'Way too heavy.', 'Not budging.'])); }
      } else if (!hit) this.pushHint = 0;
      if (hit) this.vx = this.pushingCrate ? this.vx : 0;
    }
    // ---- move Y ----
    const wasGround = this.onGround;
    const prevVy = this.vy;
    const res = room.moveY(this, this.vy, { drop: this.dropT > 0, who: this.who });
    if (this.dropT > 0) this.dropT--;
    if (res.landed) {
      if (res.on && res.on.bounce && prevVy > 0.5) {
        this.vy = -res.on.power; this.bounced = true; this.onGround = false; this.groundEnt = null;
        res.on.squish = 6; AudioSys.sfx('spring'); this.sx = 1.3; this.sy = 0.7;
      } else {
        if (!wasGround && prevVy > 2) { this.sx = 1.25; this.sy = 0.78; AudioSys.sfx('land'); Particles.dust(this.cx, this.y + this.h, 3); }
        this.vy = 0; this.onGround = true; this.groundEnt = res.on;
      }
    } else {
      this.onGround = false; this.groundEnt = null;
      if (res.ceiling) this.vy = Math.max(0, this.vy);
    }
    // standing on a crate that moved away etc.
    if (this.onGround && !res.landed) this.onGround = false;

    // ---- hazards & pits ----
    // hazard tiles only bite at floor level (the trap/puddle sits in the bottom of its tile)
    const hz = room.overlapsCode({ x: this.x + 3, y: this.y + this.h - 6, w: this.w - 6, h: 6 }, TL.HAZARD);
    if (hz && this.y + this.h > hz.ty * T + 9) this.mishap(hazardReaction(room.theme.hazard));
    if (this.y > room.h + 24) this.mishap('fall');

    this.pickAnim(dir);
  }

  physicsIdle() {
    const room = this.level.room;
    this.vx = 0;
    this.vy = Math.min(this.vy + PHYS.grav, PHYS.maxFall);
    const res = room.moveY(this, this.vy, { who: this.who });
    if (res.landed) { this.vy = 0; this.onGround = true; this.groundEnt = res.on; } else { this.onGround = false; this.groundEnt = null; }
  }
  onOneway() {
    const room = this.level.room;
    if (this.groundEnt && this.groundEnt.oneway) return true;
    const ty = Math.floor((this.y + this.h + 1) / T);
    const tx0 = Math.floor(this.x / T), tx1 = Math.floor((this.x + this.w - 0.01) / T);
    let any = false;
    for (let tx = tx0; tx <= tx1; tx++) { const c = room.code(tx, ty); if (isSolidCode(c)) return false; if (c === TL.ONEWAY) any = true; }
    return any;
  }
  adjacent(e) {
    return Math.abs((this.cx < e.cx ? e.x - (this.x + this.w) : this.x - (e.x + e.w))) < 3 && this.y + this.h > e.y + 2 && this.y < e.y + e.h;
  }

  jump() {
    this.vy = -PHYS.jumpV; this.coyote = 0; this.jumpBuf = 0; this.onGround = false; this.groundEnt = null;
    this.sx = 0.82; this.sy = 1.2;
    AudioSys.sfx('jump');
    Particles.dust(this.cx, this.y + this.h, 2);
  }
  doubleJump() {
    this.vy = -PHYS.djumpV; this.djumpUsed = true; this.flipT = 18;
    this.sx = 0.8; this.sy = 1.2;
    AudioSys.sfx('djump');
    Particles.puff(this.cx, this.y + this.h, 5);
    if (Math.random() < 0.12 && this.quipCool <= 0) { this.say('Scoreboard: Mila 1, Gravity 0.'); this.quipCool = 300; }
  }

  startClimb(ct) {
    this.climbing = true; this.vx = 0; this.vy = 0; this.crawling = false;
    this.x = ct.tx * T + T / 2 - this.w / 2;
  }
  updateClimb(Hd, Pr, dir) {
    const room = this.level.room;
    const vdir = (Hd.down ? 1 : 0) - (Hd.up ? 1 : 0);
    // jump off (jump that isn't also "up")
    if (Pr.jump && !Hd.up) { this.climbing = false; this.vy = -3.8; this.vx = dir * this.speed; this.djumpUsed = false; AudioSys.sfx('jump'); this.anim = 'jump'; return; }
    this.vx = 0;
    if (dir) { room.moveX(this, dir * 0.9); this.face = dir; }
    this.vy = vdir * PHYS.climb;
    if (this.vy) { if (this.animT % 12 === 0) AudioSys.sfx('climb'); }
    else this.animT--; // freeze climb anim
    const res = room.moveY(this, this.vy, { who: this.who, climbing: true });
    if (res.landed && this.vy > 0) { this.climbing = false; this.onGround = true; this.vy = 0; }
    // reached the top?
    const tx = Math.floor(this.cx / T);
    const feetTy = Math.floor((this.y + this.h - 1) / T);
    if (this.vy < 0 && !this.canClimbCode(room.code(tx, feetTy))) {
      // find top tile under us
      const topTy = feetTy + 1;
      if (this.canClimbCode(room.code(tx, topTy))) { this.y = topTy * T - this.h; this.climbing = false; this.onGround = true; this.vy = 0; }
    }
    if (!this.climbTileAt() && this.climbing) { this.climbing = false; }
    this.anim = 'climb';
    if (this.y > room.h + 24) this.mishap('fall');
  }

  updateCrawl(Hd, dir) {
    const room = this.level.room;
    const STAND = this.standH, CRAWL = 12;
    const bottom = this.y + this.h;
    if (this.crawling) {
      const free = !room.rectBlocked(this.x, bottom - STAND, this.w, STAND, this);
      if (free && !Hd.down) { this.crawling = false; this.h = STAND; this.y = bottom - STAND; }
    } else if (this.onGround) {
      let want = Hd.down;
      if (!want && dir) {
        const blockedStand = room.rectBlocked(this.x + dir * 2, bottom - STAND, this.w, STAND, this);
        const freeCrawl = !room.rectBlocked(this.x + dir * 2, bottom - CRAWL, this.w, CRAWL, this);
        if (blockedStand && freeCrawl) want = true;
      }
      if (want) { this.crawling = true; this.h = CRAWL; this.y = bottom - CRAWL; }
    }
  }

  // ---- E ----------------------------------------------------------------------
  act() {
    const L = this.level;
    if (this.who === 'mila' && !this.onGround && !this.climbing && !this.djumpUsed && this.coyote <= 0) { this.doubleJump(); return; }
    const best = L.bestInteractable(this);
    if (best && best.info.ok) {
      // Juno: low-priority things (doors to hide in, chats) never get in the way of a song somebody nearby wants to hear
      if (best.info.play || (this.who === 'juno' && (best.info.prio || 0) <= 2 && this.musicWanted())) { this.startPlay(); return; }
      best.ent.use(this); return;
    }
    if (this.who === 'juno') { this.startPlay(); return; }
    if (this.who === 'mila') { const ct = this.climbTileAt(); if (ct) { this.startClimb(ct); return; } }
    if (best && !best.info.ok) {
      L.hint(best.info.need, needText(best.info.need, best.info.label));
      this.state = 'pose'; this.playT = 30; this.anim = 'shrug';
      if (best.ent.use && best.ent instanceof NPC) best.ent.use(this);
      AudioSys.sfx('deny');
      return;
    }
    this.quip();
  }
  musicWanted() {
    const R = this.level.soundRadius();
    for (const e of this.level.room.ents) {
      if (!e.onSound) continue;
      const d = Math.hypot(e.cx - this.cx, e.cy - (this.y + this.h / 2));
      if (d > R + Math.max(e.w, e.h) / 2) continue;
      if (e instanceof Watcher && e.danceT <= 0) return true;
      if (e instanceof NPC && e.solve === 'music' && e.state === 'block') return true;
      if (e instanceof Runner && e.p.lovesMusic && !e.caught && !e.moving) return true;
      if ((e instanceof Sensor || e instanceof SoundDoor) && !e.heard && (!e.ready || e.ready())) return true;
    }
    return false;
  }
  startPlay() {
    this.state = 'play'; this.playT = 72;
    const riffs = [[[0, 72, 0.5], [0.5, 76, 0.5], [1, 79, 0.5], [1.5, 84, 1]], [[0, 74, 0.25], [0.25, 77, 0.25], [0.5, 81, 0.5], [1, 79, 0.5], [1.5, 77, 1]], [[0, 76, 0.5], [0.5, 79, 0.25], [0.75, 76, 0.25], [1, 74, 0.5], [1.5, 72, 1]], [[0, 67, 0.25], [0.25, 72, 0.25], [0.5, 76, 0.25], [0.75, 79, 0.25], [1, 84, 1]]];
    Music.notes(pick(riffs), 'keytar', 150, 0.9);
    Particles.notes(this.cx, this.y, 3);
    if (this.quipCool <= 0 && Math.random() < 0.35) { this.say(pick(['♪ Dum da-dum! ♪', '♪ This one\'s called "Please Work". ♪', '♪ Ba-dum, tss! ♪', '♪ Wedding medley, take one! ♪'])); this.quipCool = 240; }
  }
  startFix(e) { this.state = 'fix'; this.fixing = e; this.vx = 0; AudioSys.sfx('clink'); }
  startHold(e) {
    this.state = 'hold'; this.holding = e; this.vx = 0;
    // snap beside the shutter
    if (this.cx < e.cx) this.x = e.x - this.w; else this.x = e.x + e.w;
    this.face = this.cx < e.cx ? 1 : -1;
  }
  release() {
    if (this.holding) { this.holding = null; }
    if (this.state === 'hold') this.state = 'normal';
  }
  startGrab(c) { this.grabbing = c; this.face = c.cx > this.cx ? 1 : -1; }
  startHide(h) {
    this.hiding = h; h.occupant = this; this.state = 'hide'; this.vx = 0;
    this.x = h.cx - this.w / 2;
    AudioSys.sfx('creak');
    if (Math.random() < 0.5 && this.quipCool <= 0) { this.say(pick(HIDE_LINES[this.who] || ['Shh.'])); this.quipCool = 200; }
  }
  unhide() {
    if (this.hiding) { this.hiding.occupant = null; this.hiding.peekT = 0; }
    this.hiding = null; if (this.state === 'hide') this.state = 'normal';
    AudioSys.sfx('creak');
  }
  celebrate(n) { this.celebT = n; }

  quip() {
    if (this.quipCool > 0) return;
    this.quipCool = 150;
    const L = this.level;
    switch (this.who) {
      case 'benny': {
        this.trick = pick(MAGIC_TRICKS); this.trickT = 60;
        this.state = 'pose'; this.playT = 40; this.anim = 'magic';
        AudioSys.sfx('magic'); Particles.puff(this.cx + this.face * 8, this.y + 6, 10);
        const lines = { dove: 'Ta-da! A dove! ...It\'s a pigeon. Close enough.', sock: 'From my hat... a rabbit! ...A sock. Again.', cards: 'Pick a card! ...Pick up ALL the cards.', flowers: 'For you! ...They\'re plastic. And on fire. No, wait.', nothing: 'Ta-da! ...The trick is that nothing happened.' };
        this.say(lines[this.trick]);
        if (Math.random() < 0.7) AudioSys.audience('chuckle', 0.55);
        break;
      }
      case 'theo':
        this.state = 'pose'; this.playT = 40; this.anim = 'fix';
        Particles.sparks(this.cx + this.face * 8, this.y + 10, 8); AudioSys.sfx('spark');
        this.say(pick(QUIPS.theo));
        if (Math.random() < 0.6) AudioSys.audience('chuckle', 0.5);
        break;
      case 'dex':
        this.state = 'pose'; this.playT = 40; this.anim = 'flex';
        this.say(pick(QUIPS.dex));
        break;
      case 'mila':
        this.state = 'pose'; this.playT = 30; this.anim = 'cheer';
        this.say(pick(QUIPS.mila));
        break;
      case 'priya':
        this.state = 'pose'; this.playT = 40; this.anim = 'phone';
        this.say(pick(QUIPS.priya));
        break;
      default: break;
    }
  }
  say(text, opts) { this.level.say(this.who, text, null, opts); }

  // ---- mishaps -------------------------------------------------------------------
  mishap(kind) {
    if (this.mishapT > 0 || !this.present) return;
    const L = this.level;
    if (L.completing) return;
    this.release(); this.climbing = false; this.grabbing = null;
    if (this.hiding) { this.hiding.occupant = null; this.hiding = null; }
    if (kind === 'splash' && L.room.theme.weather === 'snow') this.say(pick(['SNOWBALL!', 'In my EAR!', 'Cold! Cold! Cold!']));
    if (this.fixing) { this.fixing.fixer = null; this.fixing = null; }
    this.state = 'mishap'; this.mishapKind = kind; this.mishapT = kind === 'fall' ? 60 : 78;
    this.vx = 0; this.vy = (kind === 'fall') ? 0 : -2.5;
    this.crawling = false; this.h = this.standH;
    L.takes++;
    const sfx = { ow: 'snap', zap: 'zap', splash: 'splash', caught: 'whistle', bonk: 'crash', fall: 'slide' }[kind] || 'boing';
    AudioSys.sfx(sfx);
    if (kind === 'ow') setTimeout(() => AudioSys.sfx('ow'), 120);
    if (kind === 'zap') Particles.sparks(this.cx, this.y + 8, 14);
    if (kind === 'splash') Particles.drops(this.cx, this.y + this.h, 12);
    L.shake(kind === 'bonk' ? 4 : 2);
    setTimeout(() => AudioSys.audience(Math.random() < 0.45 ? 'big' : 'laugh', 0.8), kind === 'fall' ? 450 : 200);
    const lines = MISHAP_LINES[this.who] && MISHAP_LINES[this.who][kind];
    if (lines && Math.random() < 0.75) this.say(pick(lines));
  }
  tickMishap() {
    this.mishapT--;
    const k = this.mishapKind;
    if (k !== 'fall' && this.mishapT > 22) {
      this.vy = Math.min(this.vy + 0.2, 3);
      const res = this.level.room.moveY(this, this.vy);
      if (res.landed) this.vy = 0;
      if (k === 'dizzy' || k === 'bonk') { if (this.t % 10 === 0) Particles.twinkle(this.cx + rnd(-6, 6), this.y - 4); }
      if (k === 'zap' && this.t % 6 === 0) Particles.puff(this.cx, this.y, 1);
    }
    if (this.mishapT === 22) {
      if (k !== 'fall') Particles.puff(this.cx, this.y + this.h / 2, 10);
      this.respawn();
    }
    if (this.mishapT <= 0) { this.state = 'normal'; this.mishapKind = null; this.alpha = 1; }
  }
  respawn() {
    const cp = this.checkpoint;
    const room = this.level.room;
    this.x = cp.x; this.y = cp.y; this.vx = 0; this.vy = 0;
    // nudge up if blocked
    for (let i = 0; i < 6 && room.rectBlocked(this.x, this.y, this.w, this.h, this); i++) this.y -= T;
    Particles.puff(this.cx, this.y + this.h / 2, 12);
    AudioSys.sfx('pop');
    this.level.takeClap(this);
    this.sx = 0.6; this.sy = 1.4;
    this.onGround = false;
  }

  // ---- follow AI -------------------------------------------------------------------
  aiPad(leader, idx) {
    const pad = { held: {}, pressed: {}, released: {} };
    for (const a of ACTIONS) { pad.held[a] = false; pad.pressed[a] = false; }
    if (!leader || leader === this || this.busy() || !leader.present || leader.mishapT > 0) return pad;
    const room = this.level.room;
    const gap = 16 + idx * 13;
    const tx = leader.cx - leader.face * gap;
    const dx = tx - this.cx;
    const dyL = (leader.y + leader.h) - (this.y + this.h);
    if (this.ai.confused > 0) {
      this.ai.confused--;
      if (Math.abs(leader.cx - this.ai.leaderX) > 48 || Math.abs(leader.y - this.ai.leaderY) > 40) this.ai.confused = 0;
      return pad;
    }
    // ladders
    const ct = this.climbTileAt();
    if (this.climbing) {
      if (dyL < -6) pad.held.up = true; else if (dyL > 6) pad.held.down = true;
      else if (Math.abs(dx) > 4) { pad.held[dx > 0 ? 'right' : 'left'] = true; }
      return pad;
    }
    if (ct && dyL < -24 && Math.abs(leader.cx - this.cx) < 80) { pad.held.up = true; pad.pressed.up = true; return pad; }
    if (this.onGround && dyL > 24) { const top = this.onClimbTop(); if (top && Math.abs(leader.cx - this.cx) < 80) { pad.held.down = true; pad.pressed.down = true; return pad; } }
    if (Math.abs(dx) < 6 && Math.abs(dyL) < 40) { this.ai.stuck = 0; return pad; }
    const d = dx > 0 ? 1 : -1;
    pad.held[d > 0 ? 'right' : 'left'] = true;
    if (this.onGround && this.ai.jumpCool <= 0) {
      const ahead = { x: this.x + d * 6, y: this.y + 2, w: this.w, h: this.h - 4 };
      const wall = room.rectBlocked(ahead.x, ahead.y, ahead.w, ahead.h, this);
      // ground ahead?
      const footX = d > 0 ? this.x + this.w + 2 : this.x - 2;
      let groundAhead = false, dropDepth = 0;
      for (let k = 0; k < 8; k++) {
        const ty = Math.floor((this.y + this.h + 1) / T) + k;
        const c = room.code(Math.floor(footX / T), ty);
        if (isSolidCode(c) || c === TL.ONEWAY || c === TL.LADDER) { groundAhead = k === 0; dropDepth = k; break; }
        dropDepth = 99;
      }
      const hazardAhead = room.code(Math.floor((footX + d * 4) / T), Math.floor((this.y + this.h - 4) / T)) === TL.HAZARD;
      if (wall) {
        // can we clear it? check up to 2 tiles
        const free2 = !room.rectBlocked(ahead.x, this.y - 2 * T, ahead.w, this.h, this);
        if (free2) { pad.pressed.jump = true; pad.held.jump = true; this.ai.jumpCool = 20; }
      } else if (!groundAhead) {
        if (dyL < -8 || dropDepth > 6) {
          // leader is up/level across a gap: jump if there's ground within 3 tiles
          let land = false;
          for (let k = 1; k <= 3; k++) {
            const gx = Math.floor((footX + d * k * T) / T);
            for (let j = -2; j <= 1; j++) { const ty = Math.floor((this.y + this.h + 1) / T) + j; if (isSolidCode(room.code(gx, ty)) && !isSolidCode(room.code(gx, ty - 1))) land = true; }
          }
          if (land) { pad.pressed.jump = true; pad.held.jump = true; this.ai.jumpCool = 25; }
          else { pad.held.left = pad.held.right = false; this.goConfused(leader); }
        }
      } else if (hazardAhead) { pad.pressed.jump = true; pad.held.jump = true; this.ai.jumpCool = 25; }
      else if (dyL < -20 && Math.abs(dx) < 40) {
        // leader on a ledge above: hop
        pad.pressed.jump = true; pad.held.jump = true; this.ai.jumpCool = 30;
      }
    } else if (!this.onGround) pad.held.jump = true;
    // stuck detection
    if (Math.abs(this.x - this.ai.lastX) < 0.3) { if (++this.ai.stuck > 70) this.goConfused(leader); }
    else this.ai.stuck = 0;
    this.ai.lastX = this.x;
    return pad;
  }
  goConfused(leader) { this.ai.confused = 120; this.ai.stuck = 0; this.ai.leaderX = leader.cx; this.ai.leaderY = leader.y; }

  pickAnim(dir) {
    let a;
    if (this.sitting && this.onGround && Math.abs(this.vx) < 0.1) a = 'sit';
    else if (this.climbing) a = 'climb';
    else if (this.crawling) a = 'crawl';
    else if (!this.onGround) a = this.flipT > 0 ? 'jump' : (this.vy < 0 ? 'jump' : 'fall');
    else if (this.pushingCrate) a = 'push';
    else if (this.grabbing && Math.abs(this.vx) > 0.1) a = 'pull';
    else if (Math.abs(this.vx) > 0.25) a = 'walk';
    else if (this.celebT > 0) a = 'cheer';
    else a = 'idle';
    if (a !== this.anim) { this.anim = a; this.animT = 0; }
    if (a === 'idle') this.idleT++; else this.idleT = 0;
  }

  draw(g, ox, oy) {
    if (!this.present) return;
    if (this.state === 'hide' && this.hiding) return;
    const L = this.level;
    let anim = this.anim, expr = 'neutral';
    if (this.mishapT > 0) {
      const k = this.mishapKind;
      if (k === 'fall') return;
      if (this.mishapT <= 22) return;
      anim = { ow: 'ow', zap: 'zap', splash: 'splash', caught: 'caught', bonk: 'dizzy', dizzy: 'dizzy' }[k] || 'dizzy';
    }
    if (this.state === 'pose' && this.anim) anim = this.anim;
    const quirk = (anim === 'idle' && this.idleT > 180 && (this.idleT % 360) < 140) ? this.who : null;
    if (this.celebT > 0 && anim === 'idle') anim = 'cheer';
    if (this.pushHint > 30 && anim === 'idle') expr = 'strain';
    const talk = L.isTalking(this);
    const pose = { anim, t: this.animT + this.t * 0, expr: this.mishapT > 0 ? undefined : expr, blink: this.blinkT < 0, talk, quirk, fast: this.who === 'mila', vx: this.vx };
    if (anim === 'walk') pose.t = this.t;
    if (anim === 'idle' || anim === 'cheer' || anim === 'dance' || anim === 'play' || anim === 'fix' || anim === 'hold') pose.t = this.t;
    let sx = this.sx, sy = this.sy;
    const bx = this.cx - ox, by = this.y + this.h - oy;
    if (this.flipT > 0 && !this.onGround) {
      // Mila's flip: quick squash cycle
      const k = this.flipT / 18;
      sx *= 1 - Math.sin(k * Math.PI) * 0.25; sy *= 1 + Math.sin(k * Math.PI) * 0.1;
    }
    blitPerson(g, friendSpecId(this.who, this.outfit), friendSpecFn(this.who, this.outfit), pose, bx, by + (anim === 'crawl' ? 0 : 0), { flip: this.face < 0, sx, sy, alpha: this.alpha });
    if (this.ai.confused > 0 && L.followMode) drawText('?', Math.round(bx), Math.round(by - this.h - 14), '#ffffff', { align: 'center', outline: OUTLINE });
    if (this.trickT > 0 && this.trick === 'dove') drawDove(g, bx + this.face * (60 - this.trickT), by - 30 - (60 - this.trickT) * 0.6, this.t);
  }
}

function needText(need, label) {
  const n = FRIEND_INFO[need] ? FRIEND_INFO[need].name : '';
  return label ? label + ' - needs ' + n : 'Needs ' + n;
}
