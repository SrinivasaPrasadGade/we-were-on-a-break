// ===== 10_level.js =====
// ---------------------------------------------------------------------------
// Level scene: plays an episode's rooms
// ---------------------------------------------------------------------------
const [darkCanvas, darkCtx] = makeCanvas(W, H);

class LevelScene {
  constructor(epIndex, opts) {
    opts = opts || {};
    this.opts = opts;
    this.epIndex = epIndex;
    this.ep = EPISODES[epIndex];
    this.hub = !!opts.hub;
    this.cups = 0; this.mugGot = false; this.takes = 1; this.time = 0;
    this.collected = new Set();
    this.cupsTotal = 0;
    if (!this.hub) for (const r of this.ep.rooms) for (const row of r.map) for (const ch of row) if (ch === 'c') this.cupsTotal++;
    this.followMode = !!(Save.data.settings.follow);
    this.ctrl = [0, -1];
    this.bubbles = []; this.toasts = []; this.lineQueue = []; this.lineWait = 0;
    this.hintMsg = null; this.choice = null; this.claps = [];
    this.cam = { x: 0, y: 0, look: 0 };
    this.shakeAmt = 0; this.shakeX = 0; this.shakeY = 0;
    this.trans = null; this.completing = false; this.lockInput = false; this.goalT = 0;
    this.showHints = true;
    this.slugT = 0;
    this.t = 0;
    if (!this.hub && !opts.noMusic) Music.play(this.ep.music || 'funk');
    this.loadRoom(opts.room || 0, true);
  }

  // ---- room management ------------------------------------------------------------
  loadRoom(i, first) {
    this.roomIndex = i;
    const def = this.hub ? this.opts.hubDef : this.ep.rooms[i];
    this.flags = {};
    const prevFriends = this.friends;
    this.room = new Room(def, this);
    this.room.flags = this.flags;
    Particles.list.length = 0;
    this.bubbles = []; this.lineQueue = []; this.choice = null; this.claps = [];
    // friends
    const cast = def.cast || FRIENDS;
    this.friends = FRIENDS.map(who => new Friend(this, who, 0, 0));
    const sp = this.room.spawn;
    let k = 0;
    const order = def.spawnOrder || FRIENDS;
    for (const who of order) {
      const f = this.friends.find(q => q.who === who);
      f.present = cast.includes(who);
      if (!f.present) continue;
      let x = sp.x + (def.spawnDir === -1 ? -k : k) * (def.spawnGap || 18) + 2;
      x = clamp(x, 0, this.room.w - f.w);
      f.x = x; f.y = sp.y - f.h; f.face = def.spawnDir || 1;
      f.checkpoint = { x: f.x, y: f.y, ent: null };
      f.alpha = 0; f.fadeIn = 6 + k * 6;
      k++;
    }
    if (def.positions) for (const who in def.positions) { const f = this.friends.find(q => q.who === who); const [tx, ty] = def.positions[who]; f.x = tx * T + 8 - f.w / 2; f.y = (ty + 1) * T - f.h; f.checkpoint = { x: f.x, y: f.y, ent: null }; }
    // keep the controlled friend if present
    let p1 = prevFriends ? prevFriends[this.ctrl[0]].who : (def.start || cast[0]);
    if (!cast.includes(p1)) p1 = def.start || cast[0];
    if (def.start && first) p1 = def.start;
    this.ctrl[0] = FRIENDS.indexOf(p1);
    if (Input.twoPlayer) {
      let p2i = this.ctrl[1];
      if (p2i < 0 || !cast.includes(FRIENDS[p2i]) || p2i === this.ctrl[0]) p2i = this.nextFree(this.ctrl[0], 1, -1);
      this.ctrl[1] = p2i;
    } else this.ctrl[1] = -1;
    // entities
    for (const [type, p, tx, ty] of this.room.pendingEnts) {
      const C = ENT_TYPES[type];
      if (!C) continue;
      const e = new C(this.room, tx, ty, p);
      if (type === 'cup' && this.collected.has(i + ':' + e.key)) continue;
      if (type === 'mug' && this.mugGot) continue;
      this.room.ents.push(e);
    }
    const phase = e => (e instanceof Platform ? 0 : e.crate ? 1 : 2);
    this.room.ents.sort((a, b) => phase(a) - phase(b));
    renderRoomLayers(this.room);
    this.updateCamera(true);
    this.slugT = this.hub ? 0 : 1;
    if (def.intro && !this.hub) this.queueLines(def.intro, 50);
    if (def.music && !this.hub) Music.play(def.music);
    this.roomT = 0;
  }
  nextFree(from, dir, exclude) {
    for (let k = 1; k <= 6; k++) {
      const i = ((from + dir * k) % 6 + 6) % 6;
      if (i === exclude || i === from) continue;
      if (this.friends && this.friends[i] && this.friends[i].present) return i;
    }
    return from;
  }
  retake() {
    this.takes++;
    AudioSys.sfx('clack');
    this.loadRoom(this.roomIndex);
    this.toastScreen('TAKE ' + this.takes + '!', '#ffffff');
  }

  // ---- flags & helpers -------------------------------------------------------------
  setFlag(id, v) { if (!id) return; this.flags[id] = v; }
  check(expr) {
    if (!expr) return true;
    return String(expr).split('|').some(group => group.split('&').every(term => {
      term = term.trim();
      if (term[0] === '!') return !this.flags[term.slice(1)];
      return !!this.flags[term];
    }));
  }
  p1() { return this.friends[this.ctrl[0]]; }
  p2() { return this.ctrl[1] >= 0 ? this.friends[this.ctrl[1]] : null; }
  active() { return this.p1(); }
  near(ent, d) { const f = this.p1(); return f && Math.abs(f.cx - ent.cx) < d && Math.abs(f.y - ent.y) < d; }
  shake(n) { if (Save.data.settings.shake) this.shakeAmt = Math.max(this.shakeAmt, n); }
  crateLanded() { }
  hint(need, text, dur) {
    if (this.hintMsg && this.hintMsg.text === text && this.hintMsg.t > 0) { this.hintMsg.t = Math.max(this.hintMsg.t, dur || 150); return; }
    this.hintMsg = { need, text, t: dur || 150 };
  }
  toastAt(x, y, text, col, dur) { this.toasts.push({ x, y, text, col: col || '#fff', t: 0, dur: dur || 70, world: true }); }
  toastScreen(text, col) { this.toasts.push({ x: W / 2, y: 110, text, col: col || '#fff', t: 0, dur: 80, world: false, big: true }); }
  takeClap(f) { this.claps.push({ x: f.cx, y: f.y - 8, n: this.takes, t: 0 }); setTimeout(() => AudioSys.sfx('clack'), 60); }

  // ---- speech ---------------------------------------------------------------------
  say(who, text, anchor, opts) {
    if (!text) return;
    const f = this.friends && this.friends.find(q => q.who === who && q.present);
    anchor = anchor || f || null;
    if (!anchor) { anchor = this.p1(); }
    this.bubbles = this.bubbles.filter(b => b.anchor !== anchor);
    const b = { who, text: normText(text), anchor, t: 0, shown: 0, dur: 70 + text.length * 2.6, voice: VOICES[who] ? who : (anchor && anchor.p && anchor.p.voice) || 'npc' };
    if (anchor && anchor.look && VOICES[anchor.look]) b.voice = anchor.look;
    this.bubbles.push(b);
    if (this.bubbles.length > 3) this.bubbles.shift();
    return b;
  }
  isTalking(ent) { return this.bubbles.some(b => b.anchor === ent && b.shown < b.text.length); }
  queueLines(lines, delay) { for (const l of lines) this.lineQueue.push(l); this.lineWait = Math.max(this.lineWait, delay || 0); }
  updateLines() {
    if (this.lineWait > 0) { this.lineWait--; return; }
    if (!this.lineQueue.length) return;
    if (this.bubbles.some(b => b.fromQueue && b.t < b.text.length + 30)) return;
    const l = this.lineQueue.shift();
    if (l[0] === 'laugh') { AudioSys.audience(l[1] || 'chuckle', 0.7); this.lineWait = 10; return; }
    if (l[0] === 'flag') { this.setFlag(l[1], true); return; }
    let anchor = null;
    if (!FRIENDS.includes(l[0])) anchor = this.room.ents.find(e => (e.look === l[0] || e.p.voice === l[0] || (e.p && e.p.name === l[0]))) || null;
    const b = this.say(l[0], l[1], anchor);
    if (b) b.fromQueue = true;
    this.lineWait = 6;
  }
  runTrigger(tr, f) {
    const p = tr.p;
    if (p.flag) this.setFlag(p.flag, true);
    if (p.join) {
      for (const who of [].concat(p.join)) {
        const q = this.friends.find(x => x.who === who);
        if (!q || q.present) continue;
        q.present = true;
        const at = p.joinAt ? { x: p.joinAt[0] * T + 8, y: (p.joinAt[1] + 1) * T } : { x: tr.x + tr.w + 20, y: tr.y + tr.h };
        q.x = at.x - q.w / 2; q.y = at.y - q.h; q.face = -1; q.alpha = 0; q.fadeIn = 10;
        q.checkpoint = { x: q.x, y: q.y, ent: null };
        Particles.puff(q.cx, q.y + q.h / 2, 12);
        AudioSys.sfx(who === 'benny' ? 'magic' : 'pop');
        this.toastAt(q.cx, q.y - 10, FRIEND_INFO[who].name + ' JOINS!', FRIEND_INFO[who].color, 120);
      }
    }
    if (p.lines) this.queueLines(p.lines, 4);
    if (p.hint) this.hint(p.hintNeed || null, p.hint);
    if (p.hintKeys) this.hint(p.hintNeed || null, Input.lastDevice === 'touch' ? p.hintKeys.touch : p.hintKeys.keys, 330);
    if (p.laugh) AudioSys.audience(p.laugh, 0.7);
  }

  // ---- interactions ---------------------------------------------------------------
  bestInteractable(f) {
    const box = { x: f.x - 2, y: f.y, w: f.w + 4, h: f.h };
    let best = null, bs = -1e9;
    for (const e of this.room.ents) {
      if (!e.interactInfo) continue;
      const info = e.interactInfo(f);
      if (!info) continue;
      if (!overlap(box, e.useBox())) continue;
      const score = (info.ok ? 100 : 0) + (info.prio || 0) * 10 - Math.abs(e.cx - f.cx) * 0.05;
      if (score > bs) { bs = score; best = { ent: e, info }; }
    }
    return best;
  }
  exitHere(f) {
    for (const e of this.room.ents) if (e instanceof Exit && f.cx > e.x && f.cx < e.x + e.w && f.y + f.h > e.y + 8 && f.y < e.y + e.h) return e;
    return null;
  }
  // Juno's music reach; stage speakers (room.def.amp flag) amplify it
  soundRadius() { return (this.room.def.amp && this.check(this.room.def.amp) ? 13 : 7) * T; }
  soundPulse(f) {
    const R = this.soundRadius();
    this.pulses = this.pulses || [];
    this.pulses.push({ x: f.cx, y: f.y + 8, t: 0, big: R > 7 * T });
    for (const e of this.room.ents) {
      if (!e.onSound) continue;
      const d = Math.hypot(e.cx - f.cx, e.cy - (f.y + f.h / 2));
      if (d <= R + Math.max(e.w, e.h) / 2) e.onSound(f);
    }
  }
  onFixed(ent, f) {
    if (!f) return;
    const r = Math.random();
    if (r < 0.3) {
      setTimeout(() => { Particles.sparks(ent.cx, ent.cy, 16); AudioSys.sfx('zap'); f.say(pick(['It almost works! ...Oh. It works.', 'Behold! It works! I\'m as shocked as you.', 'Fixed it! Don\'t touch it. Ever.'])); AudioSys.audience('chuckle', 0.6); }, 200);
    } else if (r < 0.6) f.say(pick(['Fixed! Now if only I could fix my toaster.', 'Theo: 1, Machines: 0.', 'Ta-da! Wait, that\'s Benny\'s line.', 'Good as new. Better, actually.']));
    if (ent.p.say) this.queueLines(ent.p.say, 30);
  }
  onCaught(r, f) {
    AudioSys.audience('cheer', 0.8);
    if (r.p.say) this.queueLines(r.p.say, 10);
    if (r.p.goal) { this.goalT = 90; }
  }
  gotCup(cup, f) {
    this.cups++;
    this.collected.add(this.roomIndex + ':' + cup.key);
  }
  gotMug(m, f) {
    this.mugGot = true;
    AudioSys.sfx('mug');
    AudioSys.audience('cheer', 0.7);
    Particles.sparkle(m.cx, m.cy, 24);
    this.toastScreen('GOLDEN MUG!', '#f5c542');
    const lines = { dex: 'A golden mug! I\'m not crying, you\'re crying.', mila: 'Golden mug! Scoreboard: Mila, gold medal.', theo: 'Pure gold! Well... gold-ish.', priya: 'I know a guy who\'d pay a fortune for this.', benny: 'Ta-da! A real trick! It\'s real!', juno: '♪ Golden, golden, gold! ♪' };
    f.say(lines[f.who]);
  }
  exitRoom(exit, f) {
    if (this.trans || this.completing) return;
    if (exit.goal) { this.complete(); return; }
    const next = this.roomIndex + 1;
    if (next >= this.ep.rooms.length) { this.complete(); return; }
    AudioSys.sfx('door');
    this.lockInput = true;
    this.trans = { t: 0, next, shot: this.ep.rooms[next].shot || null };
  }
  complete() {
    if (this.completing) return;
    this.completing = true; this.lockInput = true; this.completeT = 0;
    Music.stop(0.4);
    for (const f of this.friends) if (f.present) { f.celebT = 400; f.release(); f.state = 'normal'; }
    AudioSys.audience('applause', 0.9);
    setTimeout(() => AudioSys.audience('cheer', 0.6), 500);
    Particles.confetti(W / 2 + this.cam.x, this.cam.y, 80);
    Music.oneShot('fanfare', 0.8);
  }

  // ---- choice dialog (Priya) -------------------------------------------------------------
  openChoice(npc, f) {
    const talk = npc.p.talk || { q: 'What do you want?', opts: [{ t: 'I know a guy.', ok: true, r: 'Fine. Go.' }] };
    this.choice = { npc, f, sel: 0, phase: 'ask', t: 0, talk };
    f.state = 'talkpose'; f.face = npc.cx > f.cx ? 1 : -1;
    npc.face = f.cx < npc.cx ? -1 : 1;
    this.say(npc.npcVoice(), talk.q, npc);
    AudioSys.sfx('select');
  }
  updateChoice() {
    const c = this.choice; c.t++;
    const opts = c.talk.opts;
    if (c.phase === 'ask') {
      const m = Input.menu;
      if (m.up) { c.sel = (c.sel + opts.length - 1) % opts.length; AudioSys.sfx('move'); }
      if (m.down) { c.sel = (c.sel + 1) % opts.length; AudioSys.sfx('move'); }
      for (let i = 0; i < opts.length; i++) if (Input.keyPressed('Digit' + (i + 1))) { c.sel = i; this.pickChoice(); return; }
      const bx = 60, by = 176;
      for (let i = 0; i < opts.length; i++) if (Input.clickIn(bx, by + 14 + i * 14, W - 120, 13)) { c.sel = i; this.pickChoice(); return; }
      if (m.ok && c.t > 10) { this.pickChoice(); return; }
      if (m.back && c.t > 10) { this.closeChoice(); }
    } else if (c.phase === 'result') {
      if (--c.wait <= 0) {
        if (c.ok) { c.npc.solved(); this.closeChoice(); }
        else this.closeChoice();
      }
    }
  }
  pickChoice() {
    const c = this.choice;
    const o = c.talk.opts[c.sel];
    AudioSys.sfx('confirm');
    this.say(c.f.who, o.t, c.f);
    c.phase = 'result'; c.ok = !!o.ok; c.wait = 150 + (o.r || '').length * 2;
    setTimeout(() => {
      if (!this.choice || this.choice !== c) return;
      this.say(c.npc.npcVoice(), o.r || (o.ok ? 'Fine. Go ahead.' : 'Nope.'), c.npc);
      if (o.ok) { AudioSys.audience(o.laugh || 'chuckle', 0.7); c.npc.expr = 'happy'; c.f.celebT = 60; }
      else { AudioSys.audience(o.laugh || 'laugh', 0.8); c.npc.expr = 'angry'; }
    }, 900);
  }
  closeChoice() {
    const c = this.choice;
    if (c && c.f) c.f.state = 'normal';
    this.choice = null;
  }

  // ---- update ----------------------------------------------------------------------------
  update() {
    this.t++; this.time++;
    if (this.slugT > 0) this.slugT++;
    if (this.slugT > 240) this.slugT = 0;
    // transition
    if (this.trans) { this.updateTrans(); return; }
    if (this.choice) { this.updateChoice(); this.updateBubbles(); this.tickFx(); return; }

    const solo = !Input.twoPlayer;
    const pad1 = Input.pads[0], pad2 = Input.pads[1];
    // pause
    if (pad1.pressed.pause && !this.completing) { Game.openPause(this); return; }
    if (Input.clickIn(W - 22, 3, 19, 16)) { Game.openPause(this); return; }
    // switching
    if (!this.completing) {
      this.handleSwitch(0, pad1);
      if (!solo) this.handleSwitch(1, pad2);
      if (!this.hub && (pad1.pressed.follow || Input.clickIn(4 + 6 * 22 + 2, 4, 46, 14))) {
        this.followMode = !this.followMode; Save.data.settings.follow = this.followMode; Save.write();
        AudioSys.sfx('select');
        this.toastScreen(this.followMode ? 'GANG: FOLLOW ME!' : 'GANG: WAIT HERE', '#ffffff');
      }
    }
    if (Input.twoPlayer && this.ctrl[1] < 0) this.ctrl[1] = this.nextFree(this.ctrl[0], 1, -1);
    if (!Input.twoPlayer) this.ctrl[1] = -1;

    this.room.t++;
    this.roomT++;
    // update entities (platforms & crates first)
    const ents = this.room.ents;
    let i = 0;
    for (; i < ents.length && (ents[i] instanceof Platform || ents[i].crate); i++) ents[i].update();
    // friends
    const lead = this.p1();
    let fi = 0;
    for (let k = 0; k < this.friends.length; k++) {
      const f = this.friends[k];
      if (!f.present) continue;
      if (f.fadeIn !== undefined) { if (f.fadeIn > 0) { f.fadeIn--; f.alpha = 0; } else if (f.alpha < 1) f.alpha = Math.min(1, f.alpha + 0.15); }
      let pad;
      if (k === this.ctrl[0]) pad = this.completing ? emptyPad() : pad1;
      else if (k === this.ctrl[1]) pad = this.completing ? emptyPad() : pad2;
      else pad = (this.followMode && !this.completing) ? f.aiPad(lead, fi++) : emptyPad();
      f.ctrl = k === this.ctrl[0] ? 0 : k === this.ctrl[1] ? 1 : -1;
      f.update(pad);
    }
    for (; i < ents.length; i++) ents[i].update();
    Particles.update();
    this.updateLines();
    this.updateBubbles();
    this.tickFx();
    this.updateCamera(false);
    // goal by flag
    if (!this.completing && this.room.def.goal && this.check(this.room.def.goal)) { if (!this.goalT) this.goalT = 70; }
    if (this.goalT > 0 && !this.completing) { if (--this.goalT === 0) this.complete(); }
    if (this.completing) {
      this.completeT++;
      if (this.completeT % 30 === 0) Particles.confetti(W / 2 + this.cam.x, this.cam.y, 25);
      if (this.completeT > 200) { this.completing = 'done'; this.finish(); }
    }
    if (this.hub && this.opts.onUpdate) this.opts.onUpdate(this);
  }
  finish() {
    const res = { ep: this.epIndex, cups: this.cups, total: this.cupsTotal, mug: this.mugGot, takes: this.takes, time: this.time };
    if (this.opts.done) this.opts.done(res);
  }
  handleSwitch(p, pad) {
    const cur = this.ctrl[p];
    const other = this.ctrl[1 - p];
    let want = -1;
    if (pad.select >= 0) want = pad.select;
    if (pad.pressed.swap) want = this.nextFree(cur, 1, other);
    if (pad.pressed.swapPrev) want = this.nextFree(cur, -1, other);
    if (p === 0) for (let i = 0; i < 6; i++) if (Input.clickIn(4 + i * 22, 3, 21, 22)) want = i;
    if (want < 0 || want === cur) return;
    const f = this.friends[want];
    if (!f || !f.present) { AudioSys.sfx('deny'); return; }
    if (want === other) { AudioSys.sfx('deny'); return; }
    const old = this.friends[cur];
    if (old && old.state !== 'hold') { old.vx = 0; if (old.state === 'fix') { old.state = 'normal'; if (old.fixing) old.fixing.fixer = null; old.fixing = null; } }
    if (old) old.grabbing = null;
    this.ctrl[p] = want;
    AudioSys.sfx('swap');
    Particles.sparkle(f.cx, f.y + 4, 6);
    f.sx = 1.2; f.sy = 0.85;
    if (Math.random() < 0.25 && f.quipCool <= 0) { f.say(pick(SWAP_LINES[f.who])); f.quipCool = 200; }
  }
  tickFx() {
    if (this.shakeAmt > 0) { this.shakeX = rnd(-this.shakeAmt, this.shakeAmt); this.shakeY = rnd(-this.shakeAmt, this.shakeAmt); this.shakeAmt *= 0.85; if (this.shakeAmt < 0.3) { this.shakeAmt = 0; this.shakeX = this.shakeY = 0; } }
    for (const t of this.toasts) t.t++;
    this.toasts = this.toasts.filter(t => t.t < t.dur);
    for (const c of this.claps) c.t++;
    this.claps = this.claps.filter(c => c.t < 70);
    if (this.hintMsg && this.hintMsg.t > 0) this.hintMsg.t--;
    if (this.pulses) { for (const p of this.pulses) p.t++; this.pulses = this.pulses.filter(p => p.t < 40); }
  }
  updateBubbles() {
    for (const b of this.bubbles) {
      b.t++;
      if (b.shown < b.text.length) {
        b.shown = Math.min(b.text.length, b.shown + 1.2);
        if (Math.floor(b.shown) % 3 === 0 && b.text[Math.floor(b.shown)] !== ' ') AudioSys.blip(b.voice);
      }
    }
    this.bubbles = this.bubbles.filter(b => b.t < b.text.length + b.dur);
  }
  updateTrans() {
    const tr = this.trans;
    tr.t++;
    if (tr.t === 18) {
      if (tr.shot) Music.oneShot(pick(['bumper1', 'bumper2', 'bumper3', 'bumper4']), 0.9);
      this.loadRoom(tr.next);
    }
    const dur = tr.shot ? 120 : 36;
    if (tr.t >= dur) { this.trans = null; this.lockInput = false; }
  }
  updateCamera(snap) {
    const f = this.p1();
    if (!f) return;
    let tx = f.cx, ty = f.y + f.h / 2;
    const f2 = this.p2();
    if (f2 && f2.present) { tx = (tx + f2.cx) / 2; ty = (ty + f2.y + f2.h / 2) / 2; }
    this.cam.look = lerp(this.cam.look, (f.climbing ? 0 : f.face * 24), 0.05);
    let cx = tx + (f2 ? 0 : this.cam.look) - W / 2;
    let cy = ty - H / 2 - 12;
    const r = this.room;
    if (r.w <= W) cx = (r.w - W) / 2; else cx = clamp(cx, 0, r.w - W);
    if (r.h <= H) cy = (r.h - H); else cy = clamp(cy, 0, r.h - H);
    if (snap) { this.cam.x = cx; this.cam.y = cy; }
    else { this.cam.x += (cx - this.cam.x) * 0.12; this.cam.y += (cy - this.cam.y) * 0.1; }
    // 2P: keep both players on screen horizontally (the screen edge acts as a wall)
    if (f2 && f2.present && r.w > W && !snap) {
      for (const q of [f, f2]) {
        const lo = this.cam.x + 2, hi = this.cam.x + W - 2 - q.w;
        if (q.x < lo && !r.rectBlocked(lo, q.y, q.w, q.h, q)) q.x = lo;
        if (q.x > hi && !r.rectBlocked(hi, q.y, q.w, q.h, q)) q.x = hi;
      }
    }
  }

  // ---- drawing -------------------------------------------------------------------------
  draw() {
    const r = this.room, th = r.theme;
    const ox = Math.round(this.cam.x + this.shakeX), oy = Math.round(this.cam.y + this.shakeY);
    // background
    ctx.fillStyle = '#120c18'; ctx.fillRect(0, 0, W, H);
    if (th.ext || th.far || th.back !== 'wall' || r.decor.some(d => d.ch === 'w') || r.def.openings) drawFar(ctx, th, ox, oy, this.t, r.h);
    if (th.rainy && !this.hub) this.drawRainBehind(ox, oy);
    ctx.drawImage(r.backCanvas, -ox, -oy);
    if (this.opts.drawBack) this.opts.drawBack(ctx, ox, oy, this);
    for (const e of r.ents) if (e.back) e.draw(ctx, ox, oy);
    ctx.drawImage(r.frontCanvas, -ox, -oy);
    // animated hazard tiles
    const tx0 = Math.max(0, Math.floor(ox / T)), tx1 = Math.min(r.cols - 1, Math.floor((ox + W) / T));
    const ty0 = Math.max(0, Math.floor(oy / T)), ty1 = Math.min(r.rows - 1, Math.floor((oy + H) / T));
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const c = r.code(tx, ty);
      if (c === TL.HAZARD) drawHazardTile(ctx, th, tx * T - ox, ty * T - oy, this.t, tx);
      else if ((c === TL.CONVL || c === TL.CONVR) && r.code(tx, ty - 1) !== c) {
        const s = ((this.t * (c === TL.CONVL ? -1 : 1)) % 4 + 4) % 4;
        ctx.fillStyle = '#7a7a84'; for (let i = 0; i < 16; i += 4) ctx.fillRect(tx * T - ox + ((i + s) % 16), ty * T - oy + 1, 2, 2);
      }
    }
    // entities
    for (const e of r.ents) if (!e.back && !(e instanceof Cup || e instanceof Mug || e instanceof NPC || e instanceof Watcher || e instanceof Talker)) e.draw(ctx, ox, oy);
    for (const e of r.ents) if (e instanceof NPC || e instanceof Watcher || e instanceof Talker) e.draw(ctx, ox, oy);
    for (const e of r.ents) if (e instanceof Cup || e instanceof Mug) e.draw(ctx, ox, oy);
    // friends (inactive first)
    const order = this.friends.filter(f => f.present).sort((a, b) => (a.ctrl >= 0 ? 1 : 0) - (b.ctrl >= 0 ? 1 : 0));
    for (const f of order) f.draw(ctx, ox, oy);
    // player markers
    for (let p = 0; p < 2; p++) {
      const f = p === 0 ? this.p1() : this.p2();
      if (!f || !f.present || f.mishapT > 0) continue;
      const mx = Math.round(f.cx - ox), my = Math.round(f.y - oy) - (f.who === 'benny' ? 14 : 10) - (f.who === 'juno' ? 3 : 0) - Math.round(Math.abs(Math.sin(this.t / 10)) * 2);
      const col = p === 0 ? '#ffd23f' : '#4cc9f0';
      ctx.fillStyle = OUTLINE; ctx.fillRect(mx - 3, my - 1, 7, 4); ctx.fillRect(mx - 2, my + 3, 5, 1); ctx.fillRect(mx - 1, my + 4, 3, 1);
      ctx.fillStyle = col; ctx.fillRect(mx - 2, my, 5, 2); ctx.fillRect(mx - 1, my + 2, 3, 1); ctx.fillRect(mx, my + 3, 1, 1);
      if (Input.twoPlayer) drawText(p === 0 ? '1' : '2', mx + 5, my - 4, col, { outline: OUTLINE });
    }
    // sound pulses
    if (this.pulses) for (const p of this.pulses) {
      const rr = p.t * (p.big ? 5.4 : 3) + 6;
      ctx.strokeStyle = (p.big ? 'rgba(255,210,63,' : 'rgba(76,201,240,') + (1 - p.t / 40) * 0.7 + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(Math.round(p.x - ox), Math.round(p.y - oy), rr, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(Math.round(p.x - ox), Math.round(p.y - oy), rr * 0.6, 0, TAU); ctx.stroke();
    }
    Particles.draw(ctx, ox, oy);
    // weather
    if (th.weather === 'snow') this.drawSnow();
    // darkness
    if (r.def.dark) this.drawDark(ox, oy);
    // clapperboards
    for (const c of this.claps) drawClapper(c.x - ox, c.y - oy - c.t * 0.2, c.n, c.t);
    // toasts
    for (const t of this.toasts) {
      const a = t.t < 8 ? t.t / 8 : t.t > t.dur - 12 ? (t.dur - t.t) / 12 : 1;
      if (t.world) drawText(t.text, t.x - ox, t.y - oy - t.t * 0.3, t.col, { align: 'center', outline: OUTLINE, alpha: a });
      else drawText(t.text, t.x, t.y - t.t * 0.15, t.col, { align: 'center', outline: OUTLINE, scale: 2, alpha: a });
    }
    this.drawBubbles(ox, oy);
    if (!this.hub || this.opts.hudInHub) this.drawHUD();
    if (this.choice) this.drawChoice();
    if (this.trans) this.drawTrans();
    if (this.completing) this.drawComplete();
  }
  drawRainBehind() { }
  drawSnow() {
    for (let i = 0; i < 70; i++) {
      const x = (hash2(i, 3, 1) * W + this.t * (0.3 + hash2(i, 4, 1) * 0.4) + Math.sin(this.t / 30 + i) * 6 - this.cam.x * 0.3) % W;
      const y = (hash2(i, 5, 1) * H + this.t * (0.6 + hash2(i, 6, 1) * 0.8)) % H;
      ctx.fillStyle = i % 3 ? '#ffffff' : '#dde8f4';
      ctx.fillRect(Math.round((x + W) % W), Math.round(y), i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
    }
  }
  drawDark(ox, oy) {
    const r = this.room;
    let level = r.def.darkLevel || 0.9;
    if (r.def.lightLink && this.check(r.def.lightLink)) { this.litT = Math.min(1, (this.litT || 0) + 0.02); level *= (1 - this.litT * 0.85); }
    if (level < 0.05) return;
    const g = darkCtx;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(6,4,18,' + level + ')';

function drawSpeechBubble(shownText, fullText, hx, hy, name, col, alpha) {
  const lines = wrapText(fullText, 150);
  const shownLines = wrapText(fullText, 150);
  let w = 0;
  for (const l of lines) w = Math.max(w, textWidth(l));
  w += 10; const h = lines.length * 10 + 7 + (name ? 4 : 0);
  let x = Math.round(hx - w / 2), y = Math.round(hy - h - 6);
  x = clamp(x, 3, W - w - 3); y = clamp(y, 26, H - h - 3);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  panel(x, y, w, h, '#fbf6ec', OUTLINE);
  // tail
  const tx = clamp(hx, x + 6, x + w - 8);
  if (hy - 6 > y + h) {
    ctx.fillStyle = OUTLINE; ctx.fillRect(tx - 3, y + h - 1, 7, 2); ctx.fillRect(tx - 2, y + h + 1, 5, 2); ctx.fillRect(tx - 1, y + h + 3, 3, 2);

  }
  if (name) {
    const nw = textWidth(name) + 6;
    panel(x + 4, y - 6, nw, 10, col, OUTLINE);
    drawText(name, x + 7, y - 4, '#1b1020', {});
  }
  // reveal text progressively
  let remaining = shownText.length;
  for (let i = 0; i < shownLines.length; i++) {
    const l = shownLines[i];
    const part = l.slice(0, Math.max(0, remaining));
    remaining -= l.length + 1;
    drawText(part, x + 5, y + 5 + (name ? 3 : 0) + i * 10, '#2a1a2a', {});
  }
  ctx.globalAlpha = 1;
}

function drawClapper(x, y, n, t) {
  x = Math.round(x); y = Math.round(y);

  ctx.globalAlpha = Math.max(0, a);

function drawTouchControls() {

// ---------------------------------------------------------------------------
// 90s Memphis-pattern backdrop (title cards, credits, opening)
// ---------------------------------------------------------------------------
function drawMemphis(bg, accents, t, seed, density, clear) {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const R2 = mulberry32(seed || 7);
  const n = density || 26;
  for (let i = 0; i < n; i++) {
    const x = R2() * W, y = R2() * H, k = Math.floor(R2() * 5), c = accents[Math.floor(R2() * accents.length)];
    if (clear && x > clear[0] - 24 && x < clear[0] + clear[2] && y > clear[1] - 12 && y < clear[1] + clear[3]) continue;
    const dx = Math.sin(t / 60 + i) * 2, dy = Math.cos(t / 70 + i) * 2;
    ctx.fillStyle = c;
    if (k === 0) { // squiggle
      for (let j = 0; j < 24; j++) ctx.fillRect(Math.round(x + j + dx), Math.round(y + Math.sin(j / 3) * 3 + dy), 2, 2);
    } else if (k === 1) { // triangle
      for (let j = 0; j < 9; j++) ctx.fillRect(Math.round(x - j + dx), Math.round(y + j + dy), j * 2 + 1, 1);
    } else if (k === 2) { // dots
      for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) ctx.fillRect(Math.round(x + a * 5 + dx), Math.round(y + b * 5 + dy), 2, 2);
    } else if (k === 3) { // ring
      circleFill(x + dx, y + dy, 6, c); circleFill(x + dx, y + dy, 4, bg);
    } else { // zigzag
      for (let j = 0; j < 20; j++) ctx.fillRect(Math.round(x + j + dx), Math.round(y + Math.abs((j % 8) - 4) + dy), 2, 2);
    }
  }
}

        x += textWidth(w + ' ', 3);
        wi++;
      }
    });
    ctx.globalAlpha = 1;
    if (this.t > 170) { ctx.fillStyle = 'rgba(10,6,14,' + (this.t - 170) / 30 + ')'; ctx.fillRect(0, 0, W, H); }
  }
}

// ---------------------------------------------------------------------------
// Generic list menu
// ---------------------------------------------------------------------------
class Menu {
  constructor(title, items, opts) { this.title = title; this.items = items; this.sel = 0; this.opts = opts || {}; this.t = 0; this.skipDisabled(1); }
  skipDisabled(dir) { let n = 0; while (this.items[this.sel] && this.items[this.sel].disabled && n++ < this.items.length) this.sel = (this.sel + dir + this.items.length) % this.items.length; }
  update() {
    this.t++;
    const m = Input.menu;
    const it = () => this.items[this.sel];
    if (m.up) { this.sel = (this.sel - 1 + this.items.length) % this.items.length; this.skipDisabled(-1); AudioSys.sfx('move'); }
    if (m.down) { this.sel = (this.sel + 1) % this.items.length; this.skipDisabled(1); AudioSys.sfx('move'); }
    const cur = it();
    if (cur && (cur.type === 'slider' || cur.type === 'choice')) {
      if (m.left) { cur.change(-1); AudioSys.sfx('move'); }
      if (m.right) { cur.change(1); AudioSys.sfx('move'); }
    }
    // pointer
    const L = this.layout;
    if (L) {
      for (let i = 0; i < this.items.length; i++) {
        const r = L[i];
        if (!r) continue;
        if (Input.hoverIn(r.x, r.y, r.w, r.h) && Input.lastDevice !== 'touch' && this.sel !== i && !this.items[i].disabled) this.sel = i;
        if (Input.clickIn(r.x, r.y, r.w, r.h)) {
          if (this.items[i].disabled) { AudioSys.sfx('deny'); continue; }
          this.sel = i;
          const c = this.items[i];
          if (c.type === 'slider' || c.type === 'choice') {
            const p = Input.mouse || { x: r.x + r.w };
            c.change(p && p.x < r.x + r.w / 2 ? -1 : 1); AudioSys.sfx('move');
          } else { this.activate(); }
          return;
        }
      }
    }
    if (m.ok && this.t > 5) {
      if (cur && cur.type === 'slider') cur.change(1);
      else if (cur && cur.type === 'choice') cur.change(1);
      else this.activate();
    }
    if (m.back && this.t > 5 && this.opts.onBack) { AudioSys.sfx('back'); this.opts.onBack(); }
  }
  activate() {
    const c = this.items[this.sel];
    if (!c || c.disabled) { AudioSys.sfx('deny'); return; }
    AudioSys.sfx('confirm');
    if (c.action) c.action();
  }
  draw(cx, y, w) {
    w = w || 220;
    const rowH = 16;
    const h = 26 + this.items.length * rowH + 6;
    const x = Math.round(cx - w / 2);
    panel(x, y, w, h, '#22182c', '#ffd23f');
    panel(x + 3, y + 3, w - 6, h - 6, '#2a1e36', '#4a3a5a');
    drawText(this.title, cx, y + 9, '#ffd23f', { align: 'center' });
    this.layout = [];
    this.items.forEach((it, i) => {
      const iy = y + 24 + i * rowH;
      const sel = i === this.sel;
      this.layout[i] = { x: x + 6, y: iy - 3, w: w - 12, h: rowH - 1 };
      if (sel) { ctx.fillStyle = '#3e2c4e'; ctx.fillRect(x + 6, iy - 3, w - 12, rowH - 1); drawText('>', x + 10, iy, '#ffd23f'); }
      const col = it.disabled ? '#6a5a7a' : sel ? '#ffffff' : '#d8c8e8';
      drawText(it.label, x + 20, iy, col);
      if (it.type === 'slider') {
        const v = it.get();
        const bx = x + w - 92;
        for (let k = 0; k < 10; k++) { ctx.fillStyle = k < v ? (sel ? '#ffd23f' : '#c8a83a') : '#4a3a5a'; ctx.fillRect(bx + k * 7, iy + 1, 5, 6); }
        drawText(String(v), x + w - 14, iy, col, { align: 'right' });
      } else if (it.type === 'choice' || it.type === 'toggle') {
        drawText(it.value(), x + w - 14, iy, sel ? '#7cf29a' : '#9ad8b0', { align: 'right' });
      }
    });
    return h;
  }
}

class PauseMenu {
  constructor(level) {
    this.level = level; this.closed = false; this.mode = 'main'; this.t = 0;
    this.hub = level && level.hub;
    this.build();
  }
  build() {
    const L = this.level;
    const items = [{ label: 'Resume', action: () => this.close() }];
    if (L && !this.hub) items.push({ label: 'Retake scene', action: () => { this.close(); L.retake(); } });
    if (L) items.push({ label: 'Gang', type: 'choice', value: () => (L.followMode ? 'FOLLOW' : 'WAIT'), change: () => { L.followMode = !L.followMode; Save.data.settings.follow = L.followMode; Save.write(); } });
    items.push({ label: 'Settings', action: () => { this.mode = 'settings'; this.sub = new Menu('SETTINGS', settingsItems(() => { this.mode = 'main'; }), { onBack: () => { this.mode = 'main'; } }); } });
    items.push({ label: 'Controls', action: () => { this.mode = 'controls'; } });
    if (L && !this.hub) items.push({ label: 'Quit to the cafe', action: () => { this.close(); Music.stop(0.3); goHub(); } });
    if (this.hub) items.push({ label: 'Title screen', action: () => { this.close(); Game.go(new TitleScene()); } });
    this.menu = new Menu('PAUSED', items, { onBack: () => this.close() });
  }
  close() { this.closed = true; AudioSys.sfx('back'); }
  update() {
    this.t++;
    if (this.mode === 'main') { this.menu.update(); if (Input.pads[0].pressed.pause && this.t > 5) this.close(); }
    else if (this.mode === 'settings') this.sub.update();
    else if (this.mode === 'controls') { if ((Input.menu.ok || Input.menu.back || Input.clicks.length) && this.t > 5) { Input.clicks.length = 0; this.mode = 'main'; AudioSys.sfx('back'); } }
  }
  draw() {
    ctx.fillStyle = 'rgba(10,6,16,0.72)'; ctx.fillRect(0, 0, W, H);
    if (this.mode === 'main') {
      if (this.level && !this.hub) {

const OPENING_ROLES = [
  { who: 'dex', tag: 'The Muscle (some assembly required)' },
  { who: 'mila', tag: 'The Competitor (currently winning)' },
  { who: 'theo', tag: 'The Inventor (it almost works)' },
  { who: 'priya', tag: 'The Closer (she knows a guy)' },
  { who: 'benny', tag: 'The Magician (allegedly)' },
  { who: 'juno', tag: 'The Musician (wedding band legend)' },
];
class OpeningScene {
  constructor(opts) { this.opts = opts || {}; this.t = 0; this.startAt = null; this.wantsTouch = false; this.ended = false; }
  enter() {
    Music.stop(0); Music.play('theme', { restart: true });
    this.startAt = Music.cur ? Music.cur.start : null;
    Particles.list.length = 0;
  }
  beat() {
    const spb = 60 / 136;
    if (AudioSys.ok && this.startAt !== null && !Game.manual) return (AudioSys.now() - this.startAt) / spb;
    return this.t / 60 / spb;
  }
  update() {
    this.t++;
    Particles.update();
    if ((Input.menu.ok || Input.menu.back || Input.clicks.length) && this.t > 20) { Input.clicks.length = 0; this.finish(); return; }
    if (this.beat() > 23 * 4 + 6) this.finish();
  }
  finish() {
    if (this.ended) return; this.ended = true;
    Save.data.seenOpening = true; Save.write();
    if (Music.name === 'theme') Music.stop(0.6);
    if (this.opts.done) this.opts.done(); else Game.go(new TitleScene({ fromOpening: true }));
  }
  draw() {
    const b = this.beat(), bar = Math.floor(b / 4), inBar = b - bar * 4;
    if (bar < 2) return this.drawIntro(b);
    if (bar < 8) return this.drawFriend(OPENING_ROLES[bar - 2], inBar, bar);
    if (bar < 10) return this.drawSupporting(b - 32);
    if (bar < 14) return this.drawWalk(b - 40);
    if (bar < 18) return this.drawCouch(b - 56);
    return this.drawLogo(b - 72);
  }
  drawIntro(b) {
    drawEstablishing('cafe_night', this.t);
    const a = clamp((b - 4) / 2, 0, 1);
    if (a > 0) {
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(10,6,16,0.6)'; ctx.fillRect(0, 196, W, 34);
      drawText('LIVE FROM THE BIG COMFY COUCH...', W / 2, 206, '#f6ead8', { align: 'center' });
      ctx.globalAlpha = 1;
    }
  }
  drawFriend(role, k, bar) {
    const who = role.who, info = FRIEND_INFO[who];
    const frozen = k >= 2.5;
    const kk = frozen ? 2.5 : k;
    drawMemphis(shade(info.color, -0.55), [info.color, '#ffd23f', '#f6ead8', shade(info.color, 0.4)], frozen ? 0 : this.t, bar * 13, 34);
    // diagonal stripe
    ctx.fillStyle = shade(info.color, -0.3);
    for (let i = 0; i < 70; i++) ctx.fillRect(0, 150 + i - Math.round(i * 0.3), W, 1);
    const S = 4, x = 170, y = 236;
    const tt = Math.floor(kk * 26);
    const pose = { anim: 'idle', t: tt, expr: 'happy' };
    let prop = null;
    switch (who) {
      case 'dex': pose.anim = 'hold'; pose.expr = frozen ? 'pain' : 'strain'; prop = 'couch'; break;
      case 'mila': pose.anim = 'jump'; pose.expr = 'grin'; break;
      case 'theo': pose.anim = 'fix'; pose.expr = frozen ? 'surprised' : 'focus'; break;
      case 'priya': pose.anim = 'phone'; pose.expr = frozen ? 'wink' : 'talk'; pose.talk = !frozen; break;
      case 'benny': pose.anim = frozen ? 'cheer' : 'magic'; pose.expr = 'grin'; break;
      case 'juno': pose.anim = 'play'; pose.expr = 'grin'; break;
      default: break;
    }
    let lift = 0;
    if (who === 'mila') lift = Math.sin(Math.min(1, kk / 2.5) * Math.PI * 0.5) * 60;
    if (who === 'dex') { const cy = y - 31 * S - 8; drawCrateArt(ctx, 'couch', x - 72, cy - 16, 144, 32, 0); }
    if (who === 'benny') { const hy = frozen ? y - 120 : y - 10 - Math.min(1, kk) * 40; drawCrateArt(ctx, 'tophat', x - 40, hy, 80, 60, 0); }
    blitPerson(ctx, friendSpecId(who, 0), friendSpecFn(who, 0), pose, x, y - lift, { sx: S, sy: S });
    if (who === 'theo') { // flying toast
      const tx2 = x + 60 + kk * 40, ty2 = y - 80 - kk * 30;
      ctx.save(); ctx.translate(tx2, ty2); ctx.scale(3, 3); drawSetProp(ctx, 'toast', 0, 0, 0); ctx.restore();
      if (!frozen && this.t % 4 === 0) Particles.sparks(x + 50, y - 60, 3);
    }
    if (who === 'juno' && !frozen && this.t % 6 === 0) Particles.notes(x + 40, y - 80, 1);
    if (who === 'mila') { panel(300, 176, 120, 36, '#1b1020', '#ffd23f'); drawText('MILA     1', 360, 184, '#2ec4b6', { align: 'center' }); drawText('GRAVITY  0', 360, 196, '#f6ead8', { align: 'center' }); }
    if (who === 'priya') { panel(300, 120, 90, 30, '#f4efe6', OUTLINE); drawText('SOLD!', 345, 128, '#c83a3a', { align: 'center', scale: 2 }); }
    if (!frozen) Particles.draw(ctx, 0, 0);
    if (frozen) {
      const f = k - 2.5;
      if (f < 0.25) { ctx.fillStyle = 'rgba(255,255,255,' + (1 - f * 4) + ')'; ctx.fillRect(0, 0, W, H); }
      const slide = Ease.outBack(clamp(f / 0.5, 0, 1));
      const nx = W + 10 - slide * 210;
      panel(nx - 10, 60, 230, 74, info.color, OUTLINE);
      drawText(info.name, nx + 4, 70, '#ffffff', { scale: 5, outline: OUTLINE });
      drawText(role.tag, nx + 4, 116, '#1b1020', {});
      ctx.fillStyle = 'rgba(255,200,120,0.08)'; ctx.fillRect(0, 0, W, H);
    }
  }
  drawSupporting(b) {
    // three quick cards: Gus, Holloway, Sarge (2.67 beats each)
    const i = Math.min(2, Math.floor(b / 2.67));
    const k = b - i * 2.67;
    const data = [
      { id: 'gus', name: 'and GUS', tag: 'who owns the couch', bg: '#2a4a3a', col: '#8ac89a' },
      { id: 'holloway', name: 'and MR. HOLLOWAY', tag: 'who owns the building', bg: '#4a3a1a', col: '#d8b84a' },
      { id: 'sarge', name: 'and SARGE', tag: 'as Himself', bg: '#2a4a1a', col: '#6ac84a' },
    ][i];
    drawMemphis(data.bg, [data.col, '#f6ead8', '#ffd23f'], this.t, 50 + i, 22);
    if (data.id === 'sarge') { ctx.save(); ctx.translate(170, 220); ctx.scale(5, 5); drawIguana(ctx, 0, 0, false, this.t, { tongue: (this.t % 30) < 8 }); ctx.restore(); }
    else blitPerson(ctx, 'npc:' + data.id, npcSpecFn(data.id), { anim: data.id === 'gus' ? 'facepalm' : 'point', t: this.t, expr: data.id === 'gus' ? 'sad' : 'angry' }, 160, 236, { sx: 4, sy: 4 });
    const slide = Ease.outCubic(clamp(k / 0.6, 0, 1));
    drawText(data.name, W - 20 - (1 - slide) * -200, 90, '#ffffff', { align: 'right', scale: 3, outline: OUTLINE });
    drawText(data.tag, W - 20, 124, data.col, { align: 'right', outline: OUTLINE });
  }
  drawWalk(b) {
    // the classic group walk down the street
    drawEstablishing('building_day', 400 + b * 30);
    ctx.fillStyle = '#9c928a'; ctx.fillRect(0, 230, W, 40); ctx.fillStyle = '#c2b8ae'; ctx.fillRect(0, 228, W, 6);
    const order = ['benny', 'priya', 'theo', 'dex', 'mila', 'juno'];
    const prog = b / 16;
    order.forEach((who, i) => {
      const x = -60 + prog * 620 - i * 40;
      const pose = { anim: 'walk', t: Math.floor(b * 26 / 2) * 2 + i * 3, expr: 'happy', fast: false };
      blitPerson(ctx, friendSpecId(who, 0), friendSpecFn(who, 0), pose, x, 232 - Math.abs(Math.sin(b * Math.PI)) * 2, { sx: 2, sy: 2 });
    });
    drawText('SIX FRIENDS. ONE COUCH.', W / 2, 30, '#ffffff', { align: 'center', scale: 2, outline: OUTLINE });
  }
  drawCouch(b) {
    const set = getSet('cafe');
    ctx.save();
    const z = 1.6;
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-190, -170);
    ctx.drawImage(set.room.backCanvas, 0, 0);
    drawFar(ctx, set.room.theme, 0, 0, this.t, 270);
    ctx.drawImage(set.room.backCanvas, 0, 0);
    for (const p of set.def.props) drawSetProp(ctx, p[0], p[1], p[2], this.t, set);
    ctx.drawImage(set.room.frontCanvas, 0, 0);
    const jump = b >= 8;
    const seats = [['dex', 140], ['priya', 168], ['juno', 196], ['theo', 224]];
    for (const [who, sx] of seats) blitPerson(ctx, friendSpecId(who, 0), friendSpecFn(who, 0), { anim: jump ? 'cheer' : 'sit', t: this.t, expr: 'grin' }, sx, jump ? 222 - Math.abs(Math.sin(b * Math.PI / 2)) * 8 : 214, {});
    blitPerson(ctx, friendSpecId('mila', 0), friendSpecFn('mila', 0), { anim: jump ? 'cheer' : 'idle', t: this.t, expr: 'grin', quirk: 'mila' }, 110, 222 - (jump ? Math.abs(Math.sin(b * Math.PI / 2)) * 8 : 0), {});
    blitPerson(ctx, friendSpecId('benny', 0), friendSpecFn('benny', 0), { anim: jump ? 'cheer' : 'idle', t: this.t, expr: 'grin' }, 256, 222 - (jump ? Math.abs(Math.sin(b * Math.PI / 2 + 1)) * 8 : 0), { flip: true });
    blitPerson(ctx, 'npc:gus', npcSpecFn('gus'), { anim: 'idle', t: this.t, expr: jump ? 'smug' : 'neutral' }, 360, 160, { flip: true });
    ctx.restore();
    if (b >= 14) { if (b < 14.2) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(0, 0, W, H); } }
    if (b < 1) { ctx.fillStyle = 'rgba(10,6,14,' + (1 - b) + ')'; ctx.fillRect(0, 0, W, H); }
  }
  drawLogo(b) {
    drawMemphis('#24163a', ['#ff4f9a', '#ffd23f', '#4cc9f0', '#7cf29a', '#ff8a5a'], this.t, 99, 40);
    drawTitleLogo(W / 2, 70, b, this.t);
    if (b > 16) { drawText('A SITCOM YOU CAN PLAY', W / 2, 200, '#f6ead8', { align: 'center', outline: OUTLINE }); }
    if (b > 18 && this.t % 8 === 0) Particles.sparkle(rnd(80, 400), rnd(40, 160), 3);
    Particles.draw(ctx, 0, 0);
  }
}

// The show logo; b = beats since start of the reveal (>= 16 = fully shown)
function drawTitleLogo(cx, y, b, t) {
  const words = [['THE', '#f6ead8', 2], ["GANG'S", '#ff4f9a', 5], ['ALL', '#4cc9f0', 3], ['HERE', '#ffd23f', 5]];
  const starts = [0, 1, 2.5, 3.5];
  let yy = y;
  // line 1: THE GANG'S, line 2: ALL HERE
  const line1 = [words[0], words[1]], line2 = [words[2], words[3]];
  const drawLine = (ws, idx0, ly) => {
    const total = ws.reduce((a, w, i) => a + textWidth(w[0], w[2]) + (i ? 12 : 0), 0);
    let x = cx - total / 2;
    ws.forEach((w, i) => {
      const k = clamp((b - starts[idx0 + i]) / 0.5, 0, 1);
      if (k > 0) {
        const s = w[2] * (1 + (1 - Ease.outBack(k)) * 0.6);
        const ww = textWidth(w[0], w[2]);
        const off = w[2] === 2 ? 22 : w[2] === 3 ? 14 : 0;
        ctx.globalAlpha = k;
        drawText(w[0], x + ww / 2 + 3, ly + off + 4, '#1b1020', { scale: Math.round(s), align: 'center' });
        drawText(w[0], x + ww / 2, ly + off + Math.sin(t / 20 + i) * (k >= 1 ? 1.5 : 0), w[1], { scale: Math.round(s), align: 'center', outline: OUTLINE });
        ctx.globalAlpha = 1;
      }
      x += textWidth(w[0], w[2]) + 12;
    });
  };
  drawLine(line1, 0, yy);
  drawLine(line2, 2, yy + 56);
  // little coffee mug mascot
  if (b > 4.5) { ctx.save(); ctx.translate(cx + 150, yy + 74); ctx.scale(3, 3); drawMugIcon(ctx, 0, 0, t); ctx.restore(); }
}

// ---------------------------------------------------------------------------
// Title screen
// ---------------------------------------------------------------------------
class TitleScene {
  constructor(opts) { this.opts = opts || {}; this.t = 0; this.mode = 'main'; this.wantsTouch = false; this.build(); }
  enter() { if (Music.name !== 'title') Music.play('title', { fadeIn: 1.2 }); }
  build() {
    const started = doneCount(Save.data) > 0;
    this.menu = new Menu("", [
      { label: started ? 'Continue the show' : 'Start the show', action: () => { if (!started) playEpisode(0); else goHub(); } },
      { label: 'Players', type: 'choice', value: () => (Save.data.settings.players === 2 ? '2 (CO-OP)' : '1'), change: () => { const S = Save.data.settings; S.players = S.players === 2 ? 1 : 2; Input.twoPlayer = S.players === 2; Save.write(); } },
      { label: 'Settings', action: () => { this.mode = 'settings'; this.sub = new Menu('SETTINGS', settingsItems(() => { this.mode = 'main'; }), { onBack: () => { this.mode = 'main'; } }); } },
      { label: 'Controls', action: () => { this.mode = 'controls'; } },
      { label: 'Watch the opening', action: () => Game.go(new OpeningScene()) },
      { label: 'Credits', action: () => Game.go(new CreditsScene('end', -1, { done: () => Game.go(new TitleScene()) })) },
    ]);
  }
  update() {
    this.t++;
    if (this.mode === 'main') this.menu.update();
    else if (this.mode === 'settings') this.sub.update();
    else if ((Input.menu.ok || Input.menu.back || Input.clicks.length) && this.t > 5) { Input.clicks.length = 0; this.mode = 'main'; }
    Particles.update();
  }
  draw() {
    // café at night behind
    const set = getSet('cafe');
    drawFar(ctx, set.room.theme, 0, 0, this.t, 270);
    ctx.drawImage(set.room.backCanvas, 0, 0);
    for (const p of set.def.props) drawSetProp(ctx, p[0], p[1], p[2], this.t, set);
    ctx.drawImage(set.room.frontCanvas, 0, 0);
    const seats = [['dex', 140], ['priya', 166], ['juno', 192], ['theo', 218]];
    for (const [who, sx] of seats) blitPerson(ctx, friendSpecId(who, (Save.data.outfits || {})[who] || 0), friendSpecFn(who, (Save.data.outfits || {})[who] || 0), { anim: 'sit', t: this.t + sx, expr: 'happy', blink: ((this.t + sx * 7) % 200) < 6 }, sx, 214, {});
    blitPerson(ctx, friendSpecId('mila', (Save.data.outfits || {}).mila || 0), friendSpecFn('mila', (Save.data.outfits || {}).mila || 0), { anim: 'idle', t: this.t, quirk: 'mila' }, 100, 222, {});
    blitPerson(ctx, friendSpecId('benny', (Save.data.outfits || {}).benny || 0), friendSpecFn('benny', (Save.data.outfits || {}).benny || 0), { anim: 'idle', t: this.t, quirk: 'benny' }, 270, 222, { flip: true });
    blitPerson(ctx, 'npc:gus', npcSpecFn('gus'), { anim: 'idle', t: this.t, expr: 'neutral', blink: (this.t % 190) < 6 }, 380, 160, { flip: true });
    ctx.fillStyle = 'rgba(14,8,22,0.55)'; ctx.fillRect(0, 0, W, H);
    drawTitleLogo(W / 2, 12, 99, this.t);
    if (this.mode === 'main') this.menu.draw(362, 124, 200);
    else if (this.mode === 'settings') this.sub.draw(W / 2, 40, 260);
    else { drawControls(50); }
    const d = doneCount(Save.data), m = mugCount(Save.data);
    drawText('Episodes ' + d + '/13   Golden mugs ' + m + '/13', W / 2, H - 12, '#8a7a9a', { align: 'center' });
    if (!Save.available) drawText('(Progress will not be saved in this browser)', W / 2, H - 22, '#8a6a6a', { align: 'center' });
  }
}

// ---------------------------------------------------------------------------
// Results ("That's a wrap!")
// ---------------------------------------------------------------------------
class ResultsScene {
  constructor(epIndex, res, opts) {
    this.ep = EPISODES[epIndex]; this.epIndex = epIndex; this.res = res; this.opts = opts || {}; this.t = 0;
    const before = unlockSnapshot();
    const S = Save.data;
    this.stars = starsFor(res.cups, res.total);
    this.firstTime = !S.done[epIndex];
    S.done[epIndex] = true;
    S.stars[epIndex] = Math.max(S.stars[epIndex] || 0, this.stars);
    S.bestCups[epIndex] = Math.max(S.bestCups[epIndex] || 0, res.cups);
    if (res.mug) S.mugs[epIndex] = true;
    S.totalTakes = (S.totalTakes || 0) + res.takes;
    Save.write();
    const after = unlockSnapshot();
    this.newUnlocks = after.filter(u => !before.includes(u)).map(u => u[0] === 'o' ? 'Outfits: ' + UNLOCKS.outfits.find(o => 'o' + o.id === u).name : 'Cafe: ' + UNLOCKS.decor.find(o => 'd' + o.id === u).name);
    this.wantsTouch = false;
  }
  enter() { AudioSys.audience('applause', 0.8); Music.oneShot('fanfare', 0.7); }
  update() {
    this.t++;
    Particles.update();
    if (this.t === 40 || this.t === 70 || this.t === 100) {
      const k = (this.t - 40) / 30;
      if (k < this.stars) { AudioSys.sfx('mug'); Particles.sparkle(W / 2 - 50 + k * 50, 132, 14); }
    }
    if (this.t > 60 && (Input.menu.ok || Input.clicks.length)) { Input.clicks.length = 0; if (!this.doneF) { this.doneF = true; this.opts.done && this.opts.done(); } }
  }
  draw() {
    drawMemphis('#1e1430', ['#ff4f9a', '#ffd23f', '#4cc9f0', '#7cf29a'], this.t, 300 + this.epIndex, 26);
    panel(70, 18, W - 140, H - 36, '#22182c', '#ffd23f');
    drawText("THAT'S A WRAP!", W / 2, 28, '#ffd23f', { align: 'center', scale: 3, outline: OUTLINE });
    const ep = this.ep;
    drawText((ep.finale ? 'SEASON FINALE: ' : 'S' + ep.season + ' E' + ep.num + ': ') + ep.title.toUpperCase(), W / 2, 62, '#f6ead8', { align: 'center' });
    const r = this.res;
    const cupsShown = Math.min(r.cups, Math.floor(this.t / 2));
    drawCupIcon(ctx, W / 2 - 70, 80);
    drawText('Coffee cups  ' + cupsShown + ' / ' + r.total, W / 2 - 56, 83, '#f6ead8');
    drawMugIcon(ctx, W / 2 - 68, 96, this.t, !r.mug);
    drawText(r.mug ? 'Golden mug  FOUND!' : 'Golden mug  still hidden...', W / 2 - 52, 100, r.mug ? '#f5c542' : '#8a7a9a');
    // stars
    for (let k = 0; k < 3; k++) {
      const shown = this.t > 40 + k * 30 && k < this.stars;
      const sc = shown ? 3 + Math.max(0, 1 - (this.t - 40 - k * 30) / 10) : 3;
      drawText('★', W / 2 - 50 + k * 50, 118, shown ? '#ffd23f' : '#3a2e4a', { align: 'center', scale: Math.round(sc), outline: OUTLINE });
    }
    const secs = Math.floor(r.time / 60);
    drawText('Takes: ' + r.takes + '     Time: ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'), W / 2, 158, '#c8b8d8', { align: 'center' });
    if (this.stars < 3) drawText('85% of the cups earns 3 stars', W / 2, 170, '#8a7a9a', { align: 'center' });
    if (this.newUnlocks.length && this.t > 110) {
      drawText('NEW UNLOCKS!', W / 2, 184, '#7cf29a', { align: 'center' });
      this.newUnlocks.slice(0, 3).forEach((u, i) => drawText(u, W / 2, 196 + i * 11, '#f6ead8', { align: 'center' }));
    }
    if (this.t > 60 && (this.t >> 5) % 2) drawText('Press E / tap to roll the tag scene', W / 2, H - 30, '#d8c8e8', { align: 'center' });
    Particles.draw(ctx, 0, 0);
  }
}

// ---------------------------------------------------------------------------
// Credits (mini after each episode; full roll after the finale)
// ---------------------------------------------------------------------------
class CreditsScene {
  constructor(kind, epIndex, opts) {
    this.kind = kind; this.epIndex = epIndex; this.opts = opts || {}; this.t = 0; this.wantsTouch = false;
    this.lines = kind === 'mini' ? miniCreditLines(epIndex) : endCreditLines();
    this.speed = kind === 'mini' ? 0.5 : 0.42;
  }
  enter() { Music.play(this.kind === 'mini' ? 'minicredits' : 'credits', { restart: true }); }
  update() {
    this.t++;
    Particles.update();
    const total = this.lines.length * 14 + H + 40;
    if (this.t > 30 && (Input.menu.ok || Input.menu.back || Input.clicks.length)) { Input.clicks.length = 0; this.end(); return; }
    if (this.t * this.speed > total) this.end();
    if (this.kind !== 'mini' && this.t % 40 === 0) Particles.confetti(W / 2, -10, 6);
  }
  end() { if (this.doneF) return; this.doneF = true; Music.stop(1); if (this.opts.done) this.opts.done(); }
  draw() {
    if (this.kind === 'mini') {
      drawMemphis('#1a1226', ['#3a2a4a', '#4a3a5a'], this.t, 5, 30);
      // gang silhouettes on the left
      const set = getSet('cafe');
      ctx.save(); ctx.beginPath(); ctx.rect(14, 40, 210, 190); ctx.clip();
      ctx.translate(-30, -10);
      drawFar(ctx, set.room.theme, 0, 0, this.t, 270); ctx.drawImage(set.room.backCanvas, 0, 0);
      for (const p of set.def.props) drawSetProp(ctx, p[0], p[1], p[2], this.t, set);
      ctx.drawImage(set.room.frontCanvas, 0, 0);
      [['dex', 140], ['priya', 166], ['juno', 192], ['theo', 218]].forEach(([w, x]) => blitPerson(ctx, friendSpecId(w, 0), friendSpecFn(w, 0), { anim: 'sit', t: this.t, expr: 'happy' }, x, 214, {}));
      ctx.restore();
      frameRect(14, 40, 210, 190, '#ffd23f');
    } else {
      drawMemphis('#1e1430', ['#ff4f9a', '#ffd23f', '#4cc9f0', '#7cf29a', '#ff8a5a'], this.t, 77, 34);
    }
    const x0 = this.kind === 'mini' ? 350 : W / 2;
    let y = H + 10 - this.t * this.speed;
    for (const l of this.lines) {
      if (y > -20 && y < H + 10) {
        if (l.portrait) { ctx.drawImage(portrait(l.portrait, 0, 'happy'), Math.round(x0 - 10), Math.round(y - 4)); }
        else if (l.couch) {
          ctx.save(); ctx.translate(Math.round(x0 - 60), Math.round(y)); drawSetProp(ctx, 'couch', 0, 0, this.t, null); ctx.restore();
          ['dex', 'priya', 'juno', 'theo'].forEach((w, i) => blitPerson(ctx, friendSpecId(w, 0), friendSpecFn(w, 0), { anim: 'sit', t: this.t, expr: 'grin' }, x0 - 40 + i * 26, y + 28, {}));
          blitPerson(ctx, friendSpecId('mila', 0), friendSpecFn('mila', 0), { anim: 'cheer', t: this.t, expr: 'grin' }, x0 - 76, y + 36, {});
          blitPerson(ctx, friendSpecId('benny', 0), friendSpecFn('benny', 0), { anim: 'cheer', t: this.t + 5, expr: 'grin' }, x0 + 76, y + 36, { flip: true });
        }

// ---------------------------------------------------------------------------
// Episode director
// ---------------------------------------------------------------------------
function runSteps(steps) { let k = 0; const next = () => { const s = steps[k++]; if (s) s(next); }; next(); }
function playEpisode(i) {
  const E = EPISODES[i];
  Save.data.lastEp = i; Save.write();
  let result = null;
  const steps = [];
  if (E.previously) steps.push(next => Game.go(new CutsceneScene(E.previously, { recap: true, done: next, freezeHold: 60 })));
  steps.push(next => Game.go(new CutsceneScene(E.coldOpen, { done: next })));
  steps.push(next => Game.go(new TitleCardScene(i, { done: next }), { speed: 0.15 }));
  steps.push(next => { if (E.rooms[0].shot) Game.go(new EstablishingScene(E.rooms[0].shot, { done: next })); else next(); });
  steps.push(next => Game.go(new LevelScene(i, { done: res => { result = res; next(); } })));
  steps.push(next => Game.go(new ResultsScene(i, result, { done: next })));
  steps.push(next => Game.go(new CutsceneScene(E.tag, { done: next, freezeHold: 170 })));
  steps.push(next => Game.go(new CreditsScene('mini', i, { done: next })));
  if (E.finale) steps.push(next => Game.go(new CreditsScene('end', i, { done: next })));
  steps.push(() => goHub());
  runSteps(steps);
}
function goHub() {
  Game.go(new EstablishingScene('cafe_night', { done: () => Game.go(new HubScene(), { speed: 0.12 }), dur: 110 }));
}
function startScene() { return new BootScene(); }

class EpisodeBoard {
  constructor() { this.sel = Math.min(12, Math.max(0, firstUnplayed())); this.closed = false; this.t = 0; }
  update() {
    this.t++;
    const m = Input.menu;
    const col = this.sel === 12 ? 2 : Math.floor(this.sel / 6), row = this.sel === 12 ? 0 : this.sel % 6;
    if (m.down) { this.sel = this.sel === 12 ? 12 : (row < 5 ? this.sel + 1 : this.sel); AudioSys.sfx('move'); }
    if (m.up) { this.sel = this.sel === 12 ? 12 : (row > 0 ? this.sel - 1 : this.sel); AudioSys.sfx('move'); }
    if (m.right) { this.sel = col === 0 ? this.sel + 6 : 12; AudioSys.sfx('move'); }
    if (m.left) { this.sel = this.sel === 12 ? 6 + Math.min(5, row) : col === 1 ? this.sel - 6 : this.sel; AudioSys.sfx('move'); }
    for (let i = 0; i < 13; i++) { const r = this.rect(i); if (Input.clickIn(r.x, r.y, r.w, r.h)) { if (this.sel === i) this.play(); else { this.sel = i; AudioSys.sfx('move'); } return; } }
    if (Input.clickIn(W - 40, 8, 32, 14)) { this.close(); return; }

  drawStatus(i, x, y) {

function firstUnplayed() { for (let i = 0; i < 13; i++) if (!Save.data.done[i]) return epUnlocked(i) ? i : 0; return 12; }

class ShelfView {

      ctx.save(); ctx.translate(x, y); ctx.scale(2, 2); drawMugIcon(ctx, 0, 0, this.t + i * 7, !got); ctx.restore();

class Wardrobe {
  constructor(who) { this.who = FRIENDS.indexOf(who); this.closed = false; this.t = 0; this.sel = (Save.data.outfits[who] || 0); }
  update() {
    this.t++;
    const m = Input.menu;
    const w = FRIENDS[this.who];
    if (m.left) { this.who = (this.who + 5) % 6; this.sel = Save.data.outfits[FRIENDS[this.who]] || 0; AudioSys.sfx('move'); }
    if (m.right) { this.who = (this.who + 1) % 6; this.sel = Save.data.outfits[FRIENDS[this.who]] || 0; AudioSys.sfx('move'); }
    if (m.up) { this.sel = (this.sel + OUTFITS.length - 1) % OUTFITS.length; AudioSys.sfx('move'); }
    if (m.down) { this.sel = (this.sel + 1) % OUTFITS.length; AudioSys.sfx('move'); }
    for (let i = 0; i < OUTFITS.length; i++) if (Input.clickIn(250, 56 + i * 22, 200, 20)) { this.sel = i; this.equip(); return; }
    if (Input.clickIn(20, 100, 40, 60)) { this.who = (this.who + 5) % 6; this.sel = Save.data.outfits[FRIENDS[this.who]] || 0; return; }
    if (Input.clickIn(200, 100, 40, 60)) { this.who = (this.who + 1) % 6; this.sel = Save.data.outfits[FRIENDS[this.who]] || 0; return; }
    if (Input.clickIn(W - 40, 8, 32, 14)) { this.closed = true; return; }
    if (m.ok && this.t > 5) this.equip();
    if (m.back && this.t > 5) { this.closed = true; AudioSys.sfx('back'); }
    void w;
  }
  equip() {
    if (!outfitUnlocked(this.sel)) { AudioSys.sfx('deny'); return; }
    Save.data.outfits[FRIENDS[this.who]] = this.sel; Save.write();
    AudioSys.sfx('magic'); Particles.puff(130, 150, 14);
    PortraitCache.clear();
  }
  draw() {
    ctx.fillStyle = 'rgba(10,6,16,0.8)'; ctx.fillRect(0, 0, W, H);
    panel(10, 8, W - 20, H - 16, '#22182c', '#a66bf0');
    drawText('LOST & FOUND', W / 2, 16, '#d8b8ff', { align: 'center', scale: 2 });
    drawText('X', W - 32, 12, '#f4efe6', { scale: 2 });
    const who = FRIENDS[this.who];
    drawText('<', 36, 120, '#ffd23f', { scale: 3 }); drawText('>', 214, 120, '#ffd23f', { scale: 3 });
    const preview = outfitUnlocked(this.sel) ? this.sel : (Save.data.outfits[who] || 0);
    blitPerson(ctx, friendSpecId(who, preview), friendSpecFn(who, preview), { anim: 'idle', t: this.t, expr: 'happy', quirk: who }, 130, 196, { sx: 3, sy: 3 });
    drawText(FRIEND_INFO[who].name, 130, 206, FRIEND_INFO[who].color, { align: 'center', scale: 2 });
    OUTFITS.forEach((o, i) => {
      const y = 56 + i * 22, sel = i === this.sel, un = outfitUnlocked(i), worn = (Save.data.outfits[who] || 0) === i;
      panel(250, y, 200, 20, sel ? '#3e2c4e' : '#2a1e36', sel ? '#ffd23f' : '#4a3a5a');
      drawText(un ? o.name : 'LOCKED', 258, y + 6, un ? '#f6ead8' : '#6a5a7a');
      if (!un) { const u = UNLOCKS.outfits.find(q => q.id === i); drawText(u ? u.hint : '', 444, y + 6, '#8a7a9a', { align: 'right' }); }
      if (worn) drawText('WEARING', 444, y + 6, '#7cf29a', { align: 'right' });
    });
    drawText('←/→ friend   ↑/↓ outfit   E to wear', W / 2, H - 22, '#c8b8d8', { align: 'center' });
    Particles.draw(ctx, 0, 0);
  }
}

function deepMerge(base, over) {
  if (!over || typeof over !== 'object') return base;
  for (const k of Object.keys(over)) {
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) && over[k] && typeof over[k] === 'object') base[k] = deepMerge(base[k], over[k]);
    else if (over[k] !== undefined) base[k] = over[k];
  }
  return base;
}
const Save = {

// ---- main loop ------------------------------------------------------------------
let _last = 0, _acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (Game.manual) return;
  if (!_last) _last = now;
  let dt = (now - _last) / 1000; _last = now;
  if (dt > 0.1) dt = 0.1;
  _acc += dt;
  let steps = 0;
  while (_acc >= 1 / 60 && steps < 4) { Game.update(); _acc -= 1 / 60; steps++; }
  if (steps >= 4) _acc = 0;
  if (steps > 0) { Game.draw(); present(); }
}

function boot(snapshot) {
  Save.load(snapshot);

  if (Save.data.settings.touch === 'on') Input.touchUI = true;

  Game.setScene(startScene());

}
